"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L18\",null,{\"as\":\"footer\",\"fillWidth\":true,\"padding\":\"8\",\"horizontal\":\"center\",\"s\":{\"direction\":\"column\"},\"children\":[[\"$\",\"$L18\",null,{\"className\":\"Footer-module-scss-module__DkSkqG__mobile\",\"maxWidth\":\"m\",\"paddingY\":\"8\",\"paddingX\":\"16\",\"gap\":\"16\",\"horizontal\":\"between\",\"vertical\":\"center\",\"s\":{\"direction\":\"column\",\"horizontal\":\"center\",\"align\":\"center\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-s neutral-on-background-strong\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[\"© \",2026,\" /\"]}],[\"$\",\"span\",null,{\"className\":\"px-4\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"Rohi Rikman\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"/ Powered by caffeine and questionable life choices\"}]]}],[\"$\",\"$L18\",null,{\"gap\":\"16\",\"children\":[[\"$\",\"$L19\",\"GitHub\",{\"href\":\"https://github.com/RohiRIK\",\"icon\":\"github\",\"tooltip\":\"GitHub\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"LinkedIn\",{\"href\":\"https://www.linkedin.com/in/rohi-rikman-48831b239/\",\"icon\":\"linkedin\",\"tooltip\":\"LinkedIn\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"Email\",{\"href\":\"mailto:rohi@rohirikman.dev\",\"icon\":\"email\",\"tooltip\":\"Email\",\"size\":\"s\",\"variant\":\"ghost\"}]]}]]}],[\"$\",\"$L18\",null,{\"height\":\"80\",\"hide\":true,\"s\":{\"hide\":false}}]]}]\n"])</script><script>self.__next_f.push([1,"24:T2bc0,"])</script><script>self.__next_f.push([1,"\nMediaFusion solves a critical challenge in the streaming ecosystem: how to securely authenticate users on devices with limited input capabilities. From Stremio addons on Android TV boxes to Kodi installations on Raspberry Pis, many streaming devices lack full keyboards or browsers, making traditional OAuth flows impractical. MediaFusion addresses this by implementing the OAuth 2.0 Device Authorization Grant (RFC 8628), creating a seamless authentication experience that never requires users to enter credentials on the device itself.\n\n## What is MediaFusion?\n\nMediaFusion is an open-source streaming platform that aggregates content from configured sources-including torrent indexers, debrid services like RealDebrid and Premiumize, metadata providers, and enhancement services-into a unified interface accessible through Stremio, Kodi, or directly in a browser. Acting as an aggregation layer, it connects to over 40 external services across six major categories, eliminating the need to juggle multiple apps or websites.\n\nThe platform's strength lies in its ability to present a unified streaming experience while handling the complexity of authentication with various backend services behind the scenes.\n\n## The OAuth 2.0 Device Authorization Grant Explained\n\nThe OAuth 2.0 Device Authorization Grant (also known as \"device flow\") is specifically designed for input-constrained or browserless devices. Unlike traditional OAuth flows that require redirects or embedded browsers, device flow enables authorization through a secondary device like a smartphone or laptop.\n\nHere's how MediaFusion implements this flow:\n\n1. **Device Authorization Request**: When configuring a debrid service (like RealDebrid), MediaFusion's configuration UI makes a GET request to the provider's `/provider/device_code` endpoint to obtain a device code and user code.\n\n2. **User Code Display**: The configuration interface displays the user code and instructs the user to visit a verification URL on a separate device (typically a smartphone or computer) with full input capabilities.\n\n3. **User Authorization**: The user visits the verification URL on their secondary device, enters the user code, and grants authorization to MediaFusion.\n\n4. **Polling for Token**: While the user authorizes, MediaFusion polls the token endpoint (`/provider/authorize`) with the device code at intervals specified by the provider (typically every 5 seconds) until authorization completes or the code expires.\n\n5. **Token Reception**: Upon successful authorization, the token endpoint returns an access token, which MediaFusion encrypts and embeds in the manifest URL via the `secret_str` parameter for seamless addon configuration.\n\n![OAuth Device Flow Diagram](data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjMwMCIgeT0iMjAwIiBmb250LXNpemU9IjE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwIjpEZXZpY2UgRmxvdzwvdGV4dD48L3N2Zz4=)\n\n## Why Device Flow Provides Excellent UX for MediaFusion Users\n\nThe device flow solves the authentication dilemma for streaming addons in several key ways:\n\n- **No Browser Required on Device**: MediaFusion runs on devices that may lack browsers or have limited input (like TV boxes or Raspberry Pi setups). The device flow eliminates the need for browser-based authentication flows on these constrained devices.\n\n- **Secondary Device Authentication**: Users complete authorization on familiar devices with full keyboards and browsers-typically smartphones or laptops-making the process intuitive and error-free.\n\n- **Simple Code Entry**: Instead of entering complex credentials, users only need to input a short, alphanumeric user code (typically 6-8 characters), reducing friction and errors.\n\n- **Automatic Polling**: After displaying the user code, MediaFusion automatically handles the polling process in the background, requiring no further user interaction until authorization completes or times out.\n\n- **URL-Based Configuration**: Encrypted credentials are embedded directly in the manifest URL, eliminating separate login steps when installing the Stremio or Kodi addon. Users simply install the addon with the pre-configured manifest URL, and it just works.\n\n## Security Analysis: What Device Flow Protects Against\n\nThe device flow provides inherent security benefits by design:\n\n### What It Protects Against\n- **Credential Exposure**: User credentials (username/password) never enter the MediaFusion device interface, eliminating credential theft from compromised devices.\n- **Limited Attack Surface**: Only the device code and user code are exposed on the limited-interface device, minimizing the attack surface.\n\n### Security Considerations \u0026 Mitigations\nWhile inherently more secure than alternatives like Resource Owner Password Credentials (ROPC), device flow requires attention to several considerations:\n\n1. **User Code Brute Forcing**: RFC 8628 section 5.1 specifies that user codes must be sufficiently long and random to prevent brute-force attacks. MediaFusion relies on provider-standard implementations that typically use 8-character alphanumeric codes (62^8 ~ 218 trillion possibilities).\n\n2. **Device Code Brute Forcing**: Similarly, device codes must be sufficiently entropic (RFC 8628 section 5.2). Providers implement these with sufficient entropy to make brute-forcing impractical.\n\n3. **Phishing Risks**: Users must verify they're entering codes on legitimate provider verification pages. MediaFusion mitigates this by displaying the exact verification URL to visit.\n\n4. **Polling Abuse**: Providers must implement rate limiting on token endpoints to prevent abuse from frequent polling-a standard requirement RFC 8628 section 5.4 places on authorization servers.\n\n5. **Token Lifetime Management**: Access tokens should have appropriate expiration times, with refresh token support where applicable, limiting the window of compromise if tokens are intercepted.\n\n6. **PKCE Considerations**: While RFC 8628 doesn't mandate PKCE for device flow, some providers implement it additionally. MediaFusion works with provider implementations as-is.\n\n## Device Flow vs. Alternative OAuth Flows\n\nUnderstanding when device flow is the right choice requires comparing it to other OAuth flows:\n\n### Device Flow vs. Authorization Code + PKCE\n- **Device Flow**: Designed for input-constrained/browserless devices; uses user code + verification URL; client polls for token\n- **Auth Code + PKCE**: Requires browser/user-agent on device; uses redirect_uri; authorization server redirects back to client\n\n### Device Flow vs. ROPC (Resource Owner Password Credentials)\n- **Device Flow**: Never handles user credentials; more secure against credential theft and phishing\n- **ROPC**: Requires username/password handled by client; vulnerable to phishing, keylogging, and credential theft\n\n### When Device Flow is Appropriate\nDevice flow is ideal when:\n- Devices lack browsers or have limited input capabilities (smart TVs, streaming sticks, gaming consoles)\n- You want to avoid handling user credentials on the device\n- Users have access to a secondary device for authorization\n- Deploying streaming/media addons (Stremio/Kodi) where seamless configuration is paramount\n\n## How MediaFusion Implements Device Flow Technically\n\nBased on source code analysis, MediaFusion's implementation follows these patterns:\n\n### Device Code Request\nThe configuration UI initiates the flow by calling `GET /{provider}/device_code` (found in `resources/js/config_script.js` lines 33-60), which returns:\n- `device_code`: Used for polling the token endpoint\n- `user_code`: The code users enter on the verification page\n- `verification_uri`: The URL users should visit\n- `expires_in`: Validity period (typically 5-15 minutes)\n- `interval`: Polling interval in seconds (usually 5)\n\n### Token Polling\nWhile the user authorizes, MediaFusion POSTs to `/{provider}/authorize` with the `device_code` (lines 63-96 in config_script.js), respecting the provider-specified interval to avoid abuse.\n\n### User Code Display\nThe configuration interface (`resources/html/configure.html` lines 235-242) presents the user code and instructions clearly, often with copy-to-clipboard functionality for ease of use.\n\n### Token Storage\nUpon receiving the access token, MediaFusion:\n1. Encrypts it using AES via `utils/crypto.py` with a site-specific `settings.secret_key`\n2. Embeds the encrypted token in the manifest URL as the `secret_str` parameter\n3. This allows Stremio/Kodi addons to load configured services without additional login steps\n\nThe encryption implementation spans `utils/crypto.py` and `db/schemas.py` (lines 235-348), ensuring credentials never remain in plaintext in configurations or URLs.\n\n## Best Practices for Users When Authorizing Devices\n\nTo maximize security when using MediaFusion's device flow:\n\n1. **Verify the Verification URL**: Always ensure you're on the legitimate provider's website when entering user codes.\n2. **Use Temporary Codes**: Treat user codes as temporary passwords-don't share them or enter them on suspicious sites.\n3. **Monitor Authorized Devices**: Regularly review and revoke access for devices you no longer use via the provider's account dashboard.\n4. **Understand Token Scope**: Be aware of what permissions you're granting (typically limited to accessing your debrid/storage account).\n5. **Keep Recovery Options Updated**: Ensure account recovery methods are current in case you need to regain access.\n\n## Why This Approach Represents the Future of Device Authentication\n\nMediaFusion's implementation of OAuth 2.0 Device Flow exemplifies a broader shift in how we handle authentication for the growing ecosystem of smart devices, IoT gadgets, and media-centric hardware:\n\n- **User-Centric Security**: By separating authentication from the device interface, we achieve both security and usability without compromise.\n- **Standardized Approach**: Leveraging RFC 8628 ensures compatibility with major identity providers while benefiting from community-vetted security practices.\n- **Seamless Integration**: The URL-based credential embedding creates a truly \"set it and forget it\" experience for addon installation and configuration.\n- **Extensible Framework**: As more services adopt device flow (from Google to Azure AD), MediaFusion's modular implementation can easily integrate new providers.\n\nFor streaming enthusiasts who value both convenience and security, MediaFusion's device flow implementation demonstrates how thoughtful authentication design can make complex backend integrations disappear behind a simple, \"just works\" user experience-exactly what the modern streaming ecosystem needs.\n\n---\n\n## Related Documents\n\n## Related Documents\n\n### See Also\n- [OAuth 2.0 for Native Apps (RFC 8252)](https://www.rfc-editor.org/info/rfc8252) - Comparison with traditional OAuth flows\n- [OAuth 2.0 Threat Model and Security Considerations (RFC 6819)](https://www.rfc-editor.org/info/rfc6819) - Broader OAuth security context\n- [OAuth 2.0 Token Exchange (RFC 8693)](https://www.rfc-editor.org/info/rfc8693) - Related token exchange mechanisms"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"children\":[[\"$\",\"$L18\",null,{\"maxWidth\":12,\"m\":{\"hide\":true}}],[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"paddingTop\":\"24\",\"children\":[[\"$\",\"$L1a\",null,{\"id\":\"schema-blogPosting-/blog/intune-autopatch-with-scripts\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/blog/intune-autopatch-with-scripts\\\",\\\ bd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ScrollToHash\"]\n2a:I[605649,[\"/_next/static/chunks/74e6f4e7ff69cae2.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingNav\"]\n28:T1e71,"])</script><script>self.__next_f.push([1,"\n# Securing AI Agents: Threat Model and Guardrails for Production\n\nAI agents - LLMs augmented with tool use, memory, and planning - are now deployed in production clouds, automating cloud operations, security triage, and DevOps workflows. They bring real efficiency, but they also expand the attack surface far beyond classic prompt injection. Tool abuse, data exfiltration, and privilege escalation become practical risks the moment an agent can act on your infrastructure.\n\nThis article translates recent research and industry guidance into a zero-trust playbook that cloud security and infrastructure engineers can apply today. The core idea is simple: treat every agent like an untrusted remote employee with a limited set of privileges, and build guardrails around what it can see, touch, and do.\n\n## The Threat Model for AI Agents\n\nAgents introduce attack vectors that traditional applications do not have. Understanding them is the first step:\n\n- **Prompt injection / tool manipulation**: attacker-controlled input causes the agent to make unwanted tool calls or leak data. This can come directly from a user, or indirectly through content the agent reads (web pages, documents, emails).\n- **Data exfiltration and lateral movement**: agents with excessive permissions can read sensitive data or pivot to other services using the credentials they hold.\n- **Over-privileged agent identities**: overly broad IAM roles or service accounts turn a single compromised agent into a privilege-escalation path across your cloud.\n- **Indirect / second-order injection**: malicious data returned by a tool corrupts the agent's reasoning and triggers further actions.\n- **Runtime and supply-chain risks**: compromised tool images, unsafe plugins, and credential leakage from the agent environment itself.\n\nThese threats extend beyond the well-known LLM vulnerability lists because an agent can chain tool calls, retain state, and act autonomously. The same zero-trust mindset you apply to workloads applies here: never trust implicitly, always verify.\n\n## Least-Privilege and Attribute-Based Access Control\n\nThe single highest-impact control is limiting what an agent can do, using per-agent identities and scoped permissions (sometimes called agent-based architecture, or ABA).\n\n- **Per-agent credentials and short-lived tokens**: use workload identity (OIDC federation, Azure/Google workload identity, AWS IRSA) so agents never store long-lived secrets. Tokens are minted per run and expire quickly.\n- **Scoped tool access**: give each agent a minimal allowlist of APIs and commands, enforced at the edge through sidecar proxies or API gateways. An agent that only needs to read logs should never be able to delete cloud resources.\n- **Runtime policy engines**: enforce deny-by-default policies with tools like Open Policy Agent (OPA) or Kubernetes admission controllers (Gatekeeper) that block privileged or dangerous actions before they execute.\n\nThe principle is the same as least privilege for humans: the agent gets exactly the access its task requires, nothing more.\n\n## Securing the Agent Runtime and Deployment\n\nHow the agent runs matters as much as what it can access:\n\n- **Workload isolation**: run agent processes in sandboxed runtimes - gVisor, Kata Containers, or lightweight VMs - so a compromise stays contained.\n- **Network egress controls**: allow-list destinations per agent using Kubernetes NetworkPolicy, AWS security groups, or Azure NSGs. Block default egress to the internet.\n- **Secret management**: inject secrets via sidecar containers or CSI drivers; never mount them directly into the agent's filesystem or environment.\n- **Audit logging and tamper-evident trails**: log every tool call, LLM prompt and output, and credential access, and ship those logs to your SIEM. You cannot investigate what you did not record.\n- **Human-in-the-loop / approval gates**: require explicit approval for destructive actions - deletes, financial transactions, mass changes - either through a human review queue or a policy gate that refuses the action.\n\nIsolation plus audit gives you both blast-radius containment and the evidence needed to respond when something goes wrong.\n\n## Identity and Trust Boundaries\n\nAgents authenticate to downstream APIs like any service, so the identity layer is a natural control point:\n\n- **Workload identity federation**: agents use short-lived JWTs from Azure AD Workload Identity, Google Workload Identity Federation, or AWS IAM Roles for Service Accounts (IRSA) instead of static API keys.\n- **Mutual TLS / SPIFFE**: establish service-to-service trust between agents and backend APIs so requests are authenticated on both ends.\n- **Tool and plugin signing**: verify code signatures before loading plugins or tools, and pin versions to prevent supply-chain substitution.\n\nTreat every tool call as a cross-boundary request, and authenticate it as such.\n\n## Practical Guardrails You Can Implement Today\n\nYou do not need a multi-year program to start hardening agents. These controls are implementable this week:\n\n- **Prompt-integrity framework**: wrap untrusted tool outputs in structured metadata (for example, JSON with a `trusted: false` flag) and validate or sanitize them before feeding back into the model.\n- **Input sanitization and allow-listing**: reject prompts containing known injection patterns (for example, chat-escape sequences) at the gateway.\n- **Output encoding and sandboxed execution**: run tool-generated code in a sandbox (gVisor, Firecracker) with SELinux or AppArmor profiles enforced.\n- **Runtime detection**: deploy classifiers or anomaly detectors on prompt and tool-call streams to catch indirect injection and unexpected behavior.\n- **Preference-optimization defenses**: fine-tune models to reject malicious prompts (the SecAlign approach) as a defense-in-depth layer.\n- **Structured query defenses**: force agents to use parameterized queries or prepared statements when interacting with databases (the StruQ method) to blunt SQL-injection-style attacks.\n- **Continuous automated security auditing**: run an audit agent that periodically checks agent configurations, permission drift, and anomalous behavior, and alerts on findings.\n\nNone of these are silver bullets; they are layers. Defense in depth is the only realistic posture for a system with as much autonomy as an agent.\n\n## Conclusion and Call to Action\n\nSecuring AI agents is an extension of zero trust: verify identity, enforce least privilege, monitor everything, and assume breach. Engineers can start today by:\n\n1. Enforcing per-agent workload identities instead of shared keys.\n2. Sandboxing agent runtimes and limiting egress.\n3. Implementing egress allow-lists and scoped tool access.\n4. Adding prompt-integrity wrappers around untrusted inputs.\n5. Logging all tool interactions to the SIEM.\n\nContinuous red-team and blue-team exercises, plus automated audit agents, keep defenses current as the threat landscape evolves. The agents are getting more capable every quarter; make sure your guardrails are too.\n\n## References\n\n- OWASP GenAI / LLM security project (agent security guidance): https://genai.owasp.org/llm-top-10/\n- Astrix security - agent security research and guides: https://www.astrix.security/\n- ClawGuard - runtime security framework for indirect prompt injection\n- \"Caging the Agents\" - healthcare case study on credential sidecars and prompt-integrity frameworks\n- \"Towards Trustworthy Agentic AI\" - survey on isolation, secrets, logging, and approval mechanisms\n- SecAlign - preference optimization to defend against prompt injection\n- StruQ - structured queries to mitigate injection\n- Forcepoint - analysis of agentic AI risks\n\nAll sources are publicly accessible as of the date of this article. Content is ASCII-only as requested.\n"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"securing-ai-agents\",{\"post\":{\"metadata\":{\"title\":\"Securing AI Agents: Threat Model and Guardrails for Production\",\"subtitle\":\"\",\"publishedAt\":\"2026-08-03\",\"summary\":\"A practical guide to securing AI agents in production, covering threat model, least-privilege access, runtime security, and practical guardrails for infrastructure and security engineers.\",\"image\":\"/images/blog/securing-ai-agents.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"securing-ai-agents\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\"children\":[\"$\",\"$L2a\",null,{\"fitHeight\":true}]}]\n"])</script><script>self.__next_f.push([1,"2b:I[811052,[\"/_next/static/chunks/74e6f4e7ff69cae2.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingLink\"]\n2c:I[436122,[\"/_next/static/chunks/74e6f4e7ff69cae2.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"List\"]\n2d:I[626935,[\"/_next/static/chunks/74e6f4e7ff69cae2.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\"
