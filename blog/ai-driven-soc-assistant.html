\"maxWidth\":\"m\",\"paddingY\":\"8\",\"paddingX\":\"16\",\"gap\":\"16\",\"horizontal\":\"between\",\"vertical\":\"center\",\"s\":{\"direction\":\"column\",\"horizontal\":\"center\",\"align\":\"center\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-s neutral-on-background-strong\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[\"© \",2026,\" /\"]}],[\"$\",\"span\",null,{\"className\":\"px-4\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"Rohi Rikman\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"/ Powered by caffeine and questionable life choices\"}]]}],[\"$\",\"$L18\",null,{\"gap\":\"16\",\"children\":[[\"$\",\"$L19\",\"GitHub\",{\"href\":\"https://github.com/RohiRIK\",\"icon\":\"github\",\"tooltip\":\"GitHub\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"LinkedIn\",{\"href\":\"https://www.linkedin.com/in/rohi-rikman-48831b239/\",\"icon\":\"linkedin\",\"tooltip\":\"LinkedIn\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"Email\",{\"href\":\"mailto:rohi@rohirikman.dev\",\"icon\":\"email\",\"tooltip\":\"Email\",\"size\":\"s\",\"variant\":\"ghost\"}]]}]]}],[\"$\",\"$L18\",null,{\"height\":\"80\",\"hide\":true,\"s\":{\"hide\":false}}]]}]\n"])</script><script>self.__next_f.push([1,"24:T19dc,"])</script><script>self.__next_f.push([1,"\nDocker's AuthZ middleware is supposed to be the last line of defense - the plugin that decides whether a container operation is allowed. CVE-2026-34040, disclosed by Cyera Research in April 2026, showed that a single padded HTTP request could make every AuthZ plugin in the ecosystem invisible.\n\nThe vulnerability class had existed since Docker Engine 1.10 - February 2016. Ten years.\n\n## How the bypass worked\n\nThe attack is disarmingly simple. Docker Engine's AuthZ middleware inspects request bodies before allowing container operations. But request bodies larger than 1 megabyte are silently dropped before they reach the AuthZ plugins. The Docker daemon still processes the request normally.\n\nThat's the entire bug. A 1MB+ padded HTTP request bypasses authorization. The AuthZ plugin never sees it. The daemon executes the operation anyway.\n\nThe practical exploit: send a single padded HTTP request that creates a privileged container with host root access. No authentication bypass. No credential theft. Just a request that's too big for the security control to see.\n\n## Who was affected\n\nEvery environment using AuthZ plugins - which, in a properly configured production Docker deployment, is most of them. The affected plugins include:\n\n- **Open Policy Agent (OPA)** - the most common policy engine for container authorization\n- **Prisma Cloud** - enterprise container security\n- **Casbin** - open-source authorization\n- **Custom AuthZ plugins** - any organization that built their own authorization middleware\n\nThis is the standard recommendation for production Docker: deploy an AuthZ plugin to restrict what container operations are permitted. CVE-2026-34040 means that recommendation was providing a false sense of security for a decade.\n\n## The inheritance problem\n\nThis vulnerability is related to - but distinct from - CVE-2024-41110 (CVSS 10.0, disclosed 2024), which used a zero-length body to achieve the same bypass. Docker patched CVE-2024-41110, but the fix was incomplete. CVE-2026-34040 uses a different mechanism (oversized body vs. empty body) to achieve the same outcome.\n\nThe pattern matters: the authz bypass isn't a single bug - it's a vulnerability class in how Docker handles request body routing to plugins. Patching one specific bypass doesn't close the class. Docker Engine 29.3.1 addresses this properly.\n\n## The real-world impact\n\nThe vulnerability is particularly dangerous in three scenarios:\n\n**CI/CD pipelines.** Build systems that submit Docker API requests via the daemon socket. If an attacker can influence the request body size - through a compromised build step, a malicious Dockerfile, or a supply chain attack - they can bypass AuthZ controls to create privileged containers. In a pipeline that's supposed to run untrusted code, this is the difference between \"contained breach\" and \"full host compromise.\"\n\n**Multi-tenant container platforms.** Environments where multiple teams or customers share a Docker daemon, with AuthZ plugins enforcing isolation between tenants. The bypass means any tenant can escape their authorization boundary. Shared Docker infrastructure without user namespaces is especially exposed.\n\n**Environments using AuthZ as the primary control.** Organizations that deployed an AuthZ plugin and considered authorization handled. The plugin was the control - and it was invisible to oversized requests.\n\n## What to do\n\n### Patch immediately\n\nDocker Engine 29.3.1 addresses CVE-2026-34040. This is not a \"patch when convenient\" vulnerability - it's a complete bypass of a primary security control.\n\n```bash\n# Check your version\ndocker version\n\n# Update (Debian/Ubuntu)\nsudo apt update \u0026\u0026 sudo apt install docker-ce docker-ce-cli containerd.io\n\n# Update (RHEL/CentOS)\nsudo yum update docker-ce docker-ce-cli containerd.io\n```\n\n### Don't rely on AuthZ alone\n\nThis is the structural lesson. AuthZ plugins are a valuable layer, but they're a single point of failure in the authorization chain. The container security stack needs defense in depth:\n\n**User Namespaces.** Kubernetes 1.36 (released April 2026) graduated User Namespaces to GA. Rootless containers - pods that run without real root on the host - are now a stable, supported configuration. Even if an AuthZ bypass creates a privileged container, user namespaces limit what that privilege means on the host. The container's \"root\" is a mapped UID with no real host privileges.\n\n**Seccomp profiles.** Default seccomp profiles restrict the system calls a container can make. Even a root-privileged container can't mount the host filesystem or load kernel modules if the seccomp profile blocks those syscalls.\n\n**AppArmor/SELinux.** Mandatory access controls add another layer. A container running as root with a restrictive AppArmor profile can't escape the profile's constraints regardless of its nominal privilege level.\n\n**Read-only root filesystems.** Containers that can't write to their own filesystem can't persist payloads or modify binaries. This is a simple control that dramatically reduces post-exploitation options.\n\n### Audit your AuthZ plugins\n\nCheck whether your AuthZ plugins are updated. Some plugins may have their own mitigations or configuration changes that reduce exposure. OPA's Docker authorization policy, for example, can be updated to reject oversized request bodies at the policy level - though this is a workaround, not a fix.\n\n### Monitor for exploitation\n\nThe exploit leaves traces. Docker daemon logs record container creation events. Look for:\n\n- Privileged containers created by unexpected callers\n- Container creation requests with unusually large request bodies\n- API calls that bypass the expected authorization plugin audit trail\n\n## The container security stack is shifting\n\nCVE-2026-34040 isn't just a Docker bug - it's evidence that the container security model needs more layers. AuthZ plugins were designed as the authorization gate, but they're only as reliable as the request routing that feeds them.\n\nThe combination of K8s 1.36 User Namespaces (GA), Docker CVE-2026-34040 (AuthZ bypass), and the broader shift toward rootless containers points in one direction: the era of \"deploy a plugin and consider authorization handled\" is over. Container security needs the same defense-in-depth approach that network security learned years ago. No single control is sufficient. Every layer assumes the others might fail.\n\nPatch Docker. Enable user namespaces. Layer your controls. The vulnerability existed for a decade because the assumption was that AuthZ plugins were the boundary. They're not. They're one layer - and that layer just had a hole in it.\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"children\":[[\"$\",\"$L18\",null,{\"maxWidth\":12,\"m\":{\"hide\":true}}],[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"paddingTop\":\"24\",\"children\":[[\"$\",\"$L1a\",null,{\"id\":\"schema-blogPosting-/blog/ai-driven-soc-assistant\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/blog/ai-driven-soc-assistant\\\",\\\"sameAs\\\":[],\\\"headline\\\":\\\"AI-Driven SOC: Layering Intelligence on Top of What You Already Own\\\",\\\"description\\\":\\\"Most SOC teams don't need a new platform — they need the tools they already have to work together smarter. Here's how to build an AI-assisted security operations capability using Wazuh, Microsoft Defender, and lightweight automation.\\\",\\\"image\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/blog/ai-driven-soc-assistant.png\\\",\\\"datePublished\\\":\\\"2026-04-25\\\",\\\"dateModified\\\":\\\"2026-04-25\\\",\\\"author\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Rohi Rikman\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/about\\\",\\\"image\\\":{\\\"@type\\\":\\\"ImageObject\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/avatar.png\\\"}}}\"}}],[\"$\",\"$L10\",null,{\"maxWidth\":\"s\",\"gap\":\"16\",\"horizontal\":\"center\",\"align\":\"center\", 4\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"id\":\"recent-posts\",\"children\":\"Recent posts\"}],[\"$\",\"$L22\",null,{\"columns\":\"2\",\"s\":{\"columns\":1},\"fillWidth\":true,\"marginBottom\":\"40\",\"gap\":\"16\",\"children\":[[\"$\",\"$L23\",\"docker-cve-2026-34040\",{\"post\":{\"metadata\":{\"title\":\"Docker CVE-2026-34040: One Megabyte to Root\",\"subtitle\":\"\",\"publishedAt\":\"2026-07-17\",\"summary\":\"A size check bug in Docker Engine let attackers bypass every AuthZ plugin for a decade. Here's how the vulnerability worked, who was exposed, and what it means for your container security stack.\",\"image\":\"/images/blog/docker-cve-2026-34040.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"docker-cve-2026-34040\",\"content\":\"$24\"},\"thumbnail\":true,\"direction\":\"column\"}],\"$L25\"]}]]}],\"$L26\"]}]}],\"$L27\"]}]\n"])</script><script>self.__next_f.push([1,"29:I[988654,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ScrollToHash\"]\n2a:I[605649,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingNav\"]\n28:T1da1,"])</script><script>self.__next_f.push([1,"\nSMS MFA is on its way out. Not gradually, not optionally - Microsoft is retiring native telecom delivery for SMS and voice authentication on February 1, 2027, and passkeys are becoming the default authentication method in Entra ID starting September 1, 2026.\n\nIf you're reading this and your environment still relies on SMS as a primary or fallback second factor, the clock is already ticking. This isn't a recommendation - it's a deprecation with a hard date.\n\n## What changed and why it matters\n\nOn July 13, 2026, Microsoft published the announcement: passkeys (FIDO2/phishing-resistant) will be the default authentication method in Entra ID. The rollout begins September 1, 2026. Users currently enabled for SMS/voice will be auto-enabled for passkeys.\n\nThen on February 1, 2027, native SMS and voice delivery is retired. Organizations that still need SMS will have to contract third-party telecom partners through the Microsoft Security Store (partners announced September 18, 2026).\n\nThe driver isn't convenience - it's threat reality. AI-powered phishing campaigns now achieve click-through rates up to 54%, compared to roughly 12% for traditional phishing. Adversary-in-the-middle proxy attacks make SMS and push-based MFA fundamentally vulnerable. Passkeys bind the authentication ceremony to the legitimate origin cryptographically. There's nothing to intercept.\n\nMicrosoft's own Secure Future Initiative progress report (July 10, 2026) puts this in context: 99.97% of user/device pairs at Microsoft are now protected by phishing-resistant MFA. They're not just recommending it - they've deployed it at scale internally and are pushing the rest of the ecosystem to follow.\n\n## The timeline\n\n| Date | What happens |\n|------|-------------|\n| July 13, 2026 | Announcement published |\n| September 1, 2026 | Rollout begins - SMS/voice users auto-enabled for passkeys |\n| September 18, 2026 | Supported third-party telecom providers announced |\n| February 1, 2027 | Native SMS/voice retired |\n| September 7, 2026 | SSPR accepts only registered authentication methods (no more contact details as MFA) |\n\nThe September SSPR change is easy to miss. Self-service password reset will stop accepting unregistered email/phone as authentication methods. If your users registered a personal Gmail or a phone number they no longer have access to, they'll be locked out of SSPR. Verify registration state before September 7.\n\n## What you need to do now\n\n### Phase 1 - Audit your current state (July-August 2026)\n\nBefore you migrate anything, know what you have:\n\n1. **Inventory authentication methods per user.** In the Entra admin center, go to Users \u003e Authentication methods. Export the report. Identify every user with SMS or voice as their only registered method.\n\n2. **Check SSPR registration.** Under Password reset \u003e Authentication methods, verify what users have registered. Flag anyone with only a phone number or email as their registered method - they'll need to add a passkey before September 7.\n\n3. **Review Conditional Access policies.** Identify any policies that rely on \"Require MFA\" without specifying authentication strength. These will continue to work after February 2027 but won't enforce phishing-resistant methods. Start upgrading them to reference Authentication Strengths.\n\n4. **Audit service accounts.** Service accounts with interactive sign-ins using SMS or phone-based MFA are a blocking issue. These need certificate-based authentication or managed identity - they can't use passkeys.\n\n### Phase 2 - Deploy passkey infrastructure (August-September 2026)\n\n1. **Enable the passkey authentication method.** In Entra \u003e Protection \u003e Authentication methods, ensure FIDO2 (Security Keys) and Microsoft Authenticator (for passkey support) are enabled.\n\n2. **Create registration campaigns.** Use Entra's built-in registration campaign feature (now GA for passkeys) to prompt users during sign-in. The campaign shows a banner directing users to register a passkey. Target users who don't yet have a phishing-resistant method.\n\n3. **Deploy Windows Hello for Business.** For managed Windows devices, WHfB is the lowest-friction path. Users authenticate with biometric or PIN - it's already the login experience, just backed by a FIDO2 credential bound to the device. Verify Intune compliance policies and Hello provisioning policies are deployed.\n\n4. **Deploy Platform SSO for macOS.** For Mac users, Platform SSO uses the Secure Enclave to generate a hardware-bound key that qualifies as phishing-resistant under Authentication Strengths. Requires Intune MDM enrollment and macOS 13+.\n\n5. **Issue FIDO2 hardware keys for edge cases.** Shared workstations, kiosk scenarios, privileged users on multiple devices, and Linux workstations all need hardware keys. YubiKey 5 series or equivalent.\n\n### Phase 3 - Migrate and enforce (September 2026-January 2027)\n\n1. **Enroll in batches.** Don't enforce for everyone simultaneously. Create a security group (`sg-passkey-enrolled`), deploy a phishing-resistant Authentication Strength policy scoped to that group, and add users as they register.\n\n2. **Upgrade Conditional Access policies.** Replace \"Require MFA\" with explicit Authentication Strength references. Phishing-Resistant MFA for privileged roles and sensitive apps. Passwordless MFA as a broader baseline. Keep existing MFA policies as a safety net.\n\n3. **Monitor sign-in logs.** Filter for \"Report-only: Would have failed\" before enforcing. Identify users who would be blocked and help them register before the policy applies.\n\n4. **Cut SMS/voice before February 2027.** Don't wait for Microsoft to retire it. If you've completed passkey enrollment for your user population, disable SMS/voice in your authentication methods policy. The fewer users on a deprecated method, the cleaner the transition.\n\n## Linux support\n\nA detail that matters for heterogeneous environments: phishing-resistant MFA for Linux desktops is now available via the Microsoft identity broker. Supported on Ubuntu 24.04, 26.04, RHEL 8, 9, and 10. This means your Linux workstations can participate in the same Conditional Access policies as Windows and macOS - no exceptions needed for platform coverage.\n\n## What about third-party telecom?\n\nIf you absolutely cannot migrate away from SMS before February 2027 - legacy systems, regulatory requirements, or environments where passkey enrollment isn't feasible for a subset of users - Microsoft will support third-party telecom partners for SMS/voice delivery. The partner list goes live September 18, 2026 via the Microsoft Security Store.\n\nThis is a stopgap, not a strategy. Third-party SMS delivery adds cost, complexity, and the same phishing vulnerabilities that drove the deprecation. Use it only for the tail cases you genuinely can't reach with passkeys.\n\n## The bigger picture\n\nThis isn't just an MFA method swap. It's Microsoft aligning the entire Entra ID ecosystem around phishing-resistant authentication as the baseline. The Conditional Access policy changes in July 2026 (CA policies now apply during Windows Hello and Platform SSO registration), the September 7 SSPR tightening, and the February 2027 SMS retirement are all parts of the same trajectory.\n\nEnvironments that delay will face a forced migration with a compressed timeline. Environments that start now have six months to enroll users, test policies, and enforce gradually - which is the only way to do this without locking people out.\n\nThe passkey default isn't coming. It's already here. The question is whether you'll migrate on your terms or on Microsoft's timeline.\n"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"passkey-deadline\",{\"post\":{\"metadata\":{\"title\":\"The Passkey Deadline\",\"subtitle\":\"\",\"publishedAt\":\"2026-07-17\",\"summary\":\"Microsoft just made passkeys the default in Entra ID and set a February 2027 deadline for SMS. Here's what every organization needs to do now - and the migration roadmap that gets you there without disruption.\",\"image\":\"/images/blog/passkey-deadline.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"passkey-deadline\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\"children\":[\"$\",\"$L2a\",null,{\"fitHeight\":true}]}]\n"])</script><script>self.__next_f.push([1,"2b:I[811052,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingLink\"]\n2c:I[436122,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"List\"]\n2d:I[626935,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ListItem\"]\n"])</script><script>self.__next_f.push([1,"1e:[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Your SOC is not as under-equipped as it feels. You probably have Wazuh collecting logs, Microsoft Defender for Endpoint running on endpoints, and some kind of ticketing system. The problem isn't tooling — it's that those tools don't talk to each other intelligently, and your analysts spend too much time switching between them to do real security work.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The fix isn't buying a new platform. It's wiring what you have into a system that can pre-triage alerts, enrich them with context, and route the right ones to the right people automatically.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"This is how to build a lean AI-assisted SOC.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-core-problem-alert-volume-vs.-analyst-time\",\"children\":\"The Core Problem: Alert Volume vs. Analyst Time\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"A mid-size organization's security stack generates hundreds of alerts per day. Most of them are noise — known tooling, routine scans, misconfigured services. Your analysts know this, but they have to check every alert to know that. The result: fatigue, slow MTTR on real incidents, and talented people spending their time on things that don't matter.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"AI-assisted triage addresses this directly. The goal isn't to replace analysts — it's to handle the 60-80% of alerts that are obvious false positives, leaving analysts to focus on the alerts that actually require human reasoning.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"how-the-three-layers-fit-together\",\"children\":\"How the Three Layers Fit Together\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Think of your SOC stack as three functional layers:\"}],\"\\n\",[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Detection layer\"}],\" — Wazuh, collecting and correlating logs from across your environment\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Enrichment layer\"}],\" — AI reasoning over alert context to score and classify\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Response layer\"}],\" — SOAR playbooks that execute automatically or on approval\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Each layer handles what it's good at. Wazuh is good at volume log collection and rule-based detection. LLMs are good at synthesizing context and scoring ambiguity. Playbooks are good at executing repetitive response actions without error.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The logical data flow is detection → enrichment → response. The typical rollout order is: first wire the integration, then add one deterministic playbook, then layer AI-generated summaries and confidence scoring on top.\"}],\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\",\"\\n\",\"$L3d\",\"\\n\",\"$L3e\",\"\\n\",\"$L3f\",\"\\n\",\"$L40\",\"\\n\",\"$L41\",\"\\n\",\"$L42\",\"\\n\",\"$L43\",\"\\n\",\"$L44\",\"\\n\",\"$L45\",\"\\n\",\"$L46\",\"\\n\",\"$L47\",\"\\n\",\"$L48\",\"\\n\",\"$L49\",\"\\n\",\"$L4a\",\"\\n\",\"$L4b\",\"\\n\",\"$L4c\",\"\\n\",\"$L4d\",\"\\n\",\"$L4e\",\"\\n\",\"$L4f\",\"\\n\",\"$L50\",\"\\n\",\"$L51\",\"\\n\",\"$L52\"]\n"])</script><script>self.__next_f.push([1,"53:I[362844,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"InlineCode\"]\n54:I[597784,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"CodeBlock\"]\n2e:[\"$\",\"pre\",null,{\"children\":[\"$\",\"$L53\",null,{\"children\":\"Wazuh (log aggregation + rule detection)\\n    │\\n    │ ← Microsoft Defender alerts via ms-graph module\\n    ▼\\nAI Pre-Triage (classify + score + enrich)\\n    │\\n    ├── Low confidence → auto-close with audit log\\n    ├── Medium → analyst queue with AI-generated summary\\n    └── High → escalate with Living Response Plan\\n    │\\n    ▼\\nSOAR Playbook (automated response, human approval gate)\\n\"}]}]\n2f:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"layer-1-wazuh-microsoft-defender-integration\",\"children\":\"Layer 1: Wazuh + Microsoft Defender Integration\"}]\n30:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"Wazuh has a built-in \",[\"$\",\"$L53\",null,{\"children\":\"ms-graph\"}],\" module (Wazuh 4.6+) that polls Microsoft Graph API for security alerts from Microsoft 365 Defender. The \",[\"$\",\"$L53\",null,{\"children\":\"security/alerts_v2\"}],\" and \",[\"$\",\"$L53\",null,{\"children\":\"security/incidents\"}],\" relationships deliver the enriched Graph alert schema — MITRE ATT\u0026CK technique mapping, related file hashes, evidence details, IOC context. This is significantly richer than the legacy \",[\"$\",\"$L53\",null,{\"children\":\"alerts\"}],\" endpoint.\"]}]\n31:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"One thing to know: this is pull, not push. Wazuh polls every 5 minutes by default. If MDI generates an alert at 10:00 and Wazuh doesn't poll until 10:05, you have a 5-minute detection delay. For most SOCs this is fine. If you need sub-minute latency on critical alerts, you'd need a different architecture.\"}]\n32:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"Microsoft Graph sign-in logs have a documented ingestion delay of up to 15 minutes. If you're pulling \",[\"$\",\"$L53\",null,{\"children\":\"auditLogs/signIns\"}],\", set a longer \",[\"$\",\"$L53\",null,{\"children\":\"time_delay\"}],\" value (e.g., \",[\"$\",\"$L53\",null,{\"children\":\"15m\"}],\") or you'll silently skip sign-in events that exist but haven't been indexed yet.\"]}]\n33:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The OAuth app registration uses app-only permissions (client credentials flow) with admin consent. Create the app registration in Microsoft Entra — not in the Defender portal. The minimum permissions depend on what you're ingesting:\"}]\n34:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"$L53\",null,{\"children\":\"SecurityAlert.Read.All\"}],\" — for \",[\"$\",\"$L53\",null,{\"children\":\"alerts_v2\"}]]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"$L53\",null,{\"children\":\"SecurityIncident.Read.All\"}],\" — for \",[\"$\",\"$L53\",null,{\"children\":\"incidents\"}]]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"$L53\",null,{\"children\":\"AuditLog.Read.Al"])</script><script>self.__next_f.push([1,"l\"}],\" — if you're also pulling \",[\"$\",\"$L53\",null,{\"children\":\"auditLogs/signIns\"}]]}],\"\\n\"]}]\n35:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"An abridged ms-graph configuration (Wazuh 4.6+) looks like this — full working config will vary by version and tenant:\"}]\n36:[\"$\",\"$L54\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"\u003cms-graph\u003e\\n    \u003cenabled\u003eyes\u003c/enabled\u003e\\n    \u003crun_on_start\u003eyes\u003c/run_on_start\u003e\\n    \u003cinterval\u003e5m\u003c/interval\u003e\\n    \u003capi_auth\u003e\\n        \u003cclient_id\u003eyour_app_id\u003c/client_id\u003e\\n        \u003ctenant_id\u003eyour_tenant_id\u003c/tenant_id\u003e\\n        \u003csecret_value\u003eyour_secret_value\u003c/secret_value\u003e\\n    \u003c/api_auth\u003e\\n    \u003cresource\u003e\\n        \u003cname\u003esecurity\u003c/name\u003e\\n        \u003crelationship\u003ealerts_v2\u003c/relationship\u003e\\n        \u003crelationship\u003eincidents\u003c/relationship\u003e\\n    \u003c/resource\u003e\\n\u003c/ms-graph\u003e\\n\",\"language\":\"xml\",\"label\":\"Xml\"}],\"copyButton\":true}]\n37:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"One thing to know: this is a pull model. End-to-end visibility depends on polling interval plus Microsoft-side event availability. For sign-in logs in particular, add \",[\"$\",\"$L53\",null,{\"children\":\"time_delay\"}],\" to reduce the risk of querying before events are indexed.\"]}]\n38:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"layer-2-ai-assisted-alert-triage\",\"children\":\"Layer 2: AI-Assisted Alert Triage\"}]\n39:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"AI triage answers four questions for every incoming alert:\"}]\n3a:[\"$\",\"$L2c\",null,{\"as\":\"ol\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"What happened?\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Why does it matter relative to our environment?\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"What evidence supports it?\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"What do I do next?\"}],\"\\n\"]}]\n3b:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The practical implementation uses a RAG (Retrieval Augmented Generation) pattern. When an alert fires, the system:\"}]\n3c:[\"$\",\"$L2c\",null,{\"as\":\"ol\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Collects related telemetry — endpoint events around the same time window, identity signals, network logs\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Correlates with asset criticality — is this a Tier 1 server or a build server?\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Checks threat intelligence — VirusTotal, AbuseIPDB, AlienVault OTX\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Generates a confidence score and a pre-built investigation summary (the \\\"Living Response Plan\\\")\"}],\"\\n\"]}]\n3d:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The output that reaches the analyst isn't a raw alert — it's a structured brief: here's what fired, here's the asset, here's the context, here's the recommended action.\"}]\n3e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\""])</script><script>self.__next_f.push([1,":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"What I've found in practice: the biggest win is usually collapsing five consoles into one triage view. Rather than context-switching between Wazuh, Defender, the email gateway, and the ticketing system, the analyst gets one summary that pulls the relevant signals from each. That's what moves MTTR, not the model being smarter than a human.\"}]\n3f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The critical thing to understand: LLMs don't \\\"understand\\\" attacks. They pattern-match against training data and synthesize context. They excel at noise reduction and bringing related signals together. On novel attack patterns, they fail. Human analysts are still required for anything that genuinely breaks the pattern.\"}]\n40:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"In practice, the model writes the summary and rationale, but the confidence score should come from deterministic features — alert severity, asset criticality, IOC hits, user risk level, campaign clustering. Log the prompt context, model output, and analyst disposition for auditability and tuning.\"}]\n41:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"$\",\"strong\",null,{\"children\":\"What to let AI handle:\"}]}]\n42:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Phishing email analysis (URL parsing, domain reputation, attachment hash lookups)\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Failed login clustering (aggregate 50 failed logins into one grouped alert)\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Password spray detection triage\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Routine vulnerability scan alert enrichment\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Shift handover summaries\"}],\"\\n\"]}]\n43:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"$\",\"strong\",null,{\"children\":\"What to keep human-only:\"}]}]\n44:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Ransomware containment (irreversible)\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Account deletion\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Domain blocking\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Anything requiring legal evidence preservation\"}],\"\\n\"]}]\n45:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"layer-3-soar-playbooks\",\"children\":\"Layer 3: SOAR Playbooks\"}]\n46:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The playbook layer handles repetitive response actions. The minimum viable playbook — the kind you can build in an afternoon with Shuffle or even a Python script — handles the phishing response workflow:\"}]\n47:[\"$\",\"pre\",null,{\"children\":[\"$\",\"$L53\",null,{\"children\":\"1. Extract: sender email, subject, URLs, attachments, headers\\n2. Enrich: VirusTotal hash check, domain reputation, sender domain age, SPF"])</script><script>self.__next_f.push([1,"/DKIM/DMARC status\\n3. Classify:\\n   - High confidence (all indicators bad) → auto-quarantine matching messages, hold sender/domain blocking for analyst approval\\n   - Medium confidence (mixed signals) → queue for Tier 1 review\\n   - Low confidence (nothing conclusive) → generate analyst brief, no action\\n4. Notify: Slack/Teams alert with verdict + IOCs\\n5. Document: audit trail entry (what, when, outcome)\\n\"}]}]\n48:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The key distinction: message-scoped actions (quarantine a specific email, tag a ticket) are automatable because their blast radius is contained. Sender/domain blocking and user suspension affect the entire tenant — those always go through the approval gate.\"}]\n49:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The enrichment phase is where most playbook value comes from. A VirusTotal check that would take an analyst 3 minutes happens in 200ms. A domain reputation lookup that requires context-switching to a different tool happens automatically.\"}]\n4a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Every playbook needs an approval gate for high-impact actions. The playbook shouldn't auto-disable a user account or block a domain without a human confirming first. Build it like this:\"}]\n4b:[\"$\",\"pre\",null,{\"children\":[\"$\",\"$L53\",null,{\"children\":\"IF action == \\\"disable_user\\\" OR action == \\\"block_domain\\\":\\n    PAUSE\\n    SEND_APPROVAL_REQUEST(analyst, action_details)\\n    IF analyst APPROVES:\\n        EXECUTE\\n    ELSE:\\n        LOG(\\\"action denied by analyst\\\")\\n        ESCALATE\\n\"}]}]\n4c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The best teams measure playbook success with: alert volume reduction over time, MTTR for critical alerts, and false positive rate. If your false positive rate isn't dropping as you tune, your detection rules need work — not more automation.\"}]\n4d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-this-actually-costs\",\"children\":\"What This Actually Costs\"}]\n4e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The tooling stack above — Wazuh, Microsoft Defender, Shuffle (self-hosted, open-source) — is either free or already in your existing Microsoft licensing. The real cost is detection engineering time: writing the rules, tuning the thresholds, building the playbooks, and training the analysts to work with AI-generated briefs instead of raw alerts.\"}]\n4f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"That's not a software cost. It's a process cost. And it's the part that most teams underestimate when they buy a SOAR platform and expect it to solve their alert fatigue.\"}]\n50:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-takeaway\",\"children\":\"The Takeaway\"}]\n51:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Keep detections deterministic. Keep high-impact actions gated behind human approval. Use AI to compress the time your analysts spend context-switching — not to replace their judgment.\"}]\n52:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-backgro"])</script><script>self.__next_f.push([1,"und-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The teams that get this right start small, measure everything, and expand only when the previous step is working.\"}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"55:I[27201,[\"/_next/static/chunks/d96012bcfc98706a.js\",\"/_next/static/chunks/73e3194f06db260e.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"title\",\"0\",{\"children\":\"AI-Driven SOC: Layering Intelligence on Top of What You Already Own\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Most SOC teams don't need a new platform — they need the tools they already have to work together smarter. Here's how to build an AI-assisted security operations capability using Wazuh, Microsoft Defender, and lightweight automation.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"AI-Driven SOC: Layering Intelligence on Top of What You Already Own\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Most SOC teams don't need a new platform — they need the tools they already have to work together smarter. Here's how to build an AI-assisted security operations capability using Wazuh, Microsoft Defender, and lightweight automation.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/blog/ai-driven-soc-assistant\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:image\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/images/blog/ai-driven-soc-assistant.png\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:image:alt\",\"content\":\"AI-Driven SOC: Layering Intelligence on Top of What You Already Own\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"AI-Driven SOC: Layering Intelligence on Top of What You Already Own\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"Most SOC teams don't need a new platform — they need the tools they already have to work together smarter. Here's how to build an AI-assisted security operations capability using Wazuh, Microsoft Defender, and lightweight automation.\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:image\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/images/blog/ai-driven-soc-assistant.png\"}],[\"$\",\"link\",\"12\",{\"rel\":\"icon\",\"href\":\"/icon.png?icon.9a99efef.png\",\"sizes\":\"1024x1024\",\"type\":\"image/png\"}],[\"$\",\"$L55\",\"13\",{}]]\n"])</script></body></html>
