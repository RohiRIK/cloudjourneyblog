\"maxWidth\":\"m\",\"paddingY\":\"8\",\"paddingX\":\"16\",\"gap\":\"16\",\"horizontal\":\"between\",\"vertical\":\"center\",\"s\":{\"direction\":\"column\",\"horizontal\":\"center\",\"align\":\"center\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-s neutral-on-background-strong\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[\"© \",2026,\" /\"]}],[\"$\",\"span\",null,{\"className\":\"px-4\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"Rohi Rikman\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"/ Powered by caffeine and questionable life choices\"}]]}],[\"$\",\"$L18\",null,{\"gap\":\"16\",\"children\":[[\"$\",\"$L19\",\"GitHub\",{\"href\":\"https://github.com/RohiRIK\",\"icon\":\"github\",\"tooltip\":\"GitHub\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"LinkedIn\",{\"href\":\"https://www.linkedin.com/in/rohi-rikman-48831b239/\",\"icon\":\"linkedin\",\"tooltip\":\"LinkedIn\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"Email\",{\"href\":\"mailto:rohi@rohirikman.dev\",\"icon\":\"email\",\"tooltip\":\"Email\",\"size\":\"s\",\"variant\":\"ghost\"}]]}]]}],[\"$\",\"$L18\",null,{\"height\":\"80\",\"hide\":true,\"s\":{\"hide\":false}}]]}]\n"])</script><script>self.__next_f.push([1,"24:T1808,"])</script><script>self.__next_f.push([1,"\nIntune Autopatch automates Windows, Microsoft 365 Apps, Edge, and Teams updates to improve security and productivity. To ensure patches are correctly applied and systems remain compliant, organizations can use Intune Proactive Remediations to detect missing patches and remediate them automatically. This guide provides a verifiable, end-to-end flow for engineers to implement and validate automated patching.\n\n## Introduction\n\nAutomated patching reduces administrative overhead and improves security posture by ensuring timely updates. Windows Autopatch manages update rings and cadence as a service, while Intune Proactive Remediations allow custom detection and remediation scripts to verify patch state and fix issues automatically.\n\n## Prerequisites\n\n- Licensing: Microsoft 365 Business Premium, Windows 10/11 Education A3/A5, Windows 10/11 Enterprise E3/E5 (including F3), or VDA equivalents.\n- Device platform: Windows 10/11 Enterprise/Education, Windows IoT Enterprise (certain LTSC limitations apply).\n- Network: Internet access to Intune, Windows Update, and Autopatch endpoints.\n\n## Step 1: Verify Prerequisites\n\nConfirm licenses are assigned to users or devices. Ensure devices run supported Windows editions. Validate network connectivity to required endpoints (*.manage.microsoft.com, *.update.microsoft.com, etc.).\n\n## Step 2: Enroll Devices in Windows Autopatch\n\nIn the Microsoft Endpoint Manager admin center:\n1. Navigate to Devices \u003e Windows \u003e Windows Autopatch \u003e Enroll.\n2. Select device groups (Entra groups) to enroll.\n3. Confirm enrollment status in the Autopatch enrollment blade.\n\n## Step 3: Configure Update Rings (if needed)\n\nAutopatch creates default Test and Last rings. Review them via Intune \u003e Devices \u003e Update rings.\n- Avoid assigning custom rings to Autopatch-managed devices; rely on service-managed policies.\n- Adjust ring settings (deferral, grace periods) only for opt-out groups.\n\n## Step 4: Deploy Proactive Remediation Script for Patch Verification\n\nCreate a detection script that checks for the latest quality update KB (returns exit code 0 if compliant, non-zero if action needed). Create a remediation script that triggers Windows Update or resets Windows Update components.\n\nExample detection script (PowerShell):\n```powershell\n# Check for KB500xxxx (example)\n$hotfix = Get-HotFix -ID KB500xxxx -ErrorAction SilentlyContinue\nif ($hotfix) { exit 0 } else { exit 1 }\n```\n\nExample remediation script (PowerShell):\n```powershell\n# Trigger Windows Update scan and install\nusoclient StartScan\nusoclient StartInstall\n# Alternatively, reset Windows Update components\nnet stop wuauserv\nnet stop cryptSvc\nnet stop bits\nnet stop msiserver\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nren C:\\Windows\\System32\\catroot2 catroot2.old\nnet start wuauserv\nnet start cryptSvc\nnet start bits\nnet start msiserver\n```\n\nDeployment steps in Intune:\n1. Upload detection and remediation scripts as a script package (Intune \u003e Devices \u003e Scripts).\n2. Assign to targeting groups (can be the same Autopatch group or Entra group).\n3. Set schedule (e.g., every 8 hours) and user context (System).\n4. Enable notifications for failed detections.\n\n## Step 5: Monitor Compliance and Alerts\n\nMonitor sources:\n- Intune device compliance and update compliance reports.\n- Windows Autopatch Management Status Report (tenant-wide view of eligible devices).\n- Windows Autopatch Alert Report (active alerts, severity, impacted update types).\n\nValidation checks:\n- Detection scripts run on schedule to verify patch state.\n- Manual verification via Get-HotFix, Get-ItemProperty for registry keys, or WSUS/ConfigMgr queries.\n- Handling failed patches:\n  - Detection failure triggers remediation script (e.g., retry Windows Update, reset Windows Update components).\n  - If remediation fails, device marked non-compliant; admin can investigate logs (WindowsUpdate.log, SetupAPI.log).\n  - Rollback options: Use Windows Update for Business uninstall policies, or deploy a script to uninstall the problematic update via wusa.exe /uninstall.\n- Reporting and alerting:\n  - Configure alert rules in Intune for compliance drift.\n  - Use Autopatch alert email notifications or webhook integrations.\n  - Export reports to Power BI or Log Analytics for trend analysis.\n\n## Step 6: Remediate Failures and Verify Fixes\n\n- When detection fails, remediation script runs automatically.\n- Verify success by checking subsequent detection returns exit code 0.\n- If persistent failure, open ticket, collect logs, consider pausing the update ring for that device group.\n\n## Step 7: Review Reports and Adjust Policies\n\n- Weekly: Examine Intune update compliance trends.\n- Monthly: Review Autopatch reports for rollback/pause events.\n- Adjust ring deferrals or exclusion groups based on observed issues.\n- Update detection/remediation scripts as new KBs are released.\n\n## Sources\n\n- Windows Autopatch overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/overview/windows-autopatch-overview\n- Windows Autopatch prerequisites: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/prepare/windows-autopatch-prerequisites\n- Manage Windows Update ring policies (Intune): https://learn.microsoft.com/en-us/intune/device-updates/windows/manage-update-rings\n- Update ring settings reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/ref-update-ring-settings\n- Use Remediations to Detect and Fix Support Issues (Intune): https://learn.microsoft.com/en-us/intune/device-management/tools/deploy-remediations\n- PowerShell Scripts for Remediations reference: https://learn.microsoft.com/en-us/intune/device-management/tools/ref-remediation-scripts\n- Windows Autopatch alerts and remediations: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/alerts-remediations\n- Windows Autopatch management status report: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/windows-autopatch-management-status-report\n- Windows Autopatch groups overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/deploy/windows-autopatch-groups-overview"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",n ming experience while handling the complexity of authentication with various backend services behind the scenes.\n\n## The OAuth 2.0 Device Authorization Grant Explained\n\nThe OAuth 2.0 Device Authorization Grant (also known as \"device flow\") is specifically designed for input-constrained or browserless devices. Unlike traditional OAuth flows that require redirects or embedded browsers, device flow enables authorization through a secondary device like a smartphone or laptop.\n\nHere's how MediaFusion implements this flow:\n\n1. **Device Authorization Request**: When configuring a debrid service (like RealDebrid), MediaFusion's configuration UI makes a GET request to the provider's `/provider/device_code` endpoint to obtain a device code and user code.\n\n2. **User Code Display**: The configuration interface displays the user code and instructs the user to visit a verification URL on a separate device (typically a smartphone or computer) with full input capabilities.\n\n3. **User Authorization**: The user visits the verification URL on their secondary device, enters the user code, and grants authorization to MediaFusion.\n\n4. **Polling for Token**: While the user authorizes, MediaFusion polls the token endpoint (`/provider/authorize`) with the device code at intervals specified by the provider (typically every 5 seconds) until authorization completes or the code expires.\n\n5. **Token Reception**: Upon successful authorization, the token endpoint returns an access token, which MediaFusion encrypts and embeds in the manifest URL via the `secret_str` parameter for seamless addon configuration.\n\n![OAuth Device Flow Diagram](data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjMwMCIgeT0iMjAwIiBmb250LXNpemU9IjE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwIjpEZXZpY2UgRmxvdzwvdGV4dD48L3N2Zz4=)\n\n## Why Device Flow Provides Excellent UX for MediaFusion Users\n\nThe device flow solves the authentication dilemma for streaming addons in several key ways:\n\n- **No Browser Required on Device**: MediaFusion runs on devices that may lack browsers or have limited input (like TV boxes or Raspberry Pi setups). The device flow eliminates the need for browser-based authentication flows on these constrained devices.\n\n- **Secondary Device Authentication**: Users complete authorization on familiar devices with full keyboards and browsers—typically smartphones or laptops—making the process intuitive and error-free.\n\n- **Simple Code Entry**: Instead of entering complex credentials, users only need to input a short, alphanumeric user code (typically 6-8 characters), reducing friction and errors.\n\n- **Automatic Polling**: After displaying the user code, MediaFusion automatically handles the polling process in the background, requiring no further user interaction until authorization completes or times out.\n\n- **URL-Based Configuration**: Encrypted credentials are embedded directly in the manifest URL, eliminating separate login steps when installing the Stremio or Kodi addon. Users simply install the addon with the pre-configured manifest URL, and it just works.\n\n## Security Analysis: What Device Flow Protects Against\n\nThe device flow provides inherent security benefits by design:\n\n### What It Protects Against\n- **Credential Exposure**: User credentials (username/password) never enter the MediaFusion device interface, eliminating credential theft from compromised devices.\n- **Limited Attack Surface**: Only the device code and user code are exposed on the limited-interface device, minimizing the attack surface.\n\n### Security Considerations \u0026 Mitigations\nWhile inherently more secure than alternatives like Resource Owner Password Credentials (ROPC), device flow requires attention to several considerations:\n\n1. **User Code Brute Forcing**: RFC 8628 §5.1 specifies that user codes must be sufficiently long and random to prevent brute-force attacks. MediaFusion relies on provider-standard implementations that typically use 8-character alphanumeric codes (62^8 ≈ 218 trillion possibilities).\n\n2. **Device Code Brute Forcing**: Similarly, device codes must be sufficiently entropic (RFC 8628 §5.2). Providers implement these with sufficient entropy to make brute-forcing impractical.\n\n3. **Phishing Risks**: Users must verify they're entering codes on legitimate provider verification pages. MediaFusion mitigates this by displaying the exact verification URL to visit.\n\n4. **Polling Abuse**: Providers must implement rate limiting on token endpoints to prevent abuse from frequent polling—a standard requirement RFC 8628 §5.4 places on authorization servers.\n\n5. **Token Lifetime Management**: Access tokens should have appropriate expiration times, with refresh token support where applicable, limiting the window of compromise if tokens are intercepted.\n\n6. **PKCE Considerations**: While RFC 8628 doesn't mandate PKCE for device flow, some providers implement it additionally. MediaFusion works with provider implementations as-is.\n\n## Device Flow vs. Alternative OAuth Flows\n\nUnderstanding when device flow is the right choice requires comparing it to other OAuth flows:\n\n### Device Flow vs. Authorization Code + PKCE\n- **Device Flow**: Designed for input-constrained/browserless devices; uses user code + verification URL; client polls for token\n- **Auth Code + PKCE**: Requires browser/user-agent on device; uses redirect_uri; authorization server redirects back to client\n\n### Device Flow vs. ROPC (Resource Owner Password Credentials)\n- **Device Flow**: Never handles user credentials; more secure against credential theft and phishing\n- **ROPC**: Requires username/password handled by client; vulnerable to phishing, keylogging, and credential theft\n\n### When Device Flow is Appropriate\nDevice flow is ideal when:\n- Devices lack browsers or have limited input capabilities (smart TVs, streaming sticks, gaming consoles)\n- You want to avoid handling user credentials on the device\n- Users have access to a secondary device for authorization\n- Deploying streaming/media addons (Stremio/Kodi) where seamless configuration is paramount\n\n## How MediaFusion Implements Device Flow Technically\n\nBased on source code analysis, MediaFusion's implementation follows these patterns:\n\n### Device Code Request\nThe configuration UI initiates the flow by calling `GET /{provider}/device_code` (found in `resources/js/config_script.js` lines 33-60), which returns:\n- `device_code`: Used for polling the token endpoint\n- `user_code`: The code users enter on the verification page\n- `verification_uri`: The URL users should visit\n- `expires_in`: Validity period (typically 5-15 minutes)\n- `interval`: Polling interval in seconds (usually 5)\n\n### Token Polling\nWhile the user authorizes, MediaFusion POSTs to `/{provider}/authorize` with the `device_code` (lines 63-96 in config_script.js), respecting the provider-specified interval to avoid abuse.\n\n### User Code Display\nThe configuration interface (`resources/html/configure.html` lines 235-242) presents the user code and instructions clearly, often with copy-to-clipboard functionality for ease of use.\n\n### Token Storage\nUpon receiving the access token, MediaFusion:\n1. Encrypts it using AES via `utils/crypto.py` with a site-specific `settings.secret_key`\n2. Embeds the encrypted token in the manifest URL as the `secret_str` parameter\n3. This allows Stremio/Kodi addons to load configured services without additional login steps\n\nThe encryption implementation spans `utils/crypto.py` and `db/schemas.py` (lines 235-348), ensuring credentials never remain in plaintext in configurations or URLs.\n\n## Best Practices for Users When Authorizing Devices\n\nTo maximize security when using MediaFusion's device flow:\n\n1. **Verify the Verification URL**: Always ensure you're on the legitimate provider's website when entering user codes.\n2. **Use Temporary Codes**: Treat user codes as temporary passwords—don't share them or enter them on suspicious sites.\n3. **Monitor Authorized Devices**: Regularly review and revoke access for devices you no longer use via the provider's account dashboard.\n4. **Understand Token Scope**: Be aware of what permissions you're granting (typically limited to accessing your debrid/storage account).\n5. **Keep Recovery Options Updated**: Ensure account recovery methods are current in case you need to regain access.\n\n## Why This Approach Represents the Future of Device Authentication\n\nMediaFusion's implementation of OAuth 2.0 Device Flow exemplifies a broader shift in how we handle authentication for the growing ecosystem of smart devices, IoT gadgets, and media-centric hardware:\n\n- **User-Centric Security**: By separating authentication from the device interface, we achieve both security and usability without compromise.\n- **Standardized Approach**: Leveraging RFC 8628 ensures compatibility with major identity providers while benefiting from community-vetted security practices.\n- **Seamless Integration**: The URL-based credential embedding creates a truly \"set it and forget it\" experience for addon installation and configuration.\n- **Extensible Framework**: As more services adopt device flow (from Google to Azure AD), MediaFusion's modular implementation can easily integrate new providers.\n\nFor streaming enthusiasts who value both convenience and security, MediaFusion's device flow implementation demonstrates how thoughtful authentication design can make complex backend integrations disappear behind a simple, \"just works\" user experience—exactly what the modern streaming ecosystem needs.\n\n---\n\n## Related Documents\n\n## Related Documents\n\n### See Also\n- [OAuth 2.0 for Native Apps (RFC 8252)](https://www.rfc-editor.org/info/rfc8252) - Comparison with traditional OAuth flows\n- [OAuth 2.0 Threat Model and Security Considerations (RFC 6819)](https://www.rfc-editor.org/info/rfc6819) - Broader OAuth security context\n- [OAuth 2.0 Token Exchange (RFC 8693)](https://www.rfc-editor.org/info/rfc8693) - Related token exchange mechanisms"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"mediafusion-device-auth\",{\"post\":{\"metadata\":{\"title\":\"How MediaFusion's OAuth Device Flow Enables Secure Streaming on Any Device\",\"subtitle\":\"\",\"publishedAt\":\"2026-08-03\",\"summary\":\"Explore how MediaFusion implements OAuth 2.0 Device Authorization Grant to solve authentication challenges on input-limited streaming devices, balancing user convenience with security considerations.\",\"image\":\"/images/blog/mediafusion-device-auth.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"mediafusion-device-auth\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\"children\":[\"$\",\"$L2a\",null,{\"fitHeight\":true}]}]\n"])</script><script>self.__next_f.push([1,"2b:I[811052,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingLink\"]\n"])</script><script>self.__next_f.push([1,"1e:[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"There's a version of security that's built around the network. The idea is: defend the boundary, and everything inside is safe. Keep attackers out with firewalls, VPNs, intrusion detection. Trust the inside.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"That model has been broken for a long time. Cloud services, remote work, SaaS, third-party integrations — the \\\"inside\\\" isn't a coherent concept anymore. Your users are authenticating from coffee shops. Your apps are in Azure. Your data is in SharePoint and Salesforce and a dozen other places. There's no perimeter to defend.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"What's left is identity. And identity-first security is what it sounds like: rebuild your controls around who is authenticating, rather than where they're connecting from.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-identity-first-means-operationally\",\"children\":\"What identity-first means operationally\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The mental model shift is from \\\"is this request coming from our network?\\\" to \\\"is this principal authorized to take this action, given what I know about them right now?\\\"\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"That second question is more complex, but it's the right question. It considers:\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Authentication strength.\"}],\" Is this a password? A TOTP code? A FIDO2 hardware key? Phishing-resistant MFA is different from SMS MFA, which is different from a password. Access to sensitive resources should require authentication strength proportional to their sensitivity.\"]}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Identity assurance.\"}],\" Is this account in good standing? Has it shown anomalous behavior recently? Entra ID Protection gives you risk scores based on behavioral signals — leaked credentials, impossible travel, atypical location. A user with elevated risk should face stepped-up authentication or blocking, not the same access they'd get on a normal day.\"]}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Device context.\"}],\" What device is this authentication coming from? Is it managed by your organization? Does it pass compliance checks (encryption, patch level, EDR health)? An authentication from a compliant, managed device means something different than one from an unknown personal device.\"]}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"$L2c\",\" Does this identity have the minimum access needed for its function? Not \\\"does this person work here\\\" — \\\"does this specific person need access to this specific thing?\\\" Role creep is a real problem: people accumulate access over time as their responsibilities change, and nobody removes what's no longer needed.\"]}],\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\",\"\\n\",\"$L3d\",\"\\n\",\"$L3e\",\"\\n\",\"$L3f\"]\n"])</script><script>self.__next_f.push([1,"40:I[436122,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"List\"]\n41:I[626935,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ListItem\"]\n2c:[\"$\",\"strong\",null,{\"children\":\"Least privilege.\"}]\n2d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-practical-implementation-stack\",\"children\":\"The practical implementation stack\"}]\n2e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"In a Microsoft environment, the identity stack looks like this:\"}]\n2f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Entra ID\"}],\" as the identity provider — the central directory, authentication, and authorization source for everything. Single sign-on across apps means every authentication flows through one place you control and log.\"]}]\n30:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Conditional Access\"}],\" as the policy engine — evaluating every authentication against your rules before granting access. MFA requirements, device compliance checks, location restrictions, risk-based controls. This is where policy meets enforcement.\"]}]\n31:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Entra ID Protection\"}],\" as the risk signal — machine learning models running on authentication patterns to flag suspicious behavior. Leaked credential detection, sign-in risk scoring, user risk scoring. Feeds directly into Conditional Access policy evaluation.\"]}]\n32:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Privileged Identity Management\"}],\" for admin accounts — just-in-time access elevation for privileged roles. Nobody holds Global Admin permanently. You request elevation when you need it, with justification and approval, for a time-limited period. Full audit trail.\"]}]\n33:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Access reviews\"}],\" to fight role creep — automated campaigns that force managers to confirm whether their team members still need the access they have. If nobody confirms it, access is removed. This is how you keep least privilege from drifting over time.\"]}]\n34:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-admin-account-problem\",\"children\":\"The admin account problem\"}]\n35:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Admin accounts are the highest-value targets in an environment. They're also often the most poorly secured.\"}]\n36:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175"])</script><script>self.__next_f.push([1,"%\"},\"children\":\"The pattern I push in every environment:\"}]\n37:[\"$\",\"$L40\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L41\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"No permanent Global Admin assignment for any user account used for daily work\"}],\"\\n\",[\"$\",\"$L41\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Separate dedicated admin accounts for privileged operations, separate from daily-use accounts\"}],\"\\n\",[\"$\",\"$L41\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Phishing-resistant MFA (FIDO2 or Windows Hello for Business) required for all privileged access — no exceptions for SMS or push notifications\"}],\"\\n\",[\"$\",\"$L41\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"PIM for just-in-time elevation, with approval and justification\"}],\"\\n\",[\"$\",\"$L41\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Break-glass accounts for emergency access, with strong credentials, excluded from most policies, and monitored for any use\"}],\"\\n\"]}]\n38:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The break-glass accounts are important and often set up wrong. They need to exist — if your Conditional Access policies have a bug and lock everyone out, you need a way in. But they should have strong passwords (generated, not memorable), be excluded from Conditional Access in a scoped way, and any authentication from them should trigger an immediate alert.\"}]\n39:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"where-this-gets-hard\",\"children\":\"Where this gets hard\"}]\n3a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The hardest part isn't the technology. It's the change management.\"}]\n3b:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Users who've never needed MFA before will push back. Managers whose teams lose access to things they used to have access to will escalate. Shared accounts (the \\\"team login\\\" that five people use) break identity-first security entirely — you can't have individual accountability if people share credentials — and teams are often attached to them.\"}]\n3c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The answer isn't to make exceptions. It's to make the security requirements understandable and to make the secure path as smooth as possible. MFA that works well is less painful than people expect. Managed devices that provision automatically don't create friction after the initial setup.\"}]\n3d:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The conversation shifts from \\\"security is making our lives harder\\\" to \\\"we're building for a world where someone will try to get into our systems, and these controls are why they won't succeed.\\\"\"}]\n3e:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L21\",null,{\"maxWidth\":\"40\"}]}]\n3f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Last post in this series will be practical: what a Zero Trust rollout actually looks like in a mid-size organization, what to do first, and where the first six months usually go wrong.\"}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"42:I[27201,[\"/_next/static/chunks/d96012bcfc98706a.js\",\"/_next/static/chunks/73e3194f06db260e.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"title\",\"0\",{\"children\":\"Identity-First Security\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The network perimeter is gone. Identity is what's left. Here's what building security around identity looks like in practice and why it changes almost everything.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Identity-First Security\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"The network perimeter is gone. Identity is what's left. Here's what building security around identity looks like in practice and why it changes almost everything.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/blog/identity-first-security\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:image\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/images/blog/identity-first-security.png\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:image:alt\",\"content\":\"Identity-First Security\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"Identity-First Security\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"The network perimeter is gone. Identity is what's left. Here's what building security around identity looks like in practice and why it changes almost everything.\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:image\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/images/blog/identity-first-security.png\"}],[\"$\",\"link\",\"12\",{\"rel\":\"icon\",\"href\":\"/icon.png?icon.9a99efef.png\",\"sizes\":\"1024x1024\",\"type\":\"image/png\"}],[\"$\",\"$L42\",\"13\",{}]]\n"])</script></body></html>
