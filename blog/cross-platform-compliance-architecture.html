.push([1,"24:T1808,"])</script><script>self.__next_f.push([1,"\nIntune Autopatch automates Windows, Microsoft 365 Apps, Edge, and Teams updates to improve security and productivity. To ensure patches are correctly applied and systems remain compliant, organizations can use Intune Proactive Remediations to detect missing patches and remediate them automatically. This guide provides a verifiable, end-to-end flow for engineers to implement and validate automated patching.\n\n## Introduction\n\nAutomated patching reduces administrative overhead and improves security posture by ensuring timely updates. Windows Autopatch manages update rings and cadence as a service, while Intune Proactive Remediations allow custom detection and remediation scripts to verify patch state and fix issues automatically.\n\n## Prerequisites\n\n- Licensing: Microsoft 365 Business Premium, Windows 10/11 Education A3/A5, Windows 10/11 Enterprise E3/E5 (including F3), or VDA equivalents.\n- Device platform: Windows 10/11 Enterprise/Education, Windows IoT Enterprise (certain LTSC limitations apply).\n- Network: Internet access to Intune, Windows Update, and Autopatch endpoints.\n\n## Step 1: Verify Prerequisites\n\nConfirm licenses are assigned to users or devices. Ensure devices run supported Windows editions. Validate network connectivity to required endpoints (*.manage.microsoft.com, *.update.microsoft.com, etc.).\n\n## Step 2: Enroll Devices in Windows Autopatch\n\nIn the Microsoft Endpoint Manager admin center:\n1. Navigate to Devices \u003e Windows \u003e Windows Autopatch \u003e Enroll.\n2. Select device groups (Entra groups) to enroll.\n3. Confirm enrollment status in the Autopatch enrollment blade.\n\n## Step 3: Configure Update Rings (if needed)\n\nAutopatch creates default Test and Last rings. Review them via Intune \u003e Devices \u003e Update rings.\n- Avoid assigning custom rings to Autopatch-managed devices; rely on service-managed policies.\n- Adjust ring settings (deferral, grace periods) only for opt-out groups.\n\n## Step 4: Deploy Proactive Remediation Script for Patch Verification\n\nCreate a detection script that checks for the latest quality update KB (returns exit code 0 if compliant, non-zero if action needed). Create a remediation script that triggers Windows Update or resets Windows Update components.\n\nExample detection script (PowerShell):\n```powershell\n# Check for KB500xxxx (example)\n$hotfix = Get-HotFix -ID KB500xxxx -ErrorAction SilentlyContinue\nif ($hotfix) { exit 0 } else { exit 1 }\n```\n\nExample remediation script (PowerShell):\n```powershell\n# Trigger Windows Update scan and install\nusoclient StartScan\nusoclient StartInstall\n# Alternatively, reset Windows Update components\nnet stop wuauserv\nnet stop cryptSvc\nnet stop bits\nnet stop msiserver\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nren C:\\Windows\\System32\\catroot2 catroot2.old\nnet start wuauserv\nnet start cryptSvc\nnet start bits\nnet start msiserver\n```\n\nDeployment steps in Intune:\n1. Upload detection and remediation scripts as a script package (Intune \u003e Devices \u003e Scripts).\n2. Assign to targeting groups (can be the same Autopatch group or Entra group).\n3. Set schedule (e.g., every 8 hours) and user context (System).\n4. Enable notifications for failed detections.\n\n## Step 5: Monitor Compliance and Alerts\n\nMonitor sources:\n- Intune device compliance and update compliance reports.\n- Windows Autopatch Management Status Report (tenant-wide view of eligible devices).\n- Windows Autopatch Alert Report (active alerts, severity, impacted update types).\n\nValidation checks:\n- Detection scripts run on schedule to verify patch state.\n- Manual verification via Get-HotFix, Get-ItemProperty for registry keys, or WSUS/ConfigMgr queries.\n- Handling failed patches:\n  - Detection failure triggers remediation script (e.g., retry Windows Update, reset Windows Update components).\n  - If remediation fails, device marked non-compliant; admin can investigate logs (WindowsUpdate.log, SetupAPI.log).\n  - Rollback options: Use Windows Update for Business uninstall policies, or deploy a script to uninstall the problematic update via wusa.exe /uninstall.\n- Reporting and alerting:\n  - Configure alert rules in Intune for compliance drift.\n  - Use Autopatch alert email notifications or webhook integrations.\n  - Export reports to Power BI or Log Analytics for trend analysis.\n\n## Step 6: Remediate Failures and Verify Fixes\n\n- When detection fails, remediation script runs automatically.\n- Verify success by checking subsequent detection returns exit code 0.\n- If persistent failure, open ticket, collect logs, consider pausing the update ring for that device group.\n\n## Step 7: Review Reports and Adjust Policies\n\n- Weekly: Examine Intune update compliance trends.\n- Monthly: Review Autopatch reports for rollback/pause events.\n- Adjust ring deferrals or exclusion groups based on observed issues.\n- Update detection/remediation scripts as new KBs are released.\n\n## Sources\n\n- Windows Autopatch overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/overview/windows-autopatch-overview\n- Windows Autopatch prerequisites: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/prepare/windows-autopatch-prerequisites\n- Manage Windows Update ring policies (Intune): https://learn.microsoft.com/en-us/intune/device-updates/windows/manage-update-rings\n- Update ring settings reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/ref-update-ring-settings\n- Use Remediations to Detect and Fix Support Issues (Intune): https://learn.microsoft.com/en-us/intune/device-management/tools/deploy-remediations\n- PowerShell Scripts for Remediations reference: https://learn.microsoft.com/en-us/intune/device-management/tools/ref-remediation-scripts\n- Windows Autopatch alerts and remediations: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/alerts-remediations\n- Windows Autopatch management status report: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/windows-autopatch-management-status-report\n- Windows Autopatch groups overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/deploy/windows-autopatch-groups-overview"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"children\":[[\"$\",\"$L18\",null,{\"maxWidth\":12,\"m\":{\"hide\":true}}],[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"paddingTop\":\"24\",\"children\":[[\"$\",\"$L1a\",null,{\"id\":\"schema-blogPosting-/blog/cross-platform-compliance-architecture\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/blog/cross-platform-compliance-architecture\\\",\\\"sameAs\\\":[],\\\"headline\\\":\\\"Cross-Platform Compliance Architecture: Building a Kill-Switch Enforcement System\\\",\\\"description\\\":\\\"Most compliance frameworks treat enforcement as a checkbox. Here's how to build an actual cross-platform enforcement system that can kill access the moment a device goes non-compliant — Windows, macOS, and Linux.\\\",\\\"image\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/blog/cross-platform-compliance-architecture.png\\\",\\\"datePublished\\\":\\\"2026-04-24\\\",\\\"dateModified\\\":\\\"2026-04-24\\\",\\\"author\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Rohi Rikman\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/about\\\",\\\"image\\\":{\\\"@type\\\":\\\"ImageObject\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/avatar.png\\\"}}}\"}}],[\"$\",\"$L10\",null,{\"maxWidth\":\"s\",\"gap\":\"16\",\"horizontal\": \",null,{\"maxWidth\":\"40\"}],[\"$\",\"h2\",null,{\"className\":\"font-heading font-strong font-xl mb-24\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"id\":\"recent-posts\",\"children\":\"Recent posts\"}],[\"$\",\"$L22\",null,{\"columns\":\"2\",\"s\":{\"columns\":1},\"fillWidth\":true,\"marginBottom\":\"40\",\"gap\":\"16\",\"children\":[[\"$\",\"$L23\",\"intune-autopatch-with-scripts\",{\"post\":{\"metadata\":{\"title\":\"Intune Autopatch with Script-Based Patch Verification\",\"subtitle\":\"\",\"publishedAt\":\"2026-08-03\",\"summary\":\"Step-by-step guide to implementing Windows Autopatch with Intune Proactive Remediations for verifiable automated patching.\",\"image\":\"/images/blog/intune-autopatch-with-scripts.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"intune-autopatch-with-scripts\",\"content\":\"$24\"},\"thumbnail\":true,\"direction\":\"column\"}],\"$L25\"]}]]}],\"$L26\"]}]}],\"$L27\"]}]\n"])</script><script>self.__next_f.push([1,"29:I[988654,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ScrollToHash\"]\n2a:I[605649,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingNav\"]\n28:T2bc0,"])</script><script>self.__next_f.push([1,"\nMediaFusion solves a critical challenge in the streaming ecosystem: how to securely authenticate users on devices with limited input capabilities. From Stremio addons on Android TV boxes to Kodi installations on Raspberry Pis, many streaming devices lack full keyboards or browsers, making traditional OAuth flows impractical. MediaFusion addresses this by implementing the OAuth 2.0 Device Authorization Grant (RFC 8628), creating a seamless authentication experience that never requires users to enter credentials on the device itself.\n\n## What is MediaFusion?\n\nMediaFusion is an open-source streaming platform that aggregates content from configured sources-including torrent indexers, debrid services like RealDebrid and Premiumize, metadata providers, and enhancement services-into a unified interface accessible through Stremio, Kodi, or directly in a browser. Acting as an aggregation layer, it connects to over 40 external services across six major categories, eliminating the need to juggle multiple apps or websites.\n\nThe platform's strength lies in its ability to present a unified streaming experience while handling the complexity of authentication with various backend services behind the scenes.\n\n## The OAuth 2.0 Device Authorization Grant Explained\n\nThe OAuth 2.0 Device Authorization Grant (also known as \"device flow\") is specifically designed for input-constrained or browserless devices. Unlike traditional OAuth flows that require redirects or embedded browsers, device flow enables authorization through a secondary device like a smartphone or laptop.\n\nHere's how MediaFusion implements this flow:\n\n1. **Device Authorization Request**: When configuring a debrid service (like RealDebrid), MediaFusion's configuration UI makes a GET request to the provider's `/provider/device_code` endpoint to obtain a device code and user code.\n\n2. **User Code Display**: The configuration interface displays the user code and instructs the user to visit a verification URL on a separate device (typically a smartphone or computer) with full input capabilities.\n\n3. **User Authorization**: The user visits the verification URL on their secondary device, enters the user code, and grants authorization to MediaFusion.\n\n4. **Polling for Token**: While the user authorizes, MediaFusion polls the token endpoint (`/provider/authorize`) with the device code at intervals specified by the provider (typically every 5 seconds) until authorization completes or the code expires.\n\n5. **Token Reception**: Upon successful authorization, the token endpoint returns an access token, which MediaFusion encrypts and embeds in the manifest URL via the `secret_str` parameter for seamless addon configuration.\n\n![OAuth Device Flow Diagram](data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjMwMCIgeT0iMjAwIiBmb250LXNpemU9IjE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwIjpEZXZpY2UgRmxvdzwvdGV4dD48L3N2Zz4=)\n\n## Why Device Flow Provides Excellent UX for MediaFusion Users\n\nThe device flow solves the authentication dilemma for streaming addons in several key ways:\n\n- **No Browser Required on Device**: MediaFusion runs on devices that may lack browsers or have limited input (like TV boxes or Raspberry Pi setups). The device flow eliminates the need for browser-based authentication flows on these constrained devices.\n\n- **Secondary Device Authentication**: Users complete authorization on familiar devices with full keyboards and browsers-typically smartphones or laptops-making the process intuitive and error-free.\n\n- **Simple Code Entry**: Instead of entering complex credentials, users only need to input a short, alphanumeric user code (typically 6-8 characters), reducing friction and errors.\n\n- **Automatic Polling**: After displaying the user code, MediaFusion automatically handles the polling process in the background, requiring no further user interaction until authorization completes or times out.\n\n- **URL-Based Configuration**: Encrypted credentials are embedded directly in the manifest URL, eliminating separate login steps when installing the Stremio or Kodi addon. Users simply install the addon with the pre-configured manifest URL, and it just works.\n\n## Security Analysis: What Device Flow Protects Against\n\nThe device flow provides inherent security benefits by design:\n\n### What It Protects Against\n- **Credential Exposure**: User credentials (username/password) never enter the MediaFusion device interface, eliminating credential theft from compromised devices.\n- **Limited Attack Surface**: Only the device code and user code are exposed on the limited-interface device, minimizing the attack surface.\n\n### Security Considerations \u0026 Mitigations\nWhile inherently more secure than alternatives like Resource Owner Password Credentials (ROPC), device flow requires attention to several considerations:\n\n1. **User Code Brute Forcing**: RFC 8628 section 5.1 specifies that user codes must be sufficiently long and random to prevent brute-force attacks. MediaFusion relies on provider-standard implementations that typically use 8-character alphanumeric codes (62^8 ~ 218 trillion possibilities).\n\n2. **Device Code Brute Forcing**: Similarly, device codes must be sufficiently entropic (RFC 8628 section 5.2). Providers implement these with sufficient entropy to make brute-forcing impractical.\n\n3. **Phishing Risks**: Users must verify they're entering codes on legitimate provider verification pages. MediaFusion mitigates this by displaying the exact verification URL to visit.\n\n4. **Polling Abuse**: Providers must implement rate limiting on token endpoints to prevent abuse from frequent polling-a standard requirement RFC 8628 section 5.4 places on authorization servers.\n\n5. **Token Lifetime Management**: Access tokens should have appropriate expiration times, with refresh token support where applicable, limiting the window of compromise if tokens are intercepted.\n\n6. **PKCE Considerations**: While RFC 8628 doesn't mandate PKCE for device flow, some providers implement it additionally. MediaFusion works with provider implementations as-is.\n\n## Device Flow vs. Alternative OAuth Flows\n\nUnderstanding when device flow is the right choice requires comparing it to other OAuth flows:\n\n### Device Flow vs. Authorization Code + PKCE\n- **Device Flow**: Designed for input-constrained/browserless devices; uses user code + verification URL; client polls for token\n- **Auth Code + PKCE**: Requires browser/user-agent on device; uses redirect_uri; authorization server redirects back to client\n\n### Device Flow vs. ROPC (Resource Owner Password Credentials)\n- **Device Flow**: Never handles user credentials; more secure against credential theft and phishing\n- **ROPC**: Requires username/password handled by client; vulnerable to phishing, keylogging, and credential theft\n\n### When Device Flow is Appropriate\nDevice flow is ideal when:\n- Devices lack browsers or have limited input capabilities (smart TVs, streaming sticks, gaming consoles)\n- You want to avoid handling user credentials on the device\n- Users have access to a secondary device for authorization\n- Deploying streaming/media addons (Stremio/Kodi) where seamless configuration is paramount\n\n## How MediaFusion Implements Device Flow Technically\n\nBased on source code analysis, MediaFusion's implementation follows these patterns:\n\n### Device Code Request\nThe configuration UI initiates the flow by calling `GET /{provider}/device_code` (found in `resources/js/config_script.js` lines 33-60), which returns:\n- `device_code`: Used for polling the token endpoint\n- `user_code`: The code users enter on the verification page\n- `verification_uri`: The URL users should visit\n- `expires_in`: Validity period (typically 5-15 minutes)\n- `interval`: Polling interval in seconds (usually 5)\n\n### Token Polling\nWhile the user authorizes, MediaFusion POSTs to `/{provider}/authorize` with the `device_code` (lines 63-96 in config_script.js), respecting the provider-specified interval to avoid abuse.\n\n### User Code Display\nThe configuration interface (`resources/html/configure.html` lines 235-242) presents the user code and instructions clearly, often with copy-to-clipboard functionality for ease of use.\n\n### Token Storage\nUpon receiving the access token, MediaFusion:\n1. Encrypts it using AES via `utils/crypto.py` with a site-specific `settings.secret_key`\n2. Embeds the encrypted token in the manifest URL as the `secret_str` parameter\n3. This allows Stremio/Kodi addons to load configured services without additional login steps\n\nThe encryption implementation spans `utils/crypto.py` and `db/schemas.py` (lines 235-348), ensuring credentials never remain in plaintext in configurations or URLs.\n\n## Best Practices for Users When Authorizing Devices\n\nTo maximize security when using MediaFusion's device flow:\n\n1. **Verify the Verification URL**: Always ensure you're on the legitimate provider's website when entering user codes.\n2. **Use Temporary Codes**: Treat user codes as temporary passwords-don't share them or enter them on suspicious sites.\n3. **Monitor Authorized Devices**: Regularly review and revoke access for devices you no longer use via the provider's account dashboard.\n4. **Understand Token Scope**: Be aware of what permissions you're granting (typically limited to accessing your debrid/storage account).\n5. **Keep Recovery Options Updated**: Ensure account recovery methods are current in case you need to regain access.\n\n## Why This Approach Represents the Future of Device Authentication\n\nMediaFusion's implementation of OAuth 2.0 Device Flow exemplifies a broader shift in how we handle authentication for the growing ecosystem of smart devices, IoT gadgets, and media-centric hardware:\n\n- **User-Centric Security**: By separating authentication from the device interface, we achieve both security and usability without compromise.\n- **Standardized Approach**: Leveraging RFC 8628 ensures compatibility with major identity providers while benefiting from community-vetted security practices.\n- **Seamless Integration**: The URL-based credential embedding creates a truly \"set it and forget it\" experience for addon installation and configuration.\n- **Extensible Framework**: As more services adopt device flow (from Google to Azure AD), MediaFusion's modular implementation can easily integrate new providers.\n\nFor streaming enthusiasts who value both convenience and security, MediaFusion's device flow implementation demonstrates how thoughtful authentication design can make complex backend integrations disappear behind a simple, \"just works\" user experience-exactly what the modern streaming ecosystem needs.\n\n---\n\n## Related Documents\n\n## Related Documents\n\n### See Also\n- [OAuth 2.0 for Native Apps (RFC 8252)](https://www.rfc-editor.org/info/rfc8252) - Comparison with traditional OAuth flows\n- [OAuth 2.0 Threat Model and Security Considerations (RFC 6819)](https://www.rfc-editor.org/info/rfc6819) - Broader OAuth security context\n- [OAuth 2.0 Token Exchange (RFC 8693)](https://www.rfc-editor.org/info/rfc8693) - Related token exchange mechanisms"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"mediafusion-device-auth\",{\"post\":{\"metadata\":{\"title\":\"How MediaFusion's OAuth Device Flow Enables Secure Streaming on Any Device\",\"subtitle\":\"\",\"publishedAt\":\"2026-08-03\",\"summary\":\"Explore how MediaFusion implements OAuth 2.0 Device Authorization Grant to solve authentication challenges on input-limited streaming devices, balancing user convenience with security considerations.\",\"image\":\"/images/blog/mediafusion-device-auth.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"mediafusion-device-auth\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\"children\":[\"$\",\"$L2a\",null,{\"fitHeight\":true}]}]\n"])</script><script>self.__next_f.push([1,"2b:I[811052,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingLink\"]\n2c:I[436122,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"List\"]\n2d:I[626935,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ListItem\"]\n"])</script><script>self.__next_f.push([1,"1e:[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"When your compliance posture has to span Windows, macOS, and Linux, most teams end up with fragmented tooling, inconsistent logic, and no real enforcement teeth. They check a box on Monday and pretend the problem is solved.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The OT Security Client needed something different. They had a zero trust compliance requirement that actually had to land — across engineering workstations, OT operator stations, and back-office servers — with enforcement that could trigger automatically, not just report that something was wrong.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"This is how we built that system.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-problem-with-compliance-as-documentation\",\"children\":\"The Problem with Compliance as Documentation\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Most compliance tooling is retrospective. You run a scan, you get a report, someone reviews it, and maybe — weeks later — something gets remediated. In fast-moving OT environments, that lag is unacceptable. A non-compliant workstation on the production floor isn't an audit finding. It's a potential safety incident.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"The requirement was explicit: \",[\"$\",\"strong\",null,{\"children\":\"compliance enforcement, not compliance reporting\"}],\". Devices that don't meet the baseline shouldn't be able to access corporate resources. And \\\"corporate resources\\\" here meant everything from SharePoint to engineering tooling to the OT network segments themselves.\"]}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The stack we were working with:\"}],\"\\n\",[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Windows\"}],\" — Intune + custom PowerShell compliance scripts\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"macOS\"}],\" — Kandji blueprint compliance connector\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Linux\"}],\" — custom bash compliance checks\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Security stack\"}],\" — CrowdStrike Falcon (all platforms) + Netskope (all platforms)\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The goal was a single enforcement model that could apply across all three OS families, with a tiered response: grace period with warnings first, then hard blocks.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"windows-intune-custom-compliance-scripts\",\"children\":\"Windows: Intune Custom Compliance Scripts\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"On Windows, the enforcement mechanism is Intune's custom compliance policy. Microsoft gives you the policy framework; you supply the discovery logic.\"}],\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\",\"\\n\",\"$L3d\",\"\\n\",\"$L3e\",\"\\n\",\"$L3f\",\"\\n\",\"$L40\",\"\\n\",\"$L41\",\"\\n\",\"$L42\",\"\\n\",\"$L43\",\"\\n\",\"$L44\",\"\\n\",\"$L45\",\"\\n\",\"$L46\",\"\\n\",\"$L47\",\"\\n\",\"$L48\",\"\\n\",\"$L49\",\"\\n\",\"$L4a\",\"\\n\",\"$L4b\",\"\\n\",\"$L4c\",\"\\n\",\"$L4d\",\"\\n\",\"$L4e\",\"\\n\",\"$L4f\",\"\\n\",\"$L50\",\"\\n\",\"$L51\",\"\\n\",\"$L52\",\"\\n\",\"$L53\",\"\\n\",\"$L54\",\"\\n\",\"$L55\",\"\\n\",\"$L56\",\"\\n\",\"$L57\",\"\\n\",\"$L58\",\"\\n\",\"$L59\",\"\\n\",\"$L5a\",\"\\n\",\"$L5b\",\"\\n\",\"$L5c\",\"\\n\",\"$L5d\",\"\\n\",\"$L5e\",\"\\n\",\"$L5f\",\"\\n\",\"$L60\",\"\\n\",\"$L61\",\"\\n\",\"$L62\",\"\\n\",\"$L63\",\"\\n\",\"$L64\"]\n"])</script><script>self.__next_f.push([1,"65:I[597784,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"CodeBlock\"]\n67:I[362844,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"InlineCode\"]\n2e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"For CrowdStrike Falcon, we needed to verify two things: that the agent was installed and running, and that it was configured for the correct CID (CrowdStrike Customer ID). Just checking for the service isn't enough — a disabled or misconfigured agent still shows as \\\"installed.\\\" Note that this checks tenant binding, not active cloud reporting or recent heartbeat; for full telemetry validation you'd need vendor API-side checks.\"}]\n2f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Here's the discovery script pattern we used:\"}]\n66:T474,# Get Falcon sensor status\n$FalconService = Get-Service -Name CSFalconService -ErrorAction SilentlyContinue\n$FalconRunning = $null -ne $FalconService -and $FalconService.Status -eq 'Running'\n\n# Get Falcon sensor CID — path and method vary by Falcon version;\n# validate in your environment. Example using falconctl if available:\ntry {\n    $FalconCID = \u0026 \"C:\\Program Files\\CrowdStrike\\falconctl.exe\" get --cid 2\u003e$null\n    if (-not $FalconCID) {\n        # Fallback: read from registry (verify path in your Falcon version)\n        $FalconRegistry = Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CrowdStrike\\{9b03c1d8-50a6-4c0a-a2b0-9d0e36b6c0d}' -ErrorAction SilentlyContinue\n        if ($FalconRegistry) {\n            $FalconCID = $FalconRegistry.DefaultPivotTenantCID\n        }\n    }\n} catch {}\n$FalconCID = $FalconCID | Where-Object { $_ -ne $null } | Select-Object -First 1\n\n# Expected CID for this tenant\n$ExpectedCID = \"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n\n$Compliant = $FalconRunning -and $FalconCID -eq $ExpectedCID\n\nreturn @{\n    FalconRunning = $FalconRunning\n    FalconCID = $FalconCID\n    Compliant = $Compliant\n} | ConvertTo-Json -Compress\n30:[\"$\",\"$L65\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"$66\",\"language\":\"powershell\",\"label\":\"Powershell\"}],\"copyButton\":true}]\n31:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The JSON definition that pairs with this script defines what \\\"compliant\\\" means for Intune's evaluation engine:\"}]\n32:[\"$\",\"$L65\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"{\\n  \\\"Rules\\\": [\\n    {\\n      \\\"SettingName\\\": \\\"Compliant\\\",\\n      \\\"Operator\\\": \\\"IsEquals\\\",\\n      \\\"DataType\\\": \\\"Boolean\\\",\\n      \\\"Operand\\\": true,\\n      \\\"MoreInfoUrl\\\": \\\"https://claroty.com\\\",\\n      \\\"RemediationStrings\\\": [\\n        {\\n          \\\"Language\\\": \\\"en_US\\\",\\n          \\\"Title\\\": \\\"CrowdStrike Falcon Not Compliant\\\",\\n          \\\"Description\\\": \\\"This device is not running Falcon or is not bound to the correct tenant. Contact IT.\\\"\\n        }\\n      ]\\n    }\\n  ]\\n}\\n\",\"language\":\"json\",\"label\":\"Json\"}],\"copyButton\":true}]\n33:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"For Netskope, the pattern is similar — check that the Netskope Client service is running and that the tenant URL is configured correctly. We combined both into a single compliance script per platform to minimiz"])</script><script>self.__next_f.push([1,"e policy overhead.\"}]\n34:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"macos-kandji-blueprint-compliance-connector\",\"children\":\"macOS: Kandji Blueprint Compliance Connector\"}]\n35:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Kandji is the Mac MDM of choice for this environment. Unlike Intune's custom script model, Kandji has a built-in compliance connector that maps directly to its blueprint system. You define compliance items as part of a blueprint, assign the blueprint to devices, and Kandji handles the evaluation loop — no custom scripts required for native checks.\"}]\n36:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h3\",\"id\":\"the-compliance-item-stack\",\"children\":\"The Compliance Item Stack\"}]\n37:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The key compliance items for this deployment:\"}]\n"])</script><script>self.__next_f.push([1,"38:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"CrowdStrike Falcon for macOS\"}],\" — Kandji's library includes a built-in device compliance check for Falcon, which verifies the sensor is installed and running. But like Windows, we needed to validate that it was reporting to the correct CID. Kandji calls this a \",[\"$\",\"strong\",null,{\"children\":\"custom compliance item\"}],\" — you write a shell script that returns a pass/fail, Kandji evaluates it on-device, and the result becomes a compliance signal you can use in assignment logic.\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Netskope Client\"}],\" — Custom compliance item, same pattern as Falcon: script checks that the Netskope service is running and the tenant URL is configured correctly.\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"FileVault encryption\"}],\" — Built-in Kandji library item. Enable it, set the recovery key escrow to Kandji (not Jamf or a local escrow), and you're done.\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Screen lock policy\"}],\" — Built-in: 5-minute timeout, require password after sleep or screen saver.\"]}],\"\\n\"]}]\n"])</script><script>self.__next_f.push([1,"39:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h3\",\"id\":\"custom-compliance-item-falcon-cid-validation\",\"children\":\"Custom Compliance Item: Falcon CID Validation\"}]\n3a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The Kandji custom compliance item is a shell script. Here's the pattern:\"}]\n3b:[\"$\",\"$L65\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"#!/bin/bash\\n\\n# Check if Falcon sensor is running — use pgrep, more reliable than launchctl parsing\\nif pgrep -x \\\"Falcon\\\" \u003e /dev/null 2\u003e\u00261; then\\n    FALCON_RUNNING=1\\nelse\\n    FALCON_RUNNING=0\\nfi\\n\\nif [[ \\\"$FALCON_RUNNING\\\" -eq 0 ]]; then\\n    echo \\\"FalconNotInstalled\\\"\\n    exit 1\\nfi\\n\\n# Get Falcon CID — parse falconctl output with awk, avoiding GNU-specific grep flags\\nFALCON_CID=$(/Applications/Falcon.app/Contents/Mac/Falcon.app/Contents/Resources/falconctl stats 2\u003e/dev/null | awk '/Customer ID:/ {print $NF}')\\nEXPECTED_CID=\\\"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"\\n\\nif [[ \\\"$FALCON_CID\\\" == \\\"$EXPECTED_CID\\\" ]]; then\\n    echo \\\"Compliant\\\"\\n    exit 0\\nelse\\n    echo \\\"WrongCID: $FALCON_CID\\\"\\n    exit 1\\nfi\\n\",\"language\":\"bash\",\"label\":\"Bash\"}],\"copyButton\":true}]\n3c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"Kandji evaluates this script via exit code — \",[\"$\",\"$L67\",null,{\"children\":\"exit 0\"}],\" means compliant, \",[\"$\",\"$L67\",null,{\"children\":\"exit 1\"}],\" means non-compliant. The output string surfaces in Kandji's device inventory under the compliance item result, so IT can see exactly which Macs are misconfigured and why.\"]}]\n3d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h3\",\"id\":\"the-kandji-intune-integration\",\"children\":\"The Kandji-Intune Integration\"}]\n3e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"This is where the architecture comes together. Kandji has a native integration with Microsoft Intune that pushes compliance state directly — no middleware, no manual export. When a Mac evaluates its blueprint in Kandji, the result (compliant or non-compliant) flows automatically into Intune as a device compliance state.\"}]\n3f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Concretely: Kandji is the MDM and compliance authority for all Macs. Intune owns the Conditional Access policy that enforces access. The integration bridge connects them. A non-compliant Mac in Kandji becomes a non-compliant device in Intune, which triggers the same Conditional Access block policy that applies to Windows and Linux.\"}]\n40:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"The configuration lives in the Kandji admin portal under \",[\"$\",\"strong\",null,{\"children\":\"Integrations → Microsoft Device Compliance\"}],\". Kandji authenticates via an OAuth flow to the Microsoft Device Compliance partner app — not a manually created app registration. Once connected, Kandji pushes compliance state to Intune automatically.\"]}]\n41:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h3\",\"id\":\"apple-silicon-system-extensions-not-kernel-extensions\",\"children\":\"Apple Silicon: System Extensions, Not Kernel Extensions\"}]\n42:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"One structural difference between Intel and Apple Silicon Macs that drove real engineering work: CrowdSt"])</script><script>self.__next_f.push([1,"rike on Intel Macs uses a Kernel Extension (KExt) for certain legacy capabilities. On Apple Silicon, Apple deprecated KExts — CrowdStrike uses \",[\"$\",\"strong\",null,{\"children\":\"System Extensions\"}],\" instead, which require a different approval profile. Whether Intel deployments also need System Extension approval depends on the sensor version and OS — the CrowdStrike deployment guides for your specific versions clarify which profile type applies.\"]}]\n43:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"In practice, this meant we needed two separate Kandji blueprints — one for Intel Macs, one for Apple Silicon — or conditional logic within a single blueprint that detects the chip architecture and applies the right profile. We went with separate blueprints to keep the logic clean:\"}]\n44:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Intel blueprint\"}],\": KExt approval profile pointing to CrowdStrike's kernel extension bundle ID\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Apple Silicon blueprint\"}],\": System Extension approval profile pointing to CrowdStrike's system extension bundle IDs\"]}],\"\\n\"]}]\n45:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Both blueprints include the same compliance items (Falcon CID, Netskope, FileVault, screen lock). The only difference is the extension approval profile. Assign devices to the right blueprint based on hardware model — Kandji's smart groups handle this automatically based on hardware type.\"}]\n46:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"If you skip the Apple Silicon profile, Falcon installs but the sensor won't load — the Mac will show as non-compliant because the service never starts. You'll see it in the Kandji device inventory as \\\"Falcon installed but not running\\\" with no obvious explanation. The System Extension approval is the missing piece.\"}]\n47:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"linux-bash-compliance-checks\",\"children\":\"Linux: Bash Compliance Checks\"}]\n48:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"Linux is the outlier in most Microsoft-first compliance designs. There's no native MDM comparable to Kandji for macOS, and the Intune compliance story for Linux is narrower than for Windows. Intune does support Linux device compliance via the Microsoft Intune app on \",[\"$\",\"a\",null,{\"href\":\"https://learn.microsoft.com/en-us/mem/intune/enrollment/linux-support\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer\",\"children\":\"a limited set of distros\"}],\" — confirm your distro is in scope before designing around it.\"]}]\n49:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We used a POSIX-compliant shell script deployed as a custom compliance discovery script in Intune, paired with the same JSON schema that Windows uses. On supported distros, the Microsoft Intune app handles compliance check-in and runs the discovery script.\"}]\n4a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The script pattern:\"}]\n4b:[\"$\",\"$L65\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":"])</script><script>self.__next_f.push([1,"[{\"code\":\"#!/bin/bash\\n\\n# Check CrowdStrike Falcon sensor — try both known service names\\nFALCON_RUNNING=0\\nif systemctl is-active --quiet falcon-sensor 2\u003e/dev/null; then\\n    FALCON_RUNNING=1\\nelif systemctl is-active --quiet csFalconService 2\u003e/dev/null; then\\n    FALCON_RUNNING=1\\nfi\\n\\n# Get Falcon CID — parse falconctl.toml with awk to avoid GNU-specific grep\\nFALCON_CID=$(awk -F'=' '/^customer_id/ {gsub(/[[:space:]]/,\\\"\\\",$2); print $2}' /etc/crowdstrike/falconctl.toml 2\u003e/dev/null || echo \\\"none\\\")\\nEXPECTED_CID=\\\"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"\\n\\n# Check Netskope\\nNETSKOPE_RUNNING=0\\nif systemctl is-active --quiet netskope 2\u003e/dev/null; then\\n    NETSKOPE_RUNNING=1\\nfi\\n\\n# Compliance result — emit booleans to match Intune JSON datatype\\nif [[ \\\"$FALCON_RUNNING\\\" -eq 1 ]] \u0026\u0026 [[ \\\"$FALCON_CID\\\" == \\\"$EXPECTED_CID\\\" ]] \u0026\u0026 [[ \\\"$NETSKOPE_RUNNING\\\" -eq 1 ]]; then\\n    COMPLIANT=true\\nelse\\n    COMPLIANT=false\\nfi\\n\\necho \\\"{\\\\\\\"FalconRunning\\\\\\\":$FALCON_RUNNING,\\\\\\\"FalconCID\\\\\\\":\\\\\\\"$FALCON_CID\\\\\\\",\\\\\\\"NetskopeRunning\\\\\\\":$NETSKOPE_RUNNING,\\\\\\\"Compliant\\\\\\\":$COMPLIANT}\\\"\\n\",\"language\":\"bash\",\"label\":\"Bash\"}],\"copyButton\":true}]\n4c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Intune runs this on an 8-hour cycle by default. Devices that have been offline check in when they reconnect to the network, so OT devices that aren't always on will trigger a compliance re-evaluation on startup.\"}]\n4d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-tiered-enforcement-model\",\"children\":\"The Tiered Enforcement Model\"}]\n4e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Having compliance data flow into Intune is only half the battle. You need an enforcement response that matches the risk.\"}]\n4f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We designed a two-tier model:\"}]\n50:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"$\",\"strong\",null,{\"children\":\"Tier 1 — Nudge (Grace Period)\"}]}]\n51:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"When a device first goes non-compliant, the user gets a notification and a grace period. On Windows, this flows through the Company Portal app. On macOS, Kandji's built-in notification system. On Linux, we used a custom script that posts to a webhook (which routes to a Teams channel).\"}]\n52:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Grace period: 24 hours for most issues, 4 hours for critical items like a missing endpoint protection agent.\"}]\n53:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"$\",\"strong\",null,{\"children\":\"Tier 2 — Kill Switch\"}]}]\n54:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"If the device is still non-compliant after the grace period, Conditional Access blocks access to all corporate resources. The device can no longer authenticate to Entra ID-protected apps. SharePoint, Teams, engineering tooling — all blocked.\"}]\n55:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-"])</script><script>self.__next_f.push([1,"background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"One important boundary: \",[\"$\",\"strong\",null,{\"children\":\"Conditional Access only enforces the identity plane.\"}],\" It blocks access to apps and resources that authenticate through Entra ID — including SAML SSO applications that use Entra as their IdP. What it doesn't cover: OT network segments, internal tools with their own auth (local credentials, LDAP binds, etc.), and SaaS apps with no Entra integration. Those still need enforcement at the network layer — Netskope ZTNA policies, VPN posture checks, or NAC. The kill switch handles the Entra side. Don't assume it covers your entire attack surface.\"]}]\n56:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The kill switch is implemented as a separate Conditional Access policy with a device compliance requirement. Non-compliant devices match the block condition.\"}]\n57:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The graceful part: the kill switch targets the device, not the user. If someone has two devices and one goes non-compliant, the other is unaffected. This matters in OT environments where a single user might have multiple devices for different roles.\"}]\n58:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-4-phase-rollout\",\"children\":\"The 4-Phase Rollout\"}]\n59:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Rolling this out across an organization with mixed OS types, multiple site locations, and OT operator stations that can't be disrupted arbitrarily required a phased approach.\"}]\n5a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Phase 1 — Discovery (Weeks 1-2)\"}],\"\\nDeploy all compliance policies in report-only mode. No enforcement, just visibility. Use this to establish the baseline: how many devices are already compliant, which compliance items are most frequently failing, which sites have the worst posture.\"]}]\n5b:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Phase 2 — Nudge Only (Weeks 3-4)\"}],\"\\nEnable grace period notifications. No blocks yet. Let the help desk and device owners get ahead of the compliance issues before anything blocks access. This is also when you tune the grace period durations — some sites may need longer windows based on shift schedules.\"]}]\n5c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Phase 3 — Kill Switch with Exemptions (Weeks 5-8)\"}],\"\\nEnable Conditional Access enforcement but maintain an exemption list for OT stations that can't tolerate unexpected access loss. These stations get a separate policy with extended grace periods and a manual review cycle. Goal is to have everything under enforcement within 8 weeks.\"]}]\n5d:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Phase 4 — Full Enforcement (Week 9+)\"}],\"\\nRemove the exemption list. All devices subject to the same enforcement model. OT stations that were on the exemption list get additional mo"])</script><script>self.__next_f.push([1,"nitoring to ensure they stay compliant, since they no longer have a safety net.\"]}]\n5e:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-we-d-do-differently\",\"children\":\"What We'd Do Differently\"}]\n5f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Start with a pilot cohort, then build exemptions reactively.\"}],\" The instinct to pre-list every device that might break is tempting in OT environments. It results in a long exemption list built on speculation. A better approach: enable the kill switch for a narrow pilot group first (say, IT-managed engineering workstations), let real failures surface, and create exemptions for those specific devices. You'll end up with fewer exemptions and a more defensible rationale for each one.\"]}]\n60:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Test the Linux script on every distribution you'll encounter.\"}],\" The script above works on systemd-based distros. If you have devices running older init systems or non-systemd distros (some embedded Linux variants), you'll need alternate service detection logic. We found three distinct Linux environments that needed custom script variants.\"]}]\n61:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Automate the exemption renewal process.\"}],\" Exemptions that require manual renewal tend to expire silently and then cause confusion when devices suddenly block. We ended up building a small automation that tracks exemption expiration dates and sends warnings before they lapse. Don't skip this.\"]}]\n62:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-takeaway\",\"children\":\"The Takeaway\"}]\n63:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Cross-platform compliance enforcement is less about the individual platform tooling and more about the unified policy model that sits above it. The OS-specific details (PowerShell scripts, Kandji blueprints, bash checks) are implementation details. The enforcement logic — what happens when a device goes non-compliant, how quickly, and with what escalation path — that's the architecture that matters.\"}]\n64:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Build that model first. Then wire each platform into it.\"}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"68:I[27201,[\"/_next/static/chunks/d96012bcfc98706a.js\",\"/_next/static/chunks/73e3194f06db260e.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"title\",\"0\",{\"children\":\"Cross-Platform Compliance Architecture: Building a Kill-Switch Enforcement System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Most compliance frameworks treat enforcement as a checkbox. Here's how to build an actual cross-platform enforcement system that can kill access the moment a device goes non-compliant — Windows, macOS, and Linux.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Cross-Platform Compliance Architecture: Building a Kill-Switch Enforcement System\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Most compliance frameworks treat enforcement as a checkbox. Here's how to build an actual cross-platform enforcement system that can kill access the moment a device goes non-compliant — Windows, macOS, and Linux.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/blog/cross-platform-compliance-architecture\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:image\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/images/blog/cross-platform-compliance-architecture.png\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:image:alt\",\"content\":\"Cross-Platform Compliance Architecture: Building a Kill-Switch Enforcement System\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"Cross-Platform Compliance Architecture: Building a Kill-Switch Enforcement System\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"Most compliance frameworks treat enforcement as a checkbox. Here's how to build an actual cross-platform enforcement system that can kill access the moment a device goes non-compliant — Windows, macOS, and Linux.\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:image\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/images/blog/cross-platform-compliance-architecture.png\"}],[\"$\",\"link\",\"12\",{\"rel\":\"icon\",\"href\":\"/icon.png?icon.9a99efef.png\",\"sizes\":\"1024x1024\",\"type\":\"image/png\"}],[\"$\",\"$L68\",\"13\",{}]]\n"])</script></body></html>
