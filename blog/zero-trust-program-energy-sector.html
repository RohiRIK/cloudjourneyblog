:T1808,"])</script><script>self.__next_f.push([1,"\nIntune Autopatch automates Windows, Microsoft 365 Apps, Edge, and Teams updates to improve security and productivity. To ensure patches are correctly applied and systems remain compliant, organizations can use Intune Proactive Remediations to detect missing patches and remediate them automatically. This guide provides a verifiable, end-to-end flow for engineers to implement and validate automated patching.\n\n## Introduction\n\nAutomated patching reduces administrative overhead and improves security posture by ensuring timely updates. Windows Autopatch manages update rings and cadence as a service, while Intune Proactive Remediations allow custom detection and remediation scripts to verify patch state and fix issues automatically.\n\n## Prerequisites\n\n- Licensing: Microsoft 365 Business Premium, Windows 10/11 Education A3/A5, Windows 10/11 Enterprise E3/E5 (including F3), or VDA equivalents.\n- Device platform: Windows 10/11 Enterprise/Education, Windows IoT Enterprise (certain LTSC limitations apply).\n- Network: Internet access to Intune, Windows Update, and Autopatch endpoints.\n\n## Step 1: Verify Prerequisites\n\nConfirm licenses are assigned to users or devices. Ensure devices run supported Windows editions. Validate network connectivity to required endpoints (*.manage.microsoft.com, *.update.microsoft.com, etc.).\n\n## Step 2: Enroll Devices in Windows Autopatch\n\nIn the Microsoft Endpoint Manager admin center:\n1. Navigate to Devices \u003e Windows \u003e Windows Autopatch \u003e Enroll.\n2. Select device groups (Entra groups) to enroll.\n3. Confirm enrollment status in the Autopatch enrollment blade.\n\n## Step 3: Configure Update Rings (if needed)\n\nAutopatch creates default Test and Last rings. Review them via Intune \u003e Devices \u003e Update rings.\n- Avoid assigning custom rings to Autopatch-managed devices; rely on service-managed policies.\n- Adjust ring settings (deferral, grace periods) only for opt-out groups.\n\n## Step 4: Deploy Proactive Remediation Script for Patch Verification\n\nCreate a detection script that checks for the latest quality update KB (returns exit code 0 if compliant, non-zero if action needed). Create a remediation script that triggers Windows Update or resets Windows Update components.\n\nExample detection script (PowerShell):\n```powershell\n# Check for KB500xxxx (example)\n$hotfix = Get-HotFix -ID KB500xxxx -ErrorAction SilentlyContinue\nif ($hotfix) { exit 0 } else { exit 1 }\n```\n\nExample remediation script (PowerShell):\n```powershell\n# Trigger Windows Update scan and install\nusoclient StartScan\nusoclient StartInstall\n# Alternatively, reset Windows Update components\nnet stop wuauserv\nnet stop cryptSvc\nnet stop bits\nnet stop msiserver\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nren C:\\Windows\\System32\\catroot2 catroot2.old\nnet start wuauserv\nnet start cryptSvc\nnet start bits\nnet start msiserver\n```\n\nDeployment steps in Intune:\n1. Upload detection and remediation scripts as a script package (Intune \u003e Devices \u003e Scripts).\n2. Assign to targeting groups (can be the same Autopatch group or Entra group).\n3. Set schedule (e.g., every 8 hours) and user context (System).\n4. Enable notifications for failed detections.\n\n## Step 5: Monitor Compliance and Alerts\n\nMonitor sources:\n- Intune device compliance and update compliance reports.\n- Windows Autopatch Management Status Report (tenant-wide view of eligible devices).\n- Windows Autopatch Alert Report (active alerts, severity, impacted update types).\n\nValidation checks:\n- Detection scripts run on schedule to verify patch state.\n- Manual verification via Get-HotFix, Get-ItemProperty for registry keys, or WSUS/ConfigMgr queries.\n- Handling failed patches:\n  - Detection failure triggers remediation script (e.g., retry Windows Update, reset Windows Update components).\n  - If remediation fails, device marked non-compliant; admin can investigate logs (WindowsUpdate.log, SetupAPI.log).\n  - Rollback options: Use Windows Update for Business uninstall policies, or deploy a script to uninstall the problematic update via wusa.exe /uninstall.\n- Reporting and alerting:\n  - Configure alert rules in Intune for compliance drift.\n  - Use Autopatch alert email notifications or webhook integrations.\n  - Export reports to Power BI or Log Analytics for trend analysis.\n\n## Step 6: Remediate Failures and Verify Fixes\n\n- When detection fails, remediation script runs automatically.\n- Verify success by checking subsequent detection returns exit code 0.\n- If persistent failure, open ticket, collect logs, consider pausing the update ring for that device group.\n\n## Step 7: Review Reports and Adjust Policies\n\n- Weekly: Examine Intune update compliance trends.\n- Monthly: Review Autopatch reports for rollback/pause events.\n- Adjust ring deferrals or exclusion groups based on observed issues.\n- Update detection/remediation scripts as new KBs are released.\n\n## Sources\n\n- Windows Autopatch overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/overview/windows-autopatch-overview\n- Windows Autopatch prerequisites: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/prepare/windows-autopatch-prerequisites\n- Manage Windows Update ring policies (Intune): https://learn.microsoft.com/en-us/intune/device-updates/windows/manage-update-rings\n- Update ring settings reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/ref-update-ring-settings\n- Use Remediations to Detect and Fix Support Issues (Intune): https://learn.microsoft.com/en-us/intune/device-management/tools/deploy-remediations\n- PowerShell Scripts for Remediations reference: https://learn.microsoft.com/en-us/intune/device-management/tools/ref-remediation-scripts\n- Windows Autopatch alerts and remediations: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/alerts-remediations\n- Windows Autopatch management status report: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/windows-autopatch-management-status-report\n- Windows Autopatch groups overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/deploy/windows-autopatch-groups-overview"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"children\":[[\"$\",\"$L18\",null,{\"maxWidth\":12,\"m\":{\"hide\":true}}],[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"paddingTop\":\"24\",\"children\":[[\"$\",\"$L1a\",null,{\"id\":\"schema-blogPosting-/blog/zero-trust-program-energy-sector\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/blog/zero-trust-program-energy-sector\\\",\\\"sameAs\\\":[],\\\"headline\\\":\\\"Building a Zero Trust Program: Lessons from a Large Energy Sector Deployment\\\",\\\"description\\\":\\\"What we actually did — and what broke — rolling out a full Zero Trust program across a large energy sector organization with 57 tasks across the full stack.\\\",\\\"image\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/blog/zero-trust-program-energy-sector.png\\\",\\\"datePublished\\\":\\\"2026-04-26\\\",\\\"dateModified\\\":\\\"2026-04-26\\\",\\\"author\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Rohi Rikman\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/about\\\",\\\"image\\\":{\\\"@type\\\":\\\"ImageObject\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/avatar.png\\\"}}}\"}}],[\"$\",\"$L10\",null,{\"maxWidth\":\"s\",\"gap\":\"16\",\"horizontal\":\"center\",\"align\":\"center\",\"children\":[[\"$\",\"$L1b\",null,{\"href\":\"/blog\",\"ch uthentication experience that never requires users to enter credentials on the device itself.\n\n## What is MediaFusion?\n\nMediaFusion is an open-source streaming platform that aggregates content from configured sources-including torrent indexers, debrid services like RealDebrid and Premiumize, metadata providers, and enhancement services-into a unified interface accessible through Stremio, Kodi, or directly in a browser. Acting as an aggregation layer, it connects to over 40 external services across six major categories, eliminating the need to juggle multiple apps or websites.\n\nThe platform's strength lies in its ability to present a unified streaming experience while handling the complexity of authentication with various backend services behind the scenes.\n\n## The OAuth 2.0 Device Authorization Grant Explained\n\nThe OAuth 2.0 Device Authorization Grant (also known as \"device flow\") is specifically designed for input-constrained or browserless devices. Unlike traditional OAuth flows that require redirects or embedded browsers, device flow enables authorization through a secondary device like a smartphone or laptop.\n\nHere's how MediaFusion implements this flow:\n\n1. **Device Authorization Request**: When configuring a debrid service (like RealDebrid), MediaFusion's configuration UI makes a GET request to the provider's `/provider/device_code` endpoint to obtain a device code and user code.\n\n2. **User Code Display**: The configuration interface displays the user code and instructs the user to visit a verification URL on a separate device (typically a smartphone or computer) with full input capabilities.\n\n3. **User Authorization**: The user visits the verification URL on their secondary device, enters the user code, and grants authorization to MediaFusion.\n\n4. **Polling for Token**: While the user authorizes, MediaFusion polls the token endpoint (`/provider/authorize`) with the device code at intervals specified by the provider (typically every 5 seconds) until authorization completes or the code expires.\n\n5. **Token Reception**: Upon successful authorization, the token endpoint returns an access token, which MediaFusion encrypts and embeds in the manifest URL via the `secret_str` parameter for seamless addon configuration.\n\n![OAuth Device Flow Diagram](data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjMwMCIgeT0iMjAwIiBmb250LXNpemU9IjE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwIjpEZXZpY2UgRmxvdzwvdGV4dD48L3N2Zz4=)\n\n## Why Device Flow Provides Excellent UX for MediaFusion Users\n\nThe device flow solves the authentication dilemma for streaming addons in several key ways:\n\n- **No Browser Required on Device**: MediaFusion runs on devices that may lack browsers or have limited input (like TV boxes or Raspberry Pi setups). The device flow eliminates the need for browser-based authentication flows on these constrained devices.\n\n- **Secondary Device Authentication**: Users complete authorization on familiar devices with full keyboards and browsers-typically smartphones or laptops-making the process intuitive and error-free.\n\n- **Simple Code Entry**: Instead of entering complex credentials, users only need to input a short, alphanumeric user code (typically 6-8 characters), reducing friction and errors.\n\n- **Automatic Polling**: After displaying the user code, MediaFusion automatically handles the polling process in the background, requiring no further user interaction until authorization completes or times out.\n\n- **URL-Based Configuration**: Encrypted credentials are embedded directly in the manifest URL, eliminating separate login steps when installing the Stremio or Kodi addon. Users simply install the addon with the pre-configured manifest URL, and it just works.\n\n## Security Analysis: What Device Flow Protects Against\n\nThe device flow provides inherent security benefits by design:\n\n### What It Protects Against\n- **Credential Exposure**: User credentials (username/password) never enter the MediaFusion device interface, eliminating credential theft from compromised devices.\n- **Limited Attack Surface**: Only the device code and user code are exposed on the limited-interface device, minimizing the attack surface.\n\n### Security Considerations \u0026 Mitigations\nWhile inherently more secure than alternatives like Resource Owner Password Credentials (ROPC), device flow requires attention to several considerations:\n\n1. **User Code Brute Forcing**: RFC 8628 section 5.1 specifies that user codes must be sufficiently long and random to prevent brute-force attacks. MediaFusion relies on provider-standard implementations that typically use 8-character alphanumeric codes (62^8 ~ 218 trillion possibilities).\n\n2. **Device Code Brute Forcing**: Similarly, device codes must be sufficiently entropic (RFC 8628 section 5.2). Providers implement these with sufficient entropy to make brute-forcing impractical.\n\n3. **Phishing Risks**: Users must verify they're entering codes on legitimate provider verification pages. MediaFusion mitigates this by displaying the exact verification URL to visit.\n\n4. **Polling Abuse**: Providers must implement rate limiting on token endpoints to prevent abuse from frequent polling-a standard requirement RFC 8628 section 5.4 places on authorization servers.\n\n5. **Token Lifetime Management**: Access tokens should have appropriate expiration times, with refresh token support where applicable, limiting the window of compromise if tokens are intercepted.\n\n6. **PKCE Considerations**: While RFC 8628 doesn't mandate PKCE for device flow, some providers implement it additionally. MediaFusion works with provider implementations as-is.\n\n## Device Flow vs. Alternative OAuth Flows\n\nUnderstanding when device flow is the right choice requires comparing it to other OAuth flows:\n\n### Device Flow vs. Authorization Code + PKCE\n- **Device Flow**: Designed for input-constrained/browserless devices; uses user code + verification URL; client polls for token\n- **Auth Code + PKCE**: Requires browser/user-agent on device; uses redirect_uri; authorization server redirects back to client\n\n### Device Flow vs. ROPC (Resource Owner Password Credentials)\n- **Device Flow**: Never handles user credentials; more secure against credential theft and phishing\n- **ROPC**: Requires username/password handled by client; vulnerable to phishing, keylogging, and credential theft\n\n### When Device Flow is Appropriate\nDevice flow is ideal when:\n- Devices lack browsers or have limited input capabilities (smart TVs, streaming sticks, gaming consoles)\n- You want to avoid handling user credentials on the device\n- Users have access to a secondary device for authorization\n- Deploying streaming/media addons (Stremio/Kodi) where seamless configuration is paramount\n\n## How MediaFusion Implements Device Flow Technically\n\nBased on source code analysis, MediaFusion's implementation follows these patterns:\n\n### Device Code Request\nThe configuration UI initiates the flow by calling `GET /{provider}/device_code` (found in `resources/js/config_script.js` lines 33-60), which returns:\n- `device_code`: Used for polling the token endpoint\n- `user_code`: The code users enter on the verification page\n- `verification_uri`: The URL users should visit\n- `expires_in`: Validity period (typically 5-15 minutes)\n- `interval`: Polling interval in seconds (usually 5)\n\n### Token Polling\nWhile the user authorizes, MediaFusion POSTs to `/{provider}/authorize` with the `device_code` (lines 63-96 in config_script.js), respecting the provider-specified interval to avoid abuse.\n\n### User Code Display\nThe configuration interface (`resources/html/configure.html` lines 235-242) presents the user code and instructions clearly, often with copy-to-clipboard functionality for ease of use.\n\n### Token Storage\nUpon receiving the access token, MediaFusion:\n1. Encrypts it using AES via `utils/crypto.py` with a site-specific `settings.secret_key`\n2. Embeds the encrypted token in the manifest URL as the `secret_str` parameter\n3. This allows Stremio/Kodi addons to load configured services without additional login steps\n\nThe encryption implementation spans `utils/crypto.py` and `db/schemas.py` (lines 235-348), ensuring credentials never remain in plaintext in configurations or URLs.\n\n## Best Practices for Users When Authorizing Devices\n\nTo maximize security when using MediaFusion's device flow:\n\n1. **Verify the Verification URL**: Always ensure you're on the legitimate provider's website when entering user codes.\n2. **Use Temporary Codes**: Treat user codes as temporary passwords-don't share them or enter them on suspicious sites.\n3. **Monitor Authorized Devices**: Regularly review and revoke access for devices you no longer use via the provider's account dashboard.\n4. **Understand Token Scope**: Be aware of what permissions you're granting (typically limited to accessing your debrid/storage account).\n5. **Keep Recovery Options Updated**: Ensure account recovery methods are current in case you need to regain access.\n\n## Why This Approach Represents the Future of Device Authentication\n\nMediaFusion's implementation of OAuth 2.0 Device Flow exemplifies a broader shift in how we handle authentication for the growing ecosystem of smart devices, IoT gadgets, and media-centric hardware:\n\n- **User-Centric Security**: By separating authentication from the device interface, we achieve both security and usability without compromise.\n- **Standardized Approach**: Leveraging RFC 8628 ensures compatibility with major identity providers while benefiting from community-vetted security practices.\n- **Seamless Integration**: The URL-based credential embedding creates a truly \"set it and forget it\" experience for addon installation and configuration.\n- **Extensible Framework**: As more services adopt device flow (from Google to Azure AD), MediaFusion's modular implementation can easily integrate new providers.\n\nFor streaming enthusiasts who value both convenience and security, MediaFusion's device flow implementation demonstrates how thoughtful authentication design can make complex backend integrations disappear behind a simple, \"just works\" user experience-exactly what the modern streaming ecosystem needs.\n\n---\n\n## Related Documents\n\n## Related Documents\n\n### See Also\n- [OAuth 2.0 for Native Apps (RFC 8252)](https://www.rfc-editor.org/info/rfc8252) - Comparison with traditional OAuth flows\n- [OAuth 2.0 Threat Model and Security Considerations (RFC 6819)](https://www.rfc-editor.org/info/rfc6819) - Broader OAuth security context\n- [OAuth 2.0 Token Exchange (RFC 8693)](https://www.rfc-editor.org/info/rfc8693) - Related token exchange mechanisms"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"mediafusion-device-auth\",{\"post\":{\"metadata\":{\"title\":\"How MediaFusion's OAuth Device Flow Enables Secure Streaming on Any Device\",\"subtitle\":\"\",\"publishedAt\":\"2026-08-03\",\"summary\":\"Explore how MediaFusion implements OAuth 2.0 Device Authorization Grant to solve authentication challenges on input-limited streaming devices, balancing user convenience with security considerations.\",\"image\":\"/images/blog/mediafusion-device-auth.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"mediafusion-device-auth\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\"children\":[\"$\",\"$L2a\",null,{\"fitHeight\":true}]}]\n"])</script><script>self.__next_f.push([1,"2b:I[811052,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/sta re a phishing campaign that got as far as a finance workstation, a VPN breach via a contractor whose credentials had been reused on an breached external service, and a regulatory audit that flagged the lack of endpoint visibility as a finding.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The board approved a Zero Trust program. 18 months. 57 tasks. Full scope.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-we-built\",\"children\":\"What We Built\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The program broke down into six workstreams:\"}],\"\\n\",[\"$\",\"table\",null,{\"marginTop\":\"12\",\"marginBottom\":\"12\",\"style\":{\"width\":\"100%\",\"borderCollapse\":\"collapse\",\"fontSize\":\"0.875rem\",\"lineHeight\":\"1.75\"},\"children\":[[\"$\",\"thead\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-medium)\",\"backgroundColor\":\"var(--neutral-alpha-soft)\"},\"children\":[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Workstream\"}],[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Scope\"}],[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Duration\"}]]}]}],[\"$\",\"tbody\",null,{\"children\":[[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"st 41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"List\"]\n5c:I[626935,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ListItem\"]\n5d:I[597784,[\"/_next/static/chunks/fe02e46b350c4d44.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/1179586da96b41b9.js\",\"/_next/static/chunks/a78e7f0399bed372.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"CodeBlock\"]\n2c:[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 4-12\"}]\n2d:[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Device Intelligence\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"MDI deployment, device compliance policies\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 6-12\"}]]}]\n2e:[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Cloud Security\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Defender for Cloud Apps, CASB, workload identities\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 8-15\"}]]}]\n2f:[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Monitoring \u0026 Response\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Sentinel, SOC integration, alert triage playbooks\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 10-18\"}]]}]\n30:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The workstreams ran in parallel where dependencies allowed and sequentially where they didn't. Identity was always first — you can't do Zero Trust without identity as the control plane.\"}]\n31:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"identity-the-foundation\",\"children\":\"Identity: The Foundation\"}]\n32:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We started with Entra ID and Conditional Access. The goal was simple: every access request — regardless of where it originates — gets evaluated against identity, device compliance, and risk signals.\"}]\n33:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The first six months were brutal. The Conditional Access policy surface grew from nothing to 40+ policies covering:\"}]\n34:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"All cloud apps require compliant device\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Legacy authentication blocked (Basic auth, SOAP, ADAL)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"High-privilege role holders require phishing-resistant MFA\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Guest access limited to specific apps with data loss prevention applied\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Sign-in risk-based policies that step up auth on anomalo"])</script><script>self.__next_f.push([1,"us behavior\"}],\"\\n\"]}]\n35:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The hardest part wasn't technical — it was organizational. Convincing business unit leads to accept that their device needed to be compliant before accessing SharePoint took longer than writing the policies.\"}]\n36:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"What broke:\"}],\" We wrote a policy that blocked legacy authentication globally, which took down a SCADA reporting tool that only supported Basic auth over HTTPS. We had to carve out an exception, add the application to a roadmap for upgrade, and monitor that carveout until it was retired. Exception management became a full-time task.\"]}]\n37:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"endpoint-mde-intune\",\"children\":\"Endpoint: MDE + Intune\"}]\n38:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Months 3-9 covered endpoint deployment. We enrolled all endpoints into Intune, deployed MDE for endpoint detection and response, and applied security baselines.\"}]\n39:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The deployment order was deliberate:\"}]\n3a:[\"$\",\"$L5b\",null,{\"as\":\"ol\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Pilot group\"}],\" — IT and security team first (50 machines)\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"VIP group\"}],\" — executives and finance (100 machines)\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Engineering\"}],\" — software teams with developer workstations (300 machines)\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"General workforce\"}],\" — the remaining 2,000 machines\"]}],\"\\n\"]}]\n3b:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Each ring had a two-week observation window before unlocking the next. This let us catch policy conflicts (we had three application compatibility issues that required baseline adjustments) before they hit the whole organization.\"}]\n3c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"What broke:\"}],\" The Intune security baseline for Windows blocked a legacy ERP client that used an unsigned DLL loader. We had to relax the block, document the exception, and escalate to the application owner for a remediation timeline. Three other exceptions followed a similar pattern.\"]}]\n3d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"network-802.1x-and-microsegmentation\",\"children\":\"Network: 802.1X and Microsegmentation\"}]\n3e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"This was the most disruptive workstream. 802.1X for wired and wireless access requires every device — including IoT and OT systems — to authenticate before getting network access.\"}]\n3f:[\"$\",\"span\",null,{\""])</script><script>self.__next_f.push([1,"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The challenge: the organization had 15 years of flat network architecture. Printers, badge readers, SCADA interfaces, and HVAC systems all sat on the same VLANs as user workstations.\"}]\n40:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We couldn't onboard everything to 802.1X immediately. So we used a phased approach:\"}]\n41:[\"$\",\"$L5d\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"# Phase 1: Supplicant deployment (months 4-6)\\n# Push 802.1X supplicant config to all domain-joined devices via Intune\\n# Devices get provisioning packages, IT validates in pilot\\n\\n# Phase 2: Switch configuration (months 6-9)\\n# Reconfigure access switches for 802.1X with fallback to MAB\\n# MAC Authentication Bypass for devices that can't do 802.1X\\n\\n# Phase 3: VLAN isolation (months 9-12)\\n# Move non-compliant devices to quarantine VLAN\\n# Isolate OT/IoT on dedicated segments with gateway controls\\n\",\"language\":\"bash\",\"label\":\"Bash\"}],\"copyButton\":true}]\n42:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"What broke:\"}],\" A building management system that couldn't authenticate to 802.1X and had no fallback configured went dark during a switch firmware upgrade. The BMS vendor took two weeks to provide updated firmware. The building had no HVAC control for that period. It was not a quiet two weeks.\"]}]\n43:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"device-intelligence-mdi\",\"children\":\"Device Intelligence: MDI\"}]\n44:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"MDI (Microsoft Defender for Identity) came in at month 6, after enough Entra ID and endpoint coverage was in place to give it meaningful data. The integration with Sentinel gave the SOC a unified view of identity-based attacks.\"}]\n45:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The MDI deployment surface included:\"}]\n46:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Domain controllers (all 12)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"AD FS servers (4)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"ADFS proxy servers (2)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Entra ID Connect servers (2)\"}],\"\\n\"]}]\n47:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Within 48 hours of activation, MDI flagged a password spray attack that had been running against the ADFS proxy for three days — below the threshold to trigger alerts but visible in the timeline view. We'd have missed it without MDI.\"}]\n48:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"cloud-security-defender-for-cloud-apps\",\"children\":\"Cloud Security: Defender for Cloud Apps\"}]\n49:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Months 8-15 covered the cloud security workstream. The organization had moved significant workloads to Azure and Microsoft"])</script><script>self.__next_f.push([1," 365, but had no CASB visibility or data loss prevention.\"}]\n4a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We deployed Defender for Cloud Apps with:\"}]\n4b:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"App discovery for Shadow IT (found 47 unauthorized SaaS apps in use)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"OAuth app consent policies\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"DLP policies for sensitive data classification\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Session policies for high-risk OAuth apps\"}],\"\\n\"]}]\n4c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The app discovery finding was the surprise of the program. 47 unauthorized apps included three cloud storage services, two project management tools, and one social media management platform — all in use by various teams without IT approval. The legal risk of that exposure would have been significant without MDI alerting us.\"}]\n4d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"monitoring-sentinel-integration\",\"children\":\"Monitoring: Sentinel Integration\"}]\n4e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The final workstream was SOC integration — getting all the signals into Sentinel and writing playbooks that actually reduced alert fatigue.\"}]\n4f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We had 340 alerts at program start. After tuning, we got to 45 actionable alerts with defined playbooks. The key was ruthless prioritization: anything that couldn't result in a decision within 5 minutes went to the \\\"monitor and review\\\" bucket, not the \\\"SOC immediate\\\" bucket.\"}]\n50:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Playbook highlights:\"}]\n51:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Lateral movement detection\"}],\": MDI + Sentinel correlation for NTLM relay patterns\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Ransomware precursor detection\"}],\": flagged mass file deletion + anomalous process launch\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Insider risk indicators\"}],\": unusual SharePoint download patterns triggering DLP escalation\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Entra sign-in anomaly response\"}],\": automated block for high-risk sign-ins with SOC notification\"]}],\"\\n\"]}]\n52:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-i-d-do-differently\",\"children\":\"What I'd Do Differently\"}]\n53:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Start with identity regardless.\"}],\" If I could redo the program, I'd have pushed Entra ID govern"])</script><script>self.__next_f.push([1,"ance and CA policies even earlier. The identity signal is the most reliable indicator across all the other workstreams — you can do microsegmentation, device compliance, and cloud access all faster if you have strong identity controls as the foundation.\"]}]\n54:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Build the exception management process before writing policies.\"}],\" We invented the process as we went, which meant inconsistent handling of exceptions early on. A formal exception register with SLAs for remediation would have been cleaner.\"]}]\n55:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Get OT/IoT onboarded to network monitoring earlier.\"}],\" We waited until months 9-12 for OT segmentation because we thought we needed all the identity and endpoint work done first. We were wrong. We had blind spots in OT that we didn't know about until a passive OT monitoring tool showed up in month 8.\"]}]\n56:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Include a tabletop exercise for the SOC before deploying MDE.\"}],\" We tuned the alerts in isolation but didn't test the response playbooks until after deployment. Some of the playbook logic had gaps that would have caused delays in a real incid
