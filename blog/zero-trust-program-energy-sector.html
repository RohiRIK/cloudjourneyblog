_DkSkqG__mobile\",\"maxWidth\":\"m\",\"paddingY\":\"8\",\"paddingX\":\"16\",\"gap\":\"16\",\"horizontal\":\"between\",\"vertical\":\"center\",\"s\":{\"direction\":\"column\",\"horizontal\":\"center\",\"align\":\"center\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-s neutral-on-background-strong\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[\"© \",2026,\" /\"]}],[\"$\",\"span\",null,{\"className\":\"px-4\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"Rohi Rikman\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"/ Powered by caffeine and questionable life choices\"}]]}],[\"$\",\"$L18\",null,{\"gap\":\"16\",\"children\":[[\"$\",\"$L19\",\"GitHub\",{\"href\":\"https://github.com/RohiRIK\",\"icon\":\"github\",\"tooltip\":\"GitHub\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"LinkedIn\",{\"href\":\"https://www.linkedin.com/in/rohi-rikman-48831b239/\",\"icon\":\"linkedin\",\"tooltip\":\"LinkedIn\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"Email\",{\"href\":\"mailto:rohi@rohirikman.dev\",\"icon\":\"email\",\"tooltip\":\"Email\",\"size\":\"s\",\"variant\":\"ghost\"}]]}]]}],[\"$\",\"$L18\",null,{\"height\":\"80\",\"hide\":true,\"s\":{\"hide\":false}}]]}]\n"])</script><script>self.__next_f.push([1,"24:T19dc,"])</script><script>self.__next_f.push([1,"\nDocker's AuthZ middleware is supposed to be the last line of defense - the plugin that decides whether a container operation is allowed. CVE-2026-34040, disclosed by Cyera Research in April 2026, showed that a single padded HTTP request could make every AuthZ plugin in the ecosystem invisible.\n\nThe vulnerability class had existed since Docker Engine 1.10 - February 2016. Ten years.\n\n## How the bypass worked\n\nThe attack is disarmingly simple. Docker Engine's AuthZ middleware inspects request bodies before allowing container operations. But request bodies larger than 1 megabyte are silently dropped before they reach the AuthZ plugins. The Docker daemon still processes the request normally.\n\nThat's the entire bug. A 1MB+ padded HTTP request bypasses authorization. The AuthZ plugin never sees it. The daemon executes the operation anyway.\n\nThe practical exploit: send a single padded HTTP request that creates a privileged container with host root access. No authentication bypass. No credential theft. Just a request that's too big for the security control to see.\n\n## Who was affected\n\nEvery environment using AuthZ plugins - which, in a properly configured production Docker deployment, is most of them. The affected plugins include:\n\n- **Open Policy Agent (OPA)** - the most common policy engine for container authorization\n- **Prisma Cloud** - enterprise container security\n- **Casbin** - open-source authorization\n- **Custom AuthZ plugins** - any organization that built their own authorization middleware\n\nThis is the standard recommendation for production Docker: deploy an AuthZ plugin to restrict what container operations are permitted. CVE-2026-34040 means that recommendation was providing a false sense of security for a decade.\n\n## The inheritance problem\n\nThis vulnerability is related to - but distinct from - CVE-2024-41110 (CVSS 10.0, disclosed 2024), which used a zero-length body to achieve the same bypass. Docker patched CVE-2024-41110, but the fix was incomplete. CVE-2026-34040 uses a different mechanism (oversized body vs. empty body) to achieve the same outcome.\n\nThe pattern matters: the authz bypass isn't a single bug - it's a vulnerability class in how Docker handles request body routing to plugins. Patching one specific bypass doesn't close the class. Docker Engine 29.3.1 addresses this properly.\n\n## The real-world impact\n\nThe vulnerability is particularly dangerous in three scenarios:\n\n**CI/CD pipelines.** Build systems that submit Docker API requests via the daemon socket. If an attacker can influence the request body size - through a compromised build step, a malicious Dockerfile, or a supply chain attack - they can bypass AuthZ controls to create privileged containers. In a pipeline that's supposed to run untrusted code, this is the difference between \"contained breach\" and \"full host compromise.\"\n\n**Multi-tenant container platforms.** Environments where multiple teams or customers share a Docker daemon, with AuthZ plugins enforcing isolation between tenants. The bypass means any tenant can escape their authorization boundary. Shared Docker infrastructure without user namespaces is especially exposed.\n\n**Environments using AuthZ as the primary control.** Organizations that deployed an AuthZ plugin and considered authorization handled. The plugin was the control - and it was invisible to oversized requests.\n\n## What to do\n\n### Patch immediately\n\nDocker Engine 29.3.1 addresses CVE-2026-34040. This is not a \"patch when convenient\" vulnerability - it's a complete bypass of a primary security control.\n\n```bash\n# Check your version\ndocker version\n\n# Update (Debian/Ubuntu)\nsudo apt update \u0026\u0026 sudo apt install docker-ce docker-ce-cli containerd.io\n\n# Update (RHEL/CentOS)\nsudo yum update docker-ce docker-ce-cli containerd.io\n```\n\n### Don't rely on AuthZ alone\n\nThis is the structural lesson. AuthZ plugins are a valuable layer, but they're a single point of failure in the authorization chain. The container security stack needs defense in depth:\n\n**User Namespaces.** Kubernetes 1.36 (released April 2026) graduated User Namespaces to GA. Rootless containers - pods that run without real root on the host - are now a stable, supported configuration. Even if an AuthZ bypass creates a privileged container, user namespaces limit what that privilege means on the host. The container's \"root\" is a mapped UID with no real host privileges.\n\n**Seccomp profiles.** Default seccomp profiles restrict the system calls a container can make. Even a root-privileged container can't mount the host filesystem or load kernel modules if the seccomp profile blocks those syscalls.\n\n**AppArmor/SELinux.** Mandatory access controls add another layer. A container running as root with a restrictive AppArmor profile can't escape the profile's constraints regardless of its nominal privilege level.\n\n**Read-only root filesystems.** Containers that can't write to their own filesystem can't persist payloads or modify binaries. This is a simple control that dramatically reduces post-exploitation options.\n\n### Audit your AuthZ plugins\n\nCheck whether your AuthZ plugins are updated. Some plugins may have their own mitigations or configuration changes that reduce exposure. OPA's Docker authorization policy, for example, can be updated to reject oversized request bodies at the policy level - though this is a workaround, not a fix.\n\n### Monitor for exploitation\n\nThe exploit leaves traces. Docker daemon logs record container creation events. Look for:\n\n- Privileged containers created by unexpected callers\n- Container creation requests with unusually large request bodies\n- API calls that bypass the expected authorization plugin audit trail\n\n## The container security stack is shifting\n\nCVE-2026-34040 isn't just a Docker bug - it's evidence that the container security model needs more layers. AuthZ plugins were designed as the authorization gate, but they're only as reliable as the request routing that feeds them.\n\nThe combination of K8s 1.36 User Namespaces (GA), Docker CVE-2026-34040 (AuthZ bypass), and the broader shift toward rootless containers points in one direction: the era of \"deploy a plugin and consider authorization handled\" is over. Container security needs the same defense-in-depth approach that network security learned years ago. No single control is sufficient. Every layer assumes the others might fail.\n\nPatch Docker. Enable user namespaces. Layer your controls. The vulnerability existed for a decade because the assumption was that AuthZ plugins were the boundary. They're not. They're one layer - and that layer just had a hole in it.\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"children\":[[\"$\",\"$L18\",null,{\"maxWidth\":12,\"m\":{\"hide\":true}}],[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"paddingTop\":\"24\",\"children\":[[\"$\",\"$L1a\",null,{\"id\":\"schema-blogPosting-/blog/zero-trust-program-energy-sector\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/blog/zero-trust-program-energy-sector\\\",\\\"sameAs\\\":[],\\\"headline\\\":\\\"Building a Zero Trust Program: Lessons from a Large Energy Sector Deployment\\\",\\\"description\\\":\\\"What we actually did — and what broke — rolling out a full Zero Trust program across a large energy sector organization with 57 tasks across the full stack.\\\",\\\"image\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/blog/zero-trust-program-energy-sector.png\\\",\\\"datePublished\\\":\\\"2026-04-26\\\",\\\"dateModified\\\":\\\"2026-04-26\\\",\\\"author\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Rohi Rikman\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/about\\\",\\\"image\\\":{\\\"@type\\\":\\\"ImageObject\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/avatar.png\\\"}}}\"}}],[\"$\",\"$L10\",null,{\"maxWidth\":\"s\",\"gap\":\"16\",\"horizontal\":\"center\",\"align\":\"center\",\"children\":[[\"$\",\" clock is already ticking. This isn't a recommendation - it's a deprecation with a hard date.\n\n## What changed and why it matters\n\nOn July 13, 2026, Microsoft published the announcement: passkeys (FIDO2/phishing-resistant) will be the default authentication method in Entra ID. The rollout begins September 1, 2026. Users currently enabled for SMS/voice will be auto-enabled for passkeys.\n\nThen on February 1, 2027, native SMS and voice delivery is retired. Organizations that still need SMS will have to contract third-party telecom partners through the Microsoft Security Store (partners announced September 18, 2026).\n\nThe driver isn't convenience - it's threat reality. AI-powered phishing campaigns now achieve click-through rates up to 54%, compared to roughly 12% for traditional phishing. Adversary-in-the-middle proxy attacks make SMS and push-based MFA fundamentally vulnerable. Passkeys bind the authentication ceremony to the legitimate origin cryptographically. There's nothing to intercept.\n\nMicrosoft's own Secure Future Initiative progress report (July 10, 2026) puts this in context: 99.97% of user/device pairs at Microsoft are now protected by phishing-resistant MFA. They're not just recommending it - they've deployed it at scale internally and are pushing the rest of the ecosystem to follow.\n\n## The timeline\n\n| Date | What happens |\n|------|-------------|\n| July 13, 2026 | Announcement published |\n| September 1, 2026 | Rollout begins - SMS/voice users auto-enabled for passkeys |\n| September 18, 2026 | Supported third-party telecom providers announced |\n| February 1, 2027 | Native SMS/voice retired |\n| September 7, 2026 | SSPR accepts only registered authentication methods (no more contact details as MFA) |\n\nThe September SSPR change is easy to miss. Self-service password reset will stop accepting unregistered email/phone as authentication methods. If your users registered a personal Gmail or a phone number they no longer have access to, they'll be locked out of SSPR. Verify registration state before September 7.\n\n## What you need to do now\n\n### Phase 1 - Audit your current state (July-August 2026)\n\nBefore you migrate anything, know what you have:\n\n1. **Inventory authentication methods per user.** In the Entra admin center, go to Users \u003e Authentication methods. Export the report. Identify every user with SMS or voice as their only registered method.\n\n2. **Check SSPR registration.** Under Password reset \u003e Authentication methods, verify what users have registered. Flag anyone with only a phone number or email as their registered method - they'll need to add a passkey before September 7.\n\n3. **Review Conditional Access policies.** Identify any policies that rely on \"Require MFA\" without specifying authentication strength. These will continue to work after February 2027 but won't enforce phishing-resistant methods. Start upgrading them to reference Authentication Strengths.\n\n4. **Audit service accounts.** Service accounts with interactive sign-ins using SMS or phone-based MFA are a blocking issue. These need certificate-based authentication or managed identity - they can't use passkeys.\n\n### Phase 2 - Deploy passkey infrastructure (August-September 2026)\n\n1. **Enable the passkey authentication method.** In Entra \u003e Protection \u003e Authentication methods, ensure FIDO2 (Security Keys) and Microsoft Authenticator (for passkey support) are enabled.\n\n2. **Create registration campaigns.** Use Entra's built-in registration campaign feature (now GA for passkeys) to prompt users during sign-in. The campaign shows a banner directing users to register a passkey. Target users who don't yet have a phishing-resistant method.\n\n3. **Deploy Windows Hello for Business.** For managed Windows devices, WHfB is the lowest-friction path. Users authenticate with biometric or PIN - it's already the login experience, just backed by a FIDO2 credential bound to the device. Verify Intune compliance policies and Hello provisioning policies are deployed.\n\n4. **Deploy Platform SSO for macOS.** For Mac users, Platform SSO uses the Secure Enclave to generate a hardware-bound key that qualifies as phishing-resistant under Authentication Strengths. Requires Intune MDM enrollment and macOS 13+.\n\n5. **Issue FIDO2 hardware keys for edge cases.** Shared workstations, kiosk scenarios, privileged users on multiple devices, and Linux workstations all need hardware keys. YubiKey 5 series or equivalent.\n\n### Phase 3 - Migrate and enforce (September 2026-January 2027)\n\n1. **Enroll in batches.** Don't enforce for everyone simultaneously. Create a security group (`sg-passkey-enrolled`), deploy a phishing-resistant Authentication Strength policy scoped to that group, and add users as they register.\n\n2. **Upgrade Conditional Access policies.** Replace \"Require MFA\" with explicit Authentication Strength references. Phishing-Resistant MFA for privileged roles and sensitive apps. Passwordless MFA as a broader baseline. Keep existing MFA policies as a safety net.\n\n3. **Monitor sign-in logs.** Filter for \"Report-only: Would have failed\" before enforcing. Identify users who would be blocked and help them register before the policy applies.\n\n4. **Cut SMS/voice before February 2027.** Don't wait for Microsoft to retire it. If you've completed passkey enrollment for your user population, disable SMS/voice in your authentication methods policy. The fewer users on a deprecated method, the cleaner the transition.\n\n## Linux support\n\nA detail that matters for heterogeneous environments: phishing-resistant MFA for Linux desktops is now available via the Microsoft identity broker. Supported on Ubuntu 24.04, 26.04, RHEL 8, 9, and 10. This means your Linux workstations can participate in the same Conditional Access policies as Windows and macOS - no exceptions needed for platform coverage.\n\n## What about third-party telecom?\n\nIf you absolutely cannot migrate away from SMS before February 2027 - legacy systems, regulatory requirements, or environments where passkey enrollment isn't feasible for a subset of users - Microsoft will support third-party telecom partners for SMS/voice delivery. The partner list goes live September 18, 2026 via the Microsoft Security Store.\n\nThis is a stopgap, not a strategy. Third-party SMS delivery adds cost, complexity, and the same phishing vulnerabilities that drove the deprecation. Use it only for the tail cases you genuinely can't reach with passkeys.\n\n## The bigger picture\n\nThis isn't just an MFA method swap. It's Microsoft aligning the entire Entra ID ecosystem around phishing-resistant authentication as the baseline. The Conditional Access policy changes in July 2026 (CA policies now apply during Windows Hello and Platform SSO registration), the September 7 SSPR tightening, and the February 2027 SMS retirement are all parts of the same trajectory.\n\nEnvironments that delay will face a forced migration with a compressed timeline. Environments that start now have six months to enroll users, test policies, and enforce gradually - which is the only way to do this without locking people out.\n\nThe passkey default isn't coming. It's already here. The question is whether you'll migrate on your terms or on Microsoft's timeline.\n"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"passkey-deadline\",{\"post\":{\"metadata\":{\"title\":\"The Passkey Deadline\",\"subtitle\":\"\",\"publishedAt\":\"2026-07-17\",\"summary\":\"Microsoft just made passkeys the default in Entra ID and set a February 2027 deadline for SMS. Here's what every organization needs to do now - and the migration roadmap that gets you there without disruption.\",\"image\":\"/images/blog/passkey-deadline.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"passkey-deadline\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\"children\":[\"$\",\"$L2a\",null,{\"fitHeight\":true}]}]\n"])</script><script>self.__next_f.push([1,"2b:I[811052,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"HeadingLink\"]\n"])</script><script>self.__next_f.push([1,"1e:[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Zero Trust is one of those frameworks that everyone talks about and few people have actually implemented end-to-end. It's easy to describe the principle — never trust, always verify — and hard to execute it across an estate that spans legacy OT systems, hybrid Active Directory, cloud workloads, and thousands of endpoints.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"This is a retrospective on a 57-task Zero Trust program I ran for an energy sector client over 18 months. I'll cover what we did, what we got wrong, and what I'd do differently next time.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-starting-point\",\"children\":\"The Starting Point\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The organization had a traditional perimeter security model: a corporate firewall, AD-joined workstations, and a VPN for remote access. It worked — until it didn't.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The triggering events were a phishing campaign that got as far as a finance workstation, a VPN breach via a contractor whose credentials had been reused on an breached external service, and a regulatory audit that flagged the lack of endpoint visibility as a finding.\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The board approved a Zero Trust program. 18 months. 57 tasks. Full scope.\"}],\"\\n\",[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-we-built\",\"children\":\"What We Built\"}],\"\\n\",[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The program broke down into six workstreams:\"}],\"\\n\",[\"$\",\"table\",null,{\"marginTop\":\"12\",\"marginBottom\":\"12\",\"style\":{\"width\":\"100%\",\"borderCollapse\":\"collapse\",\"fontSize\":\"0.875rem\",\"lineHeight\":\"1.75\"},\"children\":[[\"$\",\"thead\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-medium)\",\"backgroundColor\":\"var(--neutral-alpha-soft)\"},\"children\":[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Workstream\"}],[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Scope\"}],[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Duration\"}]]}]}],[\"$\",\"tbody\",null,{\"children\":[[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Identity \u0026 Access\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Entra ID, Conditional Access, phishing-resistant MFA\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 1-6\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Endpoint Management\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"MDE deployment, Intune, security baselines\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 3-9\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Network Segmentation\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Microsegmentation, 802.1X wired/wireless, VLAN restructuring\"}],\"$L2c\"]}],\"$L2d\",\"$L2e\",\"$L2f\"]}]]}],\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\",\"\\n\",\"$L3d\",\"\\n\",\"$L3e\",\"\\n\",\"$L3f\",\"\\n\",\"$L40\",\"\\n\",\"$L41\",\"\\n\",\"$L42\",\"\\n\",\"$L43\",\"\\n\",\"$L44\",\"\\n\",\"$L45\",\"\\n\",\"$L46\",\"\\n\",\"$L47\",\"\\n\",\"$L48\",\"\\n\",\"$L49\",\"\\n\",\"$L4a\",\"\\n\",\"$L4b\",\"\\n\",\"$L4c\",\"\\n\",\"$L4d\",\"\\n\",\"$L4e\",\"\\n\",\"$L4f\",\"\\n\",\"$L50\",\"\\n\",\"$L51\",\"\\n\",\"$L52\",\"\\n\",\"$L53\",\"\\n\",\"$L54\",\"\\n\",\"$L55\",\"\\n\",\"$L56\",\"\\n\",\"$L57\",\"\\n\",\"$L58\",\"\\n\",\"$L59\",\"\\n\",\"$L5a\"]\n"])</script><script>self.__next_f.push([1,"5b:I[436122,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"List\"]\n5c:I[626935,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"ListItem\"]\n5d:I[597784,[\"/_next/static/chunks/3355f25cb11074b7.js\",\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"/_next/static/chunks/21f080b07a2c63d8.js\",\"/_next/static/chunks/0e235429b8fbdec6.js\",\"/_next/static/chunks/2079049d5abbbd3d.js\",\"/_next/static/chunks/909e86f090b49392.js\"],\"CodeBlock\"]\n2c:[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 4-12\"}]\n2d:[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Device Intelligence\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"MDI deployment, device compliance policies\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 6-12\"}]]}]\n2e:[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Cloud Security\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Defender for Cloud Apps, CASB, workload identities\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 8-15\"}]]}]\n2f:[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Monitoring \u0026 Response\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Sentinel, SOC integration, alert triage playbooks\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Months 10-18\"}]]}]\n30:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The workstreams ran in parallel where dependencies allowed and sequentially where they didn't. Identity was always first — you can't do Zero Trust without identity as the control plane.\"}]\n31:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"identity-the-foundation\",\"children\":\"Identity: The Foundation\"}]\n32:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We started with Entra ID and Conditional Access. The goal was simple: every access request — regardless of where it originates — gets evaluated against identity, device compliance, and risk signals.\"}]\n33:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The first six months were brutal. The Conditional Access policy surface grew from nothing to 40+ policies covering:\"}]\n34:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"All cloud apps require compliant device\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Legacy authentication blocked (Basic auth, SOAP, ADAL)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"High-privilege role holders require phishing-resistant MFA\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Guest access limited to specific apps with data loss prevention applied\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Sign-in risk-based policies that step up auth on anomalo"])</script><script>self.__next_f.push([1,"us behavior\"}],\"\\n\"]}]\n35:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The hardest part wasn't technical — it was organizational. Convincing business unit leads to accept that their device needed to be compliant before accessing SharePoint took longer than writing the policies.\"}]\n36:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"What broke:\"}],\" We wrote a policy that blocked legacy authentication globally, which took down a SCADA reporting tool that only supported Basic auth over HTTPS. We had to carve out an exception, add the application to a roadmap for upgrade, and monitor that carveout until it was retired. Exception management became a full-time task.\"]}]\n37:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"endpoint-mde-intune\",\"children\":\"Endpoint: MDE + Intune\"}]\n38:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Months 3-9 covered endpoint deployment. We enrolled all endpoints into Intune, deployed MDE for endpoint detection and response, and applied security baselines.\"}]\n39:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The deployment order was deliberate:\"}]\n3a:[\"$\",\"$L5b\",null,{\"as\":\"ol\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Pilot group\"}],\" — IT and security team first (50 machines)\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"VIP group\"}],\" — executives and finance (100 machines)\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Engineering\"}],\" — software teams with developer workstations (300 machines)\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"General workforce\"}],\" — the remaining 2,000 machines\"]}],\"\\n\"]}]\n3b:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Each ring had a two-week observation window before unlocking the next. This let us catch policy conflicts (we had three application compatibility issues that required baseline adjustments) before they hit the whole organization.\"}]\n3c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"What broke:\"}],\" The Intune security baseline for Windows blocked a legacy ERP client that used an unsigned DLL loader. We had to relax the block, document the exception, and escalate to the application owner for a remediation timeline. Three other exceptions followed a similar pattern.\"]}]\n3d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"network-802.1x-and-microsegmentation\",\"children\":\"Network: 802.1X and Microsegmentation\"}]\n3e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"This was the most disruptive workstream. 802.1X for wired and wireless access requires every device — including IoT and OT systems — to authenticate before getting network access.\"}]\n3f:[\"$\",\"span\",null,{\""])</script><script>self.__next_f.push([1,"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The challenge: the organization had 15 years of flat network architecture. Printers, badge readers, SCADA interfaces, and HVAC systems all sat on the same VLANs as user workstations.\"}]\n40:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We couldn't onboard everything to 802.1X immediately. So we used a phased approach:\"}]\n41:[\"$\",\"$L5d\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"# Phase 1: Supplicant deployment (months 4-6)\\n# Push 802.1X supplicant config to all domain-joined devices via Intune\\n# Devices get provisioning packages, IT validates in pilot\\n\\n# Phase 2: Switch configuration (months 6-9)\\n# Reconfigure access switches for 802.1X with fallback to MAB\\n# MAC Authentication Bypass for devices that can't do 802.1X\\n\\n# Phase 3: VLAN isolation (months 9-12)\\n# Move non-compliant devices to quarantine VLAN\\n# Isolate OT/IoT on dedicated segments with gateway controls\\n\",\"language\":\"bash\",\"label\":\"Bash\"}],\"copyButton\":true}]\n42:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"What broke:\"}],\" A building management system that couldn't authenticate to 802.1X and had no fallback configured went dark during a switch firmware upgrade. The BMS vendor took two weeks to provide updated firmware. The building had no HVAC control for that period. It was not a quiet two weeks.\"]}]\n43:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"device-intelligence-mdi\",\"children\":\"Device Intelligence: MDI\"}]\n44:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"MDI (Microsoft Defender for Identity) came in at month 6, after enough Entra ID and endpoint coverage was in place to give it meaningful data. The integration with Sentinel gave the SOC a unified view of identity-based attacks.\"}]\n45:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The MDI deployment surface included:\"}]\n46:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Domain controllers (all 12)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"AD FS servers (4)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"ADFS proxy servers (2)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Entra ID Connect servers (2)\"}],\"\\n\"]}]\n47:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Within 48 hours of activation, MDI flagged a password spray attack that had been running against the ADFS proxy for three days — below the threshold to trigger alerts but visible in the timeline view. We'd have missed it without MDI.\"}]\n48:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"cloud-security-defender-for-cloud-apps\",\"children\":\"Cloud Security: Defender for Cloud Apps\"}]\n49:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Months 8-15 covered the cloud security workstream. The organization had moved significant workloads to Azure and Microsoft"])</script><script>self.__next_f.push([1," 365, but had no CASB visibility or data loss prevention.\"}]\n4a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We deployed Defender for Cloud Apps with:\"}]\n4b:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"App discovery for Shadow IT (found 47 unauthorized SaaS apps in use)\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"OAuth app consent policies\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"DLP policies for sensitive data classification\"}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Session policies for high-risk OAuth apps\"}],\"\\n\"]}]\n4c:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The app discovery finding was the surprise of the program. 47 unauthorized apps included three cloud storage services, two project management tools, and one social media management platform — all in use by various teams without IT approval. The legal risk of that exposure would have been significant without MDI alerting us.\"}]\n4d:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"monitoring-sentinel-integration\",\"children\":\"Monitoring: Sentinel Integration\"}]\n4e:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The final workstream was SOC integration — getting all the signals into Sentinel and writing playbooks that actually reduced alert fatigue.\"}]\n4f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"We had 340 alerts at program start. After tuning, we got to 45 actionable alerts with defined playbooks. The key was ruthless prioritization: anything that couldn't result in a decision within 5 minutes went to the \\\"monitor and review\\\" bucket, not the \\\"SOC immediate\\\" bucket.\"}]\n50:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Playbook highlights:\"}]\n51:[\"$\",\"$L5b\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Lateral movement detection\"}],\": MDI + Sentinel correlation for NTLM relay patterns\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Ransomware precursor detection\"}],\": flagged mass file deletion + anomalous process launch\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Insider risk indicators\"}],\": unusual SharePoint download patterns triggering DLP escalation\"]}],\"\\n\",[\"$\",\"$L5c\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Entra sign-in anomaly response\"}],\": automated block for high-risk sign-ins with SOC notification\"]}],\"\\n\"]}]\n52:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-i-d-do-differently\",\"children\":\"What I'd Do Differently\"}]\n53:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Start with identity regardless.\"}],\" If I could redo the program, I'd have pushed Entra ID govern"])</script><script>self.__next_f.push([1,"ance and CA policies even earlier. The identity signal is the most reliable indicator across all the other workstreams — you can do microsegmentation, device compliance, and cloud access all faster if you have strong identity controls as the foundation.\"]}]\n54:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Build the exception management process before writing policies.\"}],\" We invented the process as we went, which meant inconsistent handling of exceptions early on. A formal exception register with SLAs for remediation would have been cleaner.\"]}]\n55:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Get OT/IoT onboarded to network monitoring earlier.\"}],\" We waited until months 9-12 for OT segmentation because we thought we needed all the identity and endpoint work done first. We were wrong. We had blind spots in OT that we didn't know about until a passive OT monitoring tool showed up in month 8.\"]}]\n56:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Include a tabletop exercise for the SOC before deploying MDE.\"}],\" We tuned the alerts in isolation but didn't test the response playbooks until after deployment. Some of the playbook logic had gaps that would have caused delays in a real incident.\"]}]\n57:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"the-numbers\",\"children\":\"The Numbers\"}]\n"])</script><script>self.__next_f.push([1,"58:[\"$\",\"table\",null,{\"marginTop\":\"12\",\"marginBottom\":\"12\",\"style\":{\"width\":\"100%\",\"borderCollapse\":\"collapse\",\"fontSize\":\"0.875rem\",\"lineHeight\":\"1.75\"},\"children\":[[\"$\",\"thead\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-medium)\",\"backgroundColor\":\"var(--neutral-alpha-soft)\"},\"children\":[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Metric\"}],[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"Start\"}],[\"$\",\"th\",null,{\"style\":{\"padding\":\"8px 12px\",\"textAlign\":\"left\",\"fontWeight\":\"600\"},\"children\":\"End\"}]]}]}],[\"$\",\"tbody\",null,{\"children\":[[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Endpoints with MDE\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"0%\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"96%\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Devices Intune-compliant\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"12%\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"89%\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Conditional Access policies\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"0\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"47\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Legacy auth attempts blocked\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"—\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"14,000/month\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Unauthorized SaaS apps discovered\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"47\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"0 (quarantined)\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"MDI alerts in SOC queue\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"340\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"45\"}]]}],[\"$\",\"tr\",null,{\"style\":{\"borderBottom\":\"1px solid var(--neutral-alpha-small)\"},\"children\":[[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Time to detect lateral movement\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"Unknown\"}],[\"$\",\"td\",null,{\"style\":{\"padding\":\"8px 12px\"},\"children\":\"\u003c 4 hours\"}]]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"59:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Eighteen months. 57 tasks. A meaningful reduction in attack surface.\"}]\n5a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Zero Trust isn't a product you buy. It's a program you build, incrementally, one control at a time.\"}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"5e:I[27201,[\"/_next/static/chunks/d96012bcfc98706a.js\",\"/_next/static/chunks/73e3194f06db260e.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"title\",\"0\",{\"children\":\"Building a Zero Trust Program: Lessons from a Large Energy Sector Deployment\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"What we actually did — and what broke — rolling out a full Zero Trust program across a large energy sector organization with 57 tasks across the full stack.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Building a Zero Trust Program: Lessons from a Large Energy Sector Deployment\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"What we actually did — and what broke — rolling out a full Zero Trust program across a large energy sector organization with 57 tasks across the full stack.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://cloudjourneyblog.rohi-lab.org/blog/zero-trust-program-energy-sector\"}],[\"$\",\"meta\"
