xWidth\":\"m\",\"paddingY\":\"8\",\"paddingX\":\"16\",\"gap\":\"16\",\"horizontal\":\"between\",\"vertical\":\"center\",\"s\":{\"direction\":\"column\",\"horizontal\":\"center\",\"align\":\"center\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"font-body font-default font-s neutral-on-background-strong\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":[\"© \",2026,\" /\"]}],[\"$\",\"span\",null,{\"className\":\"px-4\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"Rohi Rikman\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"/ Powered by caffeine and questionable life choices\"}]]}],[\"$\",\"$L18\",null,{\"gap\":\"16\",\"children\":[[\"$\",\"$L19\",\"GitHub\",{\"href\":\"https://github.com/RohiRIK\",\"icon\":\"github\",\"tooltip\":\"GitHub\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"LinkedIn\",{\"href\":\"https://www.linkedin.com/in/rohi-rikman-48831b239/\",\"icon\":\"linkedin\",\"tooltip\":\"LinkedIn\",\"size\":\"s\",\"variant\":\"ghost\"}],[\"$\",\"$L19\",\"Email\",{\"href\":\"mailto:rohi@rohirikman.dev\",\"icon\":\"email\",\"tooltip\":\"Email\",\"size\":\"s\",\"variant\":\"ghost\"}]]}]]}],[\"$\",\"$L18\",null,{\"height\":\"80\",\"hide\":true,\"s\":{\"hide\":false}}]]}]\n"])</script><script>self.__next_f.push([1,"24:T19dc,"])</script><script>self.__next_f.push([1,"\nDocker's AuthZ middleware is supposed to be the last line of defense - the plugin that decides whether a container operation is allowed. CVE-2026-34040, disclosed by Cyera Research in April 2026, showed that a single padded HTTP request could make every AuthZ plugin in the ecosystem invisible.\n\nThe vulnerability class had existed since Docker Engine 1.10 - February 2016. Ten years.\n\n## How the bypass worked\n\nThe attack is disarmingly simple. Docker Engine's AuthZ middleware inspects request bodies before allowing container operations. But request bodies larger than 1 megabyte are silently dropped before they reach the AuthZ plugins. The Docker daemon still processes the request normally.\n\nThat's the entire bug. A 1MB+ padded HTTP request bypasses authorization. The AuthZ plugin never sees it. The daemon executes the operation anyway.\n\nThe practical exploit: send a single padded HTTP request that creates a privileged container with host root access. No authentication bypass. No credential theft. Just a request that's too big for the security control to see.\n\n## Who was affected\n\nEvery environment using AuthZ plugins - which, in a properly configured production Docker deployment, is most of them. The affected plugins include:\n\n- **Open Policy Agent (OPA)** - the most common policy engine for container authorization\n- **Prisma Cloud** - enterprise container security\n- **Casbin** - open-source authorization\n- **Custom AuthZ plugins** - any organization that built their own authorization middleware\n\nThis is the standard recommendation for production Docker: deploy an AuthZ plugin to restrict what container operations are permitted. CVE-2026-34040 means that recommendation was providing a false sense of security for a decade.\n\n## The inheritance problem\n\nThis vulnerability is related to - but distinct from - CVE-2024-41110 (CVSS 10.0, disclosed 2024), which used a zero-length body to achieve the same bypass. Docker patched CVE-2024-41110, but the fix was incomplete. CVE-2026-34040 uses a different mechanism (oversized body vs. empty body) to achieve the same outcome.\n\nThe pattern matters: the authz bypass isn't a single bug - it's a vulnerability class in how Docker handles request body routing to plugins. Patching one specific bypass doesn't close the class. Docker Engine 29.3.1 addresses this properly.\n\n## The real-world impact\n\nThe vulnerability is particularly dangerous in three scenarios:\n\n**CI/CD pipelines.** Build systems that submit Docker API requests via the daemon socket. If an attacker can influence the request body size - through a compromised build step, a malicious Dockerfile, or a supply chain attack - they can bypass AuthZ controls to create privileged containers. In a pipeline that's supposed to run untrusted code, this is the difference between \"contained breach\" and \"full host compromise.\"\n\n**Multi-tenant container platforms.** Environments where multiple teams or customers share a Docker daemon, with AuthZ plugins enforcing isolation between tenants. The bypass means any tenant can escape their authorization boundary. Shared Docker infrastructure without user namespaces is especially exposed.\n\n**Environments using AuthZ as the primary control.** Organizations that deployed an AuthZ plugin and considered authorization handled. The plugin was the control - and it was invisible to oversized requests.\n\n## What to do\n\n### Patch immediately\n\nDocker Engine 29.3.1 addresses CVE-2026-34040. This is not a \"patch when convenient\" vulnerability - it's a complete bypass of a primary security control.\n\n```bash\n# Check your version\ndocker version\n\n# Update (Debian/Ubuntu)\nsudo apt update \u0026\u0026 sudo apt install docker-ce docker-ce-cli containerd.io\n\n# Update (RHEL/CentOS)\nsudo yum update docker-ce docker-ce-cli containerd.io\n```\n\n### Don't rely on AuthZ alone\n\nThis is the structural lesson. AuthZ plugins are a valuable layer, but they're a single point of failure in the authorization chain. The container security stack needs defense in depth:\n\n**User Namespaces.** Kubernetes 1.36 (released April 2026) graduated User Namespaces to GA. Rootless containers - pods that run without real root on the host - are now a stable, supported configuration. Even if an AuthZ bypass creates a privileged container, user namespaces limit what that privilege means on the host. The container's \"root\" is a mapped UID with no real host privileges.\n\n**Seccomp profiles.** Default seccomp profiles restrict the system calls a container can make. Even a root-privileged container can't mount the host filesystem or load kernel modules if the seccomp profile blocks those syscalls.\n\n**AppArmor/SELinux.** Mandatory access controls add another layer. A container running as root with a restrictive AppArmor profile can't escape the profile's constraints regardless of its nominal privilege level.\n\n**Read-only root filesystems.** Containers that can't write to their own filesystem can't persist payloads or modify binaries. This is a simple control that dramatically reduces post-exploitation options.\n\n### Audit your AuthZ plugins\n\nCheck whether your AuthZ plugins are updated. Some plugins may have their own mitigations or configuration changes that reduce exposure. OPA's Docker authorization policy, for example, can be updated to reject oversized request bodies at the policy level - though this is a workaround, not a fix.\n\n### Monitor for exploitation\n\nThe exploit leaves traces. Docker daemon logs record container creation events. Look for:\n\n- Privileged containers created by unexpected callers\n- Container creation requests with unusually large request bodies\n- API calls that bypass the expected authorization plugin audit trail\n\n## The container security stack is shifting\n\nCVE-2026-34040 isn't just a Docker bug - it's evidence that the container security model needs more layers. AuthZ plugins were designed as the authorization gate, but they're only as reliable as the request routing that feeds them.\n\nThe combination of K8s 1.36 User Namespaces (GA), Docker CVE-2026-34040 (AuthZ bypass), and the broader shift toward rootless containers points in one direction: the era of \"deploy a plugin and consider authorization handled\" is over. Container security needs the same defense-in-depth approach that network security learned years ago. No single control is sufficient. Every layer assumes the others might fail.\n\nPatch Docker. Enable user namespaces. Layer your controls. The vulnerability existed for a decade because the assumption was that AuthZ plugins were the boundary. They're not. They're one layer - and that layer just had a hole in it.\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"fillWidth\":true,\"children\":[[\"$\",\"$L18\",null,{\"maxWidth\":12,\"m\":{\"hide\":true}}],[\"$\",\"$L18\",null,{\"fillWidth\":true,\"horizontal\":\"center\",\"children\":[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"paddingTop\":\"24\",\"children\":[[\"$\",\"$L1a\",null,{\"id\":\"schema-blogPosting-/blog/new-environment-setup\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/blog/new-environment-setup\\\",\\\"sameAs\\\":[],\\\"headline\\\":\\\"Spinning Up a Client's Production Environment: Azure WAF + VPS\\\",\\\"description\\\":\\\"Setting up a new hosting environment from scratch — the decisions, trade-offs, and lessons from provisioning infrastructure for a client website on Azure.\\\",\\\"image\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/blog/new-environment-setup.png\\\",\\\"datePublished\\\":\\\"2026-04-26\\\",\\\"dateModified\\\":\\\"2026-04-26\\\",\\\"author\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Rohi Rikman\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/about\\\",\\\"image\\\":{\\\"@type\\\":\\\"ImageObject\\\",\\\"url\\\":\\\"https://CloudJourneyBlog.rohi-lab.org/images/avatar.png\\\"}}}\"}}],[\"$\",\"$L10\",null,{\"maxWidth\":\"s\",\"gap\":\"16\",\"horizontal\":\"center\",\"align\":\"center\",\"children\":[[\"$\",\"$L1b\",null,{\"href\":\"/blog\",\"children\":[\"$\",\"span\",null,{\"cl n July 13, 2026, Microsoft published the announcement: passkeys (FIDO2/phishing-resistant) will be the default authentication method in Entra ID. The rollout begins September 1, 2026. Users currently enabled for SMS/voice will be auto-enabled for passkeys.\n\nThen on February 1, 2027, native SMS and voice delivery is retired. Organizations that still need SMS will have to contract third-party telecom partners through the Microsoft Security Store (partners announced September 18, 2026).\n\nThe driver isn't convenience - it's threat reality. AI-powered phishing campaigns now achieve click-through rates up to 54%, compared to roughly 12% for traditional phishing. Adversary-in-the-middle proxy attacks make SMS and push-based MFA fundamentally vulnerable. Passkeys bind the authentication ceremony to the legitimate origin cryptographically. There's nothing to intercept.\n\nMicrosoft's own Secure Future Initiative progress report (July 10, 2026) puts this in context: 99.97% of user/device pairs at Microsoft are now protected by phishing-resistant MFA. They're not just recommending it - they've deployed it at scale internally and are pushing the rest of the ecosystem to follow.\n\n## The timeline\n\n| Date | What happens |\n|------|-------------|\n| July 13, 2026 | Announcement published |\n| September 1, 2026 | Rollout begins - SMS/voice users auto-enabled for passkeys |\n| September 18, 2026 | Supported third-party telecom providers announced |\n| February 1, 2027 | Native SMS/voice retired |\n| September 7, 2026 | SSPR accepts only registered authentication methods (no more contact details as MFA) |\n\nThe September SSPR change is easy to miss. Self-service password reset will stop accepting unregistered email/phone as authentication methods. If your users registered a personal Gmail or a phone number they no longer have access to, they'll be locked out of SSPR. Verify registration state before September 7.\n\n## What you need to do now\n\n### Phase 1 - Audit your current state (July-August 2026)\n\nBefore you migrate anything, know what you have:\n\n1. **Inventory authentication methods per user.** In the Entra admin center, go to Users \u003e Authentication methods. Export the report. Identify every user with SMS or voice as their only registered method.\n\n2. **Check SSPR registration.** Under Password reset \u003e Authentication methods, verify what users have registered. Flag anyone with only a phone number or email as their registered method - they'll need to add a passkey before September 7.\n\n3. **Review Conditional Access policies.** Identify any policies that rely on \"Require MFA\" without specifying authentication strength. These will continue to work after February 2027 but won't enforce phishing-resistant methods. Start upgrading them to reference Authentication Strengths.\n\n4. **Audit service accounts.** Service accounts with interactive sign-ins using SMS or phone-based MFA are a blocking issue. These need certificate-based authentication or managed identity - they can't use passkeys.\n\n### Phase 2 - Deploy passkey infrastructure (August-September 2026)\n\n1. **Enable the passkey authentication method.** In Entra \u003e Protection \u003e Authentication methods, ensure FIDO2 (Security Keys) and Microsoft Authenticator (for passkey support) are enabled.\n\n2. **Create registration campaigns.** Use Entra's built-in registration campaign feature (now GA for passkeys) to prompt users during sign-in. The campaign shows a banner directing users to register a passkey. Target users who don't yet have a phishing-resistant method.\n\n3. **Deploy Windows Hello for Business.** For managed Windows devices, WHfB is the lowest-friction path. Users authenticate with biometric or PIN - it's already the login experience, just backed by a FIDO2 credential bound to the device. Verify Intune compliance policies and Hello provisioning policies are deployed.\n\n4. **Deploy Platform SSO for macOS.** For Mac users, Platform SSO uses the Secure Enclave to generate a hardware-bound key that qualifies as phishing-resistant under Authentication Strengths. Requires Intune MDM enrollment and macOS 13+.\n\n5. **Issue FIDO2 hardware keys for edge cases.** Shared workstations, kiosk scenarios, privileged users on multiple devices, and Linux workstations all need hardware keys. YubiKey 5 series or equivalent.\n\n### Phase 3 - Migrate and enforce (September 2026-January 2027)\n\n1. **Enroll in batches.** Don't enforce for everyone simultaneously. Create a security group (`sg-passkey-enrolled`), deploy a phishing-resistant Authentication Strength policy scoped to that group, and add users as they register.\n\n2. **Upgrade Conditional Access policies.** Replace \"Require MFA\" with explicit Authentication Strength references. Phishing-Resistant MFA for privileged roles and sensitive apps. Passwordless MFA as a broader baseline. Keep existing MFA policies as a safety net.\n\n3. **Monitor sign-in logs.** Filter for \"Report-only: Would have failed\" before enforcing. Identify users who would be blocked and help them register before the policy applies.\n\n4. **Cut SMS/voice before February 2027.** Don't wait for Microsoft to retire it. If you've completed passkey enrollment for your user population, disable SMS/voice in your authentication methods policy. The fewer users on a deprecated method, the cleaner the transition.\n\n## Linux support\n\nA detail that matters for heterogeneous environments: phishing-resistant MFA for Linux desktops is now available via the Microsoft identity broker. Supported on Ubuntu 24.04, 26.04, RHEL 8, 9, and 10. This means your Linux workstations can participate in the same Conditional Access policies as Windows and macOS - no exceptions needed for platform coverage.\n\n## What about third-party telecom?\n\nIf you absolutely cannot migrate away from SMS before February 2027 - legacy systems, regulatory requirements, or environments where passkey enrollment isn't feasible for a subset of users - Microsoft will support third-party telecom partners for SMS/voice delivery. The partner list goes live September 18, 2026 via the Microsoft Security Store.\n\nThis is a stopgap, not a strategy. Third-party SMS delivery adds cost, complexity, and the same phishing vulnerabilities that drove the deprecation. Use it only for the tail cases you genuinely can't reach with passkeys.\n\n## The bigger picture\n\nThis isn't just an MFA method swap. It's Microsoft aligning the entire Entra ID ecosystem around phishing-resistant authentication as the baseline. The Conditional Access policy changes in July 2026 (CA policies now apply during Windows Hello and Platform SSO registration), the September 7 SSPR tightening, and the February 2027 SMS retirement are all parts of the same trajectory.\n\nEnvironments that delay will face a forced migration with a compressed timeline. Environments that start now have six months to enroll users, test policies, and enforce gradually - which is the only way to do this without locking people out.\n\nThe passkey default isn't coming. It's already here. The question is whether you'll migrate on your terms or on Microsoft's timeline.\n"])</script><script>self.__next_f.push([1,"25:[\"$\",\"$L23\",\"passkey-deadline\",{\"post\":{\"metadata\":{\"title\":\"The Passkey Deadline\",\"subtitle\":\"\",\"publishedAt\":\"2026-07-17\",\"summary\":\"Microsoft just made passkeys the default in Entra ID and set a February 2027 deadline for SMS. Here's what every organization needs to do now - and the migration roadmap that gets you there without disruption.\",\"image\":\"/images/blog/passkey-deadline.png\",\"images\":[],\"tag\":\"Security\",\"team\":[],\"link\":\"\"},\"slug\":\"passkey-deadline\",\"content\":\"$28\"},\"thumbnail\":true,\"direction\":\"column\"}]\n26:[\"$\",\"$L29\",null,{}]\n27:[\"$\",\"$L10\",null,{\"maxWidth\":12,\"paddingLeft\":\"40\",\"fitHeight\":true,\"position\":\"sticky\",\"top\":\"80\",\"gap\":\"16\",\"m\":{\"hide\":true},\" I started at the edge. The Application Gateway is the front door — it's what the outside world hits first.\"}]\n32:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"I configured it with:\"}]\n33:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"WAF mode\"}],\": Prevention (not detection — we block, not just alert)\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"OWASP rule set 3.2\"}],\": Covers the standard exploits — SQLi, XSS, Local File Inclusion, remote code execution attempts\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Custom rules\"}],\": Blocked a handful of known-bad ASNs and geographies outside the client's primary markets\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"SSL offloading\"}],\": One wildcard cert via Let's Encrypt, terminated at the gateway\"]}],\"\\n\"]}]\n34:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The WAF gets a bad reputation for being hard to tune. It can be — but for a straightforward website, the default OWASP rule set is a good baseline. I spend about an hour reviewing the logs after go-live to tune out false positives, and it's been quiet ever since.\"}]\n35:[\"$\",\"$L53\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"# Quick check on blocked requests (first week)\\naz network application-gateway waf-log-analytics \\\\\\n  --gateway-name $GW_NAME \\\\\\n  --resource-group $RG \\\\\\n  --query \\\"where Action == 'Block' | summarize count() by RequestUri, UserAgent\\\"\\n\",\"language\":\"bash\",\"label\":\"Bash\"}],\"copyButton\":true}]\n36:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"step-2-the-vps\",\"children\":\"Step 2 — The VPS\"}]\n37:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The web server runs on an Azure B2s VPS — 2 vCPUs, 4 GB RAM, Ubuntu 22.04 LTS. It's not going to win any benchmark contests, but it's plenty for a website that isn't serving video or large file downloads.\"}]\n38:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"I keep the footprint minimal:\"}]\n39:[\"$\",\"$L53\",null,{\"marginTop\":\"8\",\"marginBottom\":\"16\",\"codes\":[{\"code\":\"# Only what's needed\\napt install nginx certbot python3-certbot-nginx ufw\\n\",\"language\":\"bash\",\"label\":\"Bash\"}],\"copyButton\":true}]\n3a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"No cPanel. No Plesk. Just nginx and the ability to read a config file.\"}]\n3b:[\"$\",\"span\",nul"])</script><script>self.__next_f.push([1,"l,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"I automate the provisioning with a small bash script that:\"}]\n3c:[\"$\",\"$L2c\",null,{\"as\":\"ol\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Spins up the VM via Azure CLI\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Opens only the required ports (80, 443, SSH)\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Installs nginx and certbot\"}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Applies a baseline hardening script (SSH key only, fail2ban, unattended-upgrades)\"}],\"\\n\"]}]\n3d:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The script lives in a private repo and gets run once per new environment. It's not infrastructure-as-code in the formal sense, but it's reproducible and documented.\"}]\n3e:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"step-3-dns-and-routing\",\"children\":\"Step 3 — DNS and Routing\"}]\n3f:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[\"The Application Gateway gets a public IP. I pointed the domain's A record at it, added a CNAME for \",[\"$\",\"$L54\",null,{\"children\":\"www\"}],\", and set up an Azure DNS zone to manage everything in one place.\"]}]\n40:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"Routing on the gateway is simple:\"}]\n41:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"$L54\",null,{\"children\":\"/\"}],\" → backend pool (VPS nginx)\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"$L54\",null,{\"children\":\"/api/*\"}],\" → backend pool (same VPS, different nginx location block)\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":\"Everything else → standard nginx rewrite rules\"}],\"\\n\"]}]\n42:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"I considered adding Azure CDN for static asset caching, but the site is mostly server-rendered HTML with small assets. CDN adds complexity — DNS propagation, cache invalidation, additional costs — and the marginal benefit wasn't there. I'll revisit if traffic grows.\"}]\n43:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"step-4-monitoring\",\"children\":\"Step 4 — Monitoring\"}]\n44:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"One thing I always add: Azure Monitor on day one, not as an afterthought.\"}]\n45:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"I set up:\"}]\n46:[\"$\",\"$L2c\",null,{\"as\":\"ul\",\"children\":[\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Metric alerts\"}],\": CPU \u003e 80%, disk \u003e 85%, nginx 5xx rate \u003e 10/min\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Log Analytics workspace\"}],"])</script><script>self.__next_f.push([1,"\": nginx access and error logs piped in via the OMS agent\"]}],\"\\n\",[\"$\",\"$L2d\",null,{\"marginTop\":\"4\",\"marginBottom\":\"8\",\"style\":{\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Application Gateway metrics\"}],\": request count, backend latency, WAF blocked requests\"]}],\"\\n\"]}]\n47:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":\"The client has a dashboard link. They can see traffic patterns, blocked attacks, and server health. It's not Datadog, but it costs $3/month and covers the basics.\"}]\n48:[\"$\",\"$L2b\",null,{\"marginTop\":\"24\",\"marginBottom\":\"12\",\"as\":\"h2\",\"id\":\"what-i-d-do-differently\",\"children\":\"What I'd Do Differently\"}]\n49:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-background-medium mt-8 mb-12\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\",\"lineHeight\":\"175%\"},\"children\":[[\"$\",\"strong\",null,{\"children\":\"Add a staging environment earlier.\"}],\" I initially deployed straight to production, which meant any config mistake was a real problem. Even a single additional VM behind the same Application Gateway as a staging slot would have made the go-live smoother.\"]}]\n4a:[\"$\",\"span\",null,{\"className\":\"font-body font-default font-m neutral-on-backgroun
