d deployed Mobile Application Management policies so corporate data couldn't leave via personal apps on unmanaged phones.\n\n## What made it hard\n\nConditional Access is easy to get wrong in both directions. The first FIDO2 rollout broke access for users on older hardware that didn't support it. We ran a grace period with fallback MFA while hardware was replaced — unplanned but necessary.\n\n## Stack\n\n- Microsoft Intune\n- Microsoft Entra ID\n- Defender for Endpoint (XDR)\n- PowerShell \u0026 Microsoft Graph API\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"rmLVvyC-iO-8joUkZq2jI\",\"c\":[\"\",\"\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"__PAGE__\",{}]},\"$undefined\",\"$undefined\",true],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/93ac2d54f71ec8d4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/d20e0f0702cef329.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/5bae54e6b9cc592a.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/eef662fdc50843a7.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"4\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/b3a7f4834154c9dc.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/fe02e46b350c4d44.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-1\",{\"src\":\"/_next/static/chunks/8a07e6fd7e614a7b.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-2\",{\"src\":\"/_next/static/chu on routing** — routes alerts to the right channel (Teams, Slack, email, PagerDuty) based on severity and type. Sounds simple, but getting the routing logic right for different client environments required more iteration than expected.\n\n## What I learned building these\n\nn8n is genuinely good for this kind of work but error handling in production requires discipline. If a workflow fails silently at 3am because an API returned an unexpected shape, you don't find out until someone asks why something didn't happen. Every critical workflow now has explicit error branches and failure notifications.\n\n## Stack\n\n- n8n (self-hosted)\n- Azure Logic Apps (for some client environments)\n- Microsoft Graph API\n- Microsoft Sentinel\n- HiBob, VirusTotal, AbuseIPDB APIs\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L9\",\"n8n-automation-workflows\",{\"priority\":true,\"href\":\"/work/n8n-automation-workflows\",\"images\":[],\"title\":\"n8n Automation Workflows\",\"description\":\"A library of n8n workflows built for real SecOps and IT ops use cases — alert enrichment, identity lifecycle, license auditing, and incident notification.\",\"content\":\"$15\",\"avatars\":[],\"link\":\"https://github.com/RohiRIK/n8n\",\"heading\":\"h3\"}]\n16:T69a,"])</script><script>self.__next_f.push([1,"\n## What this is\n\nA companion to FleetWatch, built for analytical depth rather than day-to-day fleet operations. Where FleetWatch is fast search and direct device actions, this is compliance trend analysis, cross-fleet aggregations, and audit reporting.\n\nBuilt for environments where the data volume makes native Intune reporting impractical.\n\n## Why OpenSearch\n\nAt 50,000+ devices with hundreds of properties each, the queries that matter for security auditing — \"show me all Windows 10 devices with BitLocker disabled, sorted by last sync time, filtered by region\" — are aggregation queries that relational databases handle poorly at this scale. OpenSearch handles them well and the full-text search is a side benefit.\n\n## What it does\n\n**Elastic search across the fleet** — complex boolean queries on device state. Find devices by any combination of properties in milliseconds.\n\n**Compliance heatmaps** — visualize non-compliant devices by location, department, or OS version. Useful for spotting systemic issues rather than individual device problems.\n\n**Trend analysis** — compliance over time per policy. Shows whether a remediation effort actually worked, or whether drift is recurring.\n\n**Audit exports** — CSV/PDF compliance reports for regulatory requirements. The kind of thing that used to take someone a day to compile manually.\n\n## How data stays current\n\nNode.js workers run continuous sync from Microsoft Graph, pulling device state and pushing updates to OpenSearch. The data is fresh enough for security auditing purposes without hammering the Graph API rate limits.\n\n## Stack\n\n- Next.js\n- OpenSearch (AWS Managed)\n- TypeScript / Node.js\n- Microsoft Graph API\n"])</script><script>self.__next_f.push([1,"c:[\"$\",\"$L9\",\"device-inventory-analytics\",{\"priority\":false,\"href\":\"/work/device-inventory-analytics\",\"images\":[],\"title\":\"Device Inventory Analytics\",\"description\":\"A high-scale device analytics platform for large Intune environments — OpenSearch-powered full-text search, compliance heatmaps, and aggregated reporting across 50,000+ assets.\",\"content\":\"$16\",\"avatars\":[],\"link\":\"\",\"heading\":\"h3\"}]\nd:[\"$\",\"$L6\",null,{\"fillWidth\":true,\"paddingLeft\":\"64\",\"horizontal\":\"end\",\"children\":[\"$\",\"$L8\",null,{\"maxWidth\":48}]}]\n"])</script><script>self.__next_f.push([1,"e:[\"$\",\"$L3\",null,{\"fillWidth\":true,\"gap\":\"24\",\"marginBottom\":\"l\",\"children\":[[\"$\",\"$L6\",null,{\"fillWidth\":true,\"paddingRight\":\"64\",\"children\":[\"$\",\"$L8\",null,{\"maxWidth\":48}]}],[\"$\",\"$L6\",null,{\"fillWidth\":true,\"gap\":\"24\",\"marginTop\":\"40\",\"s\":{\"direction\":\"column\"},\"children\":[[\"$\",\"$L3\",null,{\"flex\":1,\"paddingLeft\":\"l\",\"paddingTop\":\"24\",\"gap\":\"12\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-display font-strong font-xs neutral-on-background-strong\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"balance\"},\"children\":\"Meet the Agent Stack\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"balance\"},\"children\":\"The bounded specialist fleet behind research, implementation, operations, review, and decision support — with human approval for consequential actions.\"}],[\"$\",\"$L7\",null,{\"href\":\"/agent-stack\",\"variant\":\"secondary\",\"size\":\"m\",\"arrowIcon\":true,\"children\":\"Explore the fleet\"}]]}],[\"$\",\"$L3\",null,{\"flex\":3,\"paddingX\":\"20\",\"gap\":\"12\",\"vertical\":\"center\",\"children\":[[\"$\",\"span\",null,{\"className\":\"font-heading font-strong font-l\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"balance\"},\"children\":\"A specialist fleet with clear boundaries.\"}],[\"$\",\"span\",null,{\"className\":\"neutral-on-background-weak\",\"style\":{\"textAlign\":\"$undefined\",\"textWrap\":\"$undefined\"},\"children\":\"Evidence first. Human judgment last.\"}]]}]]}],[\"$\",\"$L6\",null,{\"fillWidth\":true,\"paddingLeft\":\"64\",\"horizontal\":\"end\",\"children\":[\"$\",\"$L8\",null,{\"maxWidth\":48}]}]]}]\n"])</script><script>self.__next_f.push([1,"19:T1808,"])</script><script>self.__next_f.push([1,"\nIntune Autopatch automates Windows, Microsoft 365 Apps, Edge, and Teams updates to improve security and productivity. To ensure patches are correctly applied and systems remain compliant, organizations can use Intune Proactive Remediations to detect missing patches and remediate them automatically. This guide provides a verifiable, end-to-end flow for engineers to implement and validate automated patching.\n\n## Introduction\n\nAutomated patching reduces administrative overhead and improves security posture by ensuring timely updates. Windows Autopatch manages update rings and cadence as a service, while Intune Proactive Remediations allow custom detection and remediation scripts to verify patch state and fix issues automatically.\n\n## Prerequisites\n\n- Licensing: Microsoft 365 Business Premium, Windows 10/11 Education A3/A5, Windows 10/11 Enterprise E3/E5 (including F3), or VDA equivalents.\n- Device platform: Windows 10/11 Enterprise/Education, Windows IoT Enterprise (certain LTSC limitations apply).\n- Network: Internet access to Intune, Windows Update, and Autopatch endpoints.\n\n## Step 1: Verify Prerequisites\n\nConfirm licenses are assigned to users or devices. Ensure devices run supported Windows editions. Validate network connectivity to required endpoints (*.manage.microsoft.com, *.update.microsoft.com, etc.).\n\n## Step 2: Enroll Devices in Windows Autopatch\n\nIn the Microsoft Endpoint Manager admin center:\n1. Navigate to Devices \u003e Windows \u003e Windows Autopatch \u003e Enroll.\n2. Select device groups (Entra groups) to enroll.\n3. Confirm enrollment status in the Autopatch enrollment blade.\n\n## Step 3: Configure Update Rings (if needed)\n\nAutopatch creates default Test and Last rings. Review them via Intune \u003e Devices \u003e Update rings.\n- Avoid assigning custom rings to Autopatch-managed devices; rely on service-managed policies.\n- Adjust ring settings (deferral, grace periods) only for opt-out groups.\n\n## Step 4: Deploy Proactive Remediation Script for Patch Verification\n\nCreate a detection script that checks for the latest quality update KB (returns exit code 0 if compliant, non-zero if action needed). Create a remediation script that triggers Windows Update or resets Windows Update components.\n\nExample detection script (PowerShell):\n```powershell\n# Check for KB500xxxx (example)\n$hotfix = Get-HotFix -ID KB500xxxx -ErrorAction SilentlyContinue\nif ($hotfix) { exit 0 } else { exit 1 }\n```\n\nExample remediation script (PowerShell):\n```powershell\n# Trigger Windows Update scan and install\nusoclient StartScan\nusoclient StartInstall\n# Alternatively, reset Windows Update components\nnet stop wuauserv\nnet stop cryptSvc\nnet stop bits\nnet stop msiserver\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nren C:\\Windows\\System32\\catroot2 catroot2.old\nnet start wuauserv\nnet start cryptSvc\nnet start bits\nnet start msiserver\n```\n\nDeployment steps in Intune:\n1. Upload detection and remediation scripts as a script package (Intune \u003e Devices \u003e Scripts).\n2. Assign to targeting groups (can be the same Autopatch group or Entra group).\n3. Set schedule (e.g., every 8 hours) and user context (System).\n4. Enable notifications for failed detections.\n\n## Step 5: Monitor Compliance and Alerts\n\nMonitor sources:\n- Intune device compliance and update compliance reports.\n- Windows Autopatch Management Status Report (tenant-wide view of eligible devices).\n- Windows Autopatch Alert Report (active alerts, severity, impacted update types).\n\nValidation checks:\n- Detection scripts run on schedule to verify patch state.\n- Manual verification via Get-HotFix, Get-ItemProperty for registry keys, or WSUS/ConfigMgr queries.\n- Handling failed patches:\n  - Detection failure triggers remediation script (e.g., retry Windows Update, reset Windows Update components).\n  - If remediation fails, device marked non-compliant; admin can investigate logs (WindowsUpdate.log, SetupAPI.log).\n  - Rollback options: Use Windows Update for Business uninstall policies, or deploy a script to uninstall the problematic update via wusa.exe /uninstall.\n- Reporting and alerting:\n  - Configure alert rules in Intune for compliance drift.\n  - Use Autopatch alert email notifications or webhook integrations.\n  - Export reports to Power BI or Log Analytics for trend analysis.\n\n## Step 6: Remediate Failures and Verify Fixes\n\n- When detection fails, remediation script runs automatically.\n- Verify success by checking subsequent detection returns exit code 0.\n- If persistent failure, open ticket, collect logs, consider pausing the update ring for that device group.\n\n## Step 7: Review Reports and Adjust Policies\n\n- Weekly: Examine Intune update compliance trends.\n- Monthly: Review Autopatch reports for rollback/pause events.\n- Adjust ring deferrals or exclusion groups based on observed issues.\n- Update detection/remediation scripts as new KBs are released.\n\n## Sources\n\n- Windows Autopatch overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/overview/windows-autopatch-overview\n- Windows Autopatch prerequisites: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/prepare/windows-autopatch-prerequisites\n- Manage Windows Update ring policies (Intune): https://learn.microsoft.com/en-us/intune/device-updates/windows/manage-update-rings\n- Update ring settings reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/ref-update-ring-settings\n- Use Remediations to Detect and Fix Support Issues (Intune): https://learn.microsoft.com/en-us/intune/device-management/tools/deploy-remediations\n- PowerShell Scripts for Remediations reference: https://learn.microsoft.com/en-us/intune/device-management/tools/ref-remediation-scripts\n- Windows Autopatch alerts and remediations: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/alerts-remediations\n- Windows Autopatch management status report: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/monitor/windows-autopatch-management-status-report\n- Windows Autopatch groups overview: https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/deploy/windows-autopatch-groups-overview"])</script><script>self.__next_f.push([1,"f:[\"$\",\"$L3\",null,{\"fillWidth\":true,\"gap\":\"24\",\"marginBottom\":\"l\",\"children\":[[\"$\",\"$L6\",null,{\"fillWidth\":true,\"pad
